async function _doSkincareSync(token, preview, cid, resultEl) {
  try {
    const q = encodeURIComponent('subject:"personalised skincare" newer_than:365d');
    const res = await fetch(`https://gmail.googleapis.com/gmail/v1/users/me/messages?q=${q}&maxResults=100`, {
      headers:{Authorization:'Bearer '+token}
    });
    const list = await res.json();
    const ids = (list.messages||[]).map(m=>m.id);
    const parsed = [];
    for (const id of ids) {
      const msg = await fetch(`https://gmail.googleapis.com/gmail/v1/users/me/messages/${id}?format=minimal`, {
        headers:{Authorization:'Bearer '+token}
      });
      const data = await msg.json();
      const headers = (data.payload&&data.payload.headers)||[];
      const to = (headers.find(h=>h.name==='To')||{}).value||'';
      const dateH = (headers.find(h=>h.name==='Date')||{}).value||'';
      const p = parseSkincareEmail(data.snippet, to, dateH);
      if (p) parsed.push(p);
    }
    const unique = [...new Map(parsed.map(p=>[p.name+'|'+p.date,p])).values()];
    if (preview) {
      if (resultEl) resultEl.innerHTML = `<span style="color:var(--green)">✓ Βρέθηκαν ${unique.length} consultations. Πάτα "Εισαγωγή" για να τα αποθηκεύσεις.</span>`;
      S._skincareQueue = unique;
      return;
    }
    // Insert — matching ΠΡΩΤΑ με phone (μέσω υπαρχόντων ασθενών από Booking247), μετά όνομα
    let ok=0, skip=0;
    for (const c of unique) {
      let pid = null;
      // 1) Email match (αν ο ασθενής έχει email στη βάση)
      if (c.email) {
        const {data:byEmail} = await sb.from('patients').select('id,phone').eq('clinic_id',cid).ilike('email',c.email).limit(1);
        if (byEmail&&byEmail.length) pid = byEmail[0].id;
      }
      // 2) Όνομα match — μόνο ακριβές ονοματεπώνυμο, και μόνο αν είναι μοναδικό (αλλιώς δημιουργείται νέος, βλ. #3)
      if (!pid) {
        const {data:pts} = await sb.from('patients').select('id,phone').eq('clinic_id',cid).ilike('full_name',c.name.trim()).limit(2);
        if (pts&&pts.length===1) pid = pts[0].id;
      }
      // 3) Νέος ασθενής (χωρίς phone — θα ενωθεί αργότερα)
      if (!pid) {
        const {data:np} = await sb.from('patients').insert({clinic_id:cid,full_name:normalizePatientName(c.name),status:'active',source:'skincare_plan'}).select('id').single();
        if (np) pid = np.id;
      }
      if (!pid) continue;
      // Duplicate check
      const {data:ex} = await sb.from('gdpr_consents').select('id').eq('patient_id',pid).filter('signed_at','gte',c.date+'T00:00:00').filter('signed_at','lt',c.date+'T23:59:59').limit(1);
      if (ex&&ex.length) { skip++; continue; }
      // Φέρε phone για αναφορά στο consent_text
      const {data:pt} = await sb.from('patients').select('phone').eq('id',pid).single();
      const phoneNote = pt&&pt.phone ? '\nΤηλέφωνο: '+pt.phone : '';
      await sb.from('gdpr_consents').insert({
        clinic_id:cid, patient_id:pid,
        consent_text:'Skincare Plan | Θεραπεύτρια: '+c.therapist+phoneNote+(c.skin_profile?'\nSkin Profile: '+c.skin_profile:''),
        signed_at:c.date+'T12:00:00'
      });
      if (c.skin_profile) {
        await sb.from('patients').update({medical_history:c.skin_profile}).eq('id',pid).is('medical_history',null);
      }
      ok++;
    }
    if (resultEl) resultEl.innerHTML = `<span style="color:var(--green)">✓ Εισήχθησαν ${ok} consultations (παράλειψη ${skip} υπαρχόντων)</span>`;
    await loadData(); render();
  } catch(e) {
    if (resultEl) resultEl.innerHTML = '<span style="color:var(--red)">Σφάλμα: '+esc(e.message)+'</span>';
  }
}

// ── GOOGLE SHEETS & CSV HELPERS ──
function extractSheetId(urlOrId) {
  if (!urlOrId) return '';
  const m = urlOrId.match(/\/spreadsheets\/d\/([a-zA-Z0-9_-]+)/);
  return m ? m[1] : urlOrId.trim();
}

async function fetchGoogleSheet(sheetId, tabName) {
  const gid = tabName ? `&sheet=${encodeURIComponent(tabName)}` : '';
  const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv${gid}`;
  const resp = await fetch(url);
  if (!resp.ok) throw new Error('Δεν ήταν δυνατή η σύνδεση. Βεβαιώσου ότι το Sheet είναι δημόσιο.');
  const text = await resp.text();
  return parseCSV(text);
}

function parseCSV(text) {
  const lines = text.split('\n').filter(l => l.trim());
  if (!lines.length) return [];
  const headers = parseCSVLine(lines[0]).map(h => h.trim());
  const rows = [];
  for (let i=1; i<lines.length; i++) {
    const vals = parseCSVLine(lines[i]);
    const row = {};
    headers.forEach((h,j) => { row[h] = (vals[j]||'').trim(); });
    rows.push(row);
  }
  return rows;
}

function parseCSVLine(line) {
  const result = [];
  let current = '';
  let inQuotes = false;
  for (let i=0; i<line.length; i++) {
    const ch = line[i];
    if (ch==='"') {
      if (inQuotes && line[i+1]==='"') { current+='"'; i++; }
      else inQuotes = !inQuotes;
    } else if (ch===',' && !inQuotes) {
      result.push(current); current='';
    } else {
      current += ch;
    }
  }
  result.push(current);
  return result;
}

// ── Γενικός parser για επικολλημένα δεδομένα (tab ή comma separated) ──
// Διαφέρει από το parseCSV/parseCSVLine παραπάνω επειδή χειρίζεται σωστά
// πεδία με ΕΝΣΩΜΑΤΩΜΕΝΕΣ αλλαγές γραμμής μέσα σε εισαγωγικά (π.χ. όπως
// βγαίνουν όταν αντιγράφεις-επικολλάς ένα εύρος από Google Sheets) — το
// parseCSV παραπάνω σπάει σε γραμμές πρώτα με text.split('\n'), πράγμα που
// θα έσπαγε λάθος ένα τέτοιο πολυγραμμικό πεδίο στη μέση.
function parseDelimitedText(text) {
  const firstLine = text.slice(0, (text.indexOf('\n') + 1 || text.length + 1) - 1);
  const delimiter = firstLine.split('\t').length >= firstLine.split(',').length ? '\t' : ',';
  const rawRows = [];
  let row = [];
  let field = '';
  let inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQuotes) {
      if (ch === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else {
        field += ch;
      }
    } else if (ch === '"') {
      inQuotes = true;
    } else if (ch === delimiter) {
      row.push(field); field = '';
    } else if (ch === '\n') {
      row.push(field); rawRows.push(row); row = []; field = '';
    } else if (ch === '\r') {
      // skip
    } else {
      field += ch;
    }
  }
  if (field.length || row.length) { row.push(field); rawRows.push(row); }
  const nonEmptyRows = rawRows.filter(r => r.some(v => (v || '').trim()));
  if (!nonEmptyRows.length) return [];
  const headers = nonEmptyRows[0].map(h => h.trim());
  return nonEmptyRows.slice(1).map(vals => {
    const obj = {};
    headers.forEach((h, j) => { obj[h] = (vals[j] || '').trim(); });
    return obj;
  });
}

function historyImportGetCol(row, keywords) {
  for (const k of Object.keys(row)) {
    if (keywords.some(kw => k.includes(kw))) return row[k] || '';
  }
  return '';
}

function parseHistoryTimestamp(raw) {
  if (!raw) return null;
  const datePart = raw.trim().split(' ')[0];
  const iso = parseGreekDate(datePart);
  if (iso) return new Date(iso + 'T00:00:00').toISOString();
  const d = new Date(raw);
  return isNaN(d.getTime()) ? null : d.toISOString();
}

// Κάποιοι πελάτες συμπληρώνουν τη φόρμα ιστορικού πάνω από μία φορά (π.χ. για να
// διορθώσουν κάτι). Χωρίς αυτό, το sync θα εφάρμοζε όποια γραμμή τύχει να είναι
// τελευταία στη σειρά των tabs (Νέα/Παλιά Ιστορικά) — που δεν είναι απαραίτητα η
// πιο πρόσφατη υποβολή, κι έτσι μια παλιότερη/λάθος καταχώρηση θα μπορούσε να
// "νικήσει" μια νεότερη σωστή. Κρατάμε μόνο τη γραμμή με το πιο πρόσφατο
// "Χρονική σήμανση" ανά τηλέφωνο.
function dedupeHistoryRowsByPhone(rows) {
  const byPhone = new Map();
  const noPhone = [];
  for (const row of rows) {
    const phone = normalizePhone(historyImportGetCol(row, ['Τηλέφωνο']));
    if (!phone) { noPhone.push(row); continue; }
    const ts = parseHistoryTimestamp(historyImportGetCol(row, ['Χρονική σήμανση']));
    const prev = byPhone.get(phone);
    if (!prev || (ts && (!prev._ts || ts > prev._ts))) {
      byPhone.set(phone, Object.assign({}, row, { _ts: ts }));
    }
  }
  return [...byPhone.values(), ...noPhone];
}

function buildHistoryImportRow(row) {
  const phone = normalizePhone(historyImportGetCol(row, ['Τηλέφωνο']));
  const name = historyImportGetCol(row, ['Ονοματεπώνυμο']).trim();
  if (!phone && !name) return null;
  const gdprRaw = historyImportGetCol(row, ['Συναιν', 'Συμφων', 'GDPR']);
  const marketingRaw = historyImportGetCol(row, ['προσφορές']);
  return {
    phone, name,
    dob: parseGreekDate(historyImportGetCol(row, ['Ημερομηνία Γέννησης'])),
    email: historyImportGetCol(row, ['Email']),
    city: historyImportGetCol(row, ['Περιοχή Κατοικίας']),
    source: historyImportGetCol(row, ['γνωρίσατε']),
    medical_history: historyImportGetCol(row, ['ΙΑΤΡΙΚΟ ΙΣΤΟΡΙΚΟ']),
    allergies: historyImportGetCol(row, ['Αλλεργίες']),
    medications: historyImportGetCol(row, ['φαρμακευτική']),
    previous_treatments: historyImportGetCol(row, ['Προηγούμενες αισθητικές']),
    avoid_body_areas: historyImportGetCol(row, ['προς αποφυγή']),
    gdpr_signed: /ναι/i.test(gdprRaw),
    marketing_opt_in: /ναι/i.test(marketingRaw),
    gdpr_signed_at: parseHistoryTimestamp(historyImportGetCol(row, ['Χρονική σήμανση'])),
  };
}

function parseGreekDate(str) {
  if (!str) return null;
  const m = str.match(/(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{2,4})/);
  if (!m) return null;
  const y = m[3].length===2 ? '20'+m[3] : m[3];
  let a = parseInt(m[1],10), b = parseInt(m[2],10);
  let day, month;
  if (a > 12 && b <= 12) { day = a; month = b; }        // ήταν ΗΗ/ΜΜ
  else if (b > 12 && a <= 12) { day = b; month = a; }   // ήταν MM/DD (π.χ. από Google Sheets σε US locale)
  else { day = a; month = b; }                           // αμφίσημο, default ΗΗ/ΜΜ (ελληνική σύμβαση)
  if (month < 1 || month > 12 || day < 1 || day > 31) return null; // αποφυγή άκυρης ημερομηνίας
  return `${y}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
}

function parseDateTime(dateStr, timeStr) {
  const d = parseGreekDate(dateStr);
  if (!d) return null;
  const t = timeStr ? timeStr.replace('.',':').substring(0,5) : '09:00';
  return `${d}T${t}:00+03:00`;
}

function mapApptStatus(s) {

  return map[(s||'').toLowerCase()]||'confirmed';
}

// Latin to Greek transliteration map
function latinToGreek(str) {
  const map = {
    'a':'α','b':'β','g':'γ','d':'δ','e':'ε','z':'ζ','h':'η','th':'θ',
    'i':'ι','k':'κ','l':'λ','m':'μ','n':'ν','x':'ξ','o':'ο','p':'π',
    'r':'ρ','s':'σ','t':'τ','u':'υ','f':'φ','ch':'χ','ps':'ψ','w':'ω',
    'c':'κ','y':'υ','v':'β','j':'γ',
    // Common name patterns
    'maria':'μαρία','mara':'μαρα','anna':'αννα','elena':'ελενα','eleni':'ελένη',
    'georgia':'γεωργία','katerina':'κατερίνα','sophia':'σοφία','sofia':'σοφία',
    'nikos':'νίκος','kostas':'κωστας','giorgos':'γιώργος','yannis':'γιάννης',
    'ioannis':'ιωάννης','stavros':'σταύρος','petros':'πέτρος','takis':'τάκης',
    'lina':'λίνα','dina':'ντίνα','tina':'τίνα','nina':'νίνα',
    'anthi':'ανθή','despina':'δέσποινα','vasiliki':'βασιλική','niki':'νίκη',
    'konstantina':'κωνσταντίνα','christina':'χριστίνα','angeliki':'αγγελική',
    'papado':'παπαδο','panou':'πάνου','kosta':'κωστα','theod':'θεοδ',
  };
  let result = str.toLowerCase();
  // Try full word matches first
  Object.entries(map).sort((a,b)=>b[0].length-a[0].length).forEach(([lat,gr]) => {
    result = result.replace(new RegExp(lat, 'gi'), gr);
  });
  return result;
}

// Greek to Latin transliteration (reverse)
function greekToLatin(str) {
  const map = {'α':'a','β':'v','γ':'g','δ':'d','ε':'e','ζ':'z','η':'i','θ':'th','ι':'i','κ':'k','λ':'l','μ':'m','ν':'n','ξ':'x','ο':'o','π':'p','ρ':'r','σ':'s','ς':'s','τ':'t','υ':'y','φ':'f','χ':'ch','ψ':'ps','ω':'o','ά':'a','έ':'e','ή':'i','ί':'i','ό':'o','ύ':'y','ώ':'o','ϊ':'i','ϋ':'y','ΐ':'i','ΰ':'y'};
  return str.toLowerCase().split('').map(c=>map[c]||c).join('');
}

  // Σειρά διαγραφής: πρώτα τα παιδιά (FK σε patients), τελευταίοι οι ασθενείς
  const tables = ['appointments','laser_forms','gdpr_consents','sms_log','pipeline_deals','patients'];

// ── CONSULTATION FORM (in-CRM, αντικαθιστά το εξωτερικό Google Form) ──
// Ίδια λογική με το getExpectedResults() του παλιού Apps Script — keyword
// matching πάνω στο κείμενο του δέρματος/σημειώσεων/θεραπειών, μέχρι 4 αποτελέσματα.
function getConsultationExpectedResults(skinType, notes, step1, step2, step3, bodyExtra) {
  const txt = [skinType, notes, step1, step2, step3, bodyExtra].filter(Boolean).join(' ').toLowerCase();
  let results = [];
  if (txt.includes('βαθύ') || txt.includes('καθαρισ')) results.push('πιο καθαρή και ομοιόμορφη όψη','μείωση θαμπάδας','καλύτερη υφή δέρματος');
  if (txt.includes('υδροδερμ') || txt.includes('hydro')) results.push('ήπια απολέπιση χωρίς ερεθισμό','καθαρότεροι πόροι','άμεση λάμψη');
  if (txt.includes('dermapen') || txt.includes('microneed')) results.push('λείανση υφής','ενεργοποίηση κολλαγόνου','πιο σφριγηλό δέρμα');
  if (txt.includes('μεσοθερ') || txt.includes('meso')) results.push('εντατική ενυδάτωση','ζωντάνια και λάμψη');
  if (txt.includes('ακμ')) results.push('μείωση φλεγμονών','καθαρότερη και πιο ήρεμη επιδερμίδα');
  if (txt.includes('ευαισθ') || txt.includes('barrier') || txt.includes('φραγμ')) results.push('πιο ήρεμο και ισορροπημένο δέρμα','λιγότερους ερεθισμούς στην καθημερινότητα');
  if (!results.length) results = ['καλύτερη υφή','περισσότερη λάμψη','ενισχυμένη ενυδάτωση'];
  return results.slice(0,4);
}

function _cfSplitLines(text) {
  return (text||'').split('\n').map(s=>s.trim()).filter(Boolean);
}

async function _cfLoadServiceOptions() {
  const curated = (S.clinic&&S.clinic.settings&&S.clinic.settings.consultation_services)||[];
  if (curated.length) return [...curated].sort((a,b)=>a.localeCompare(b,'el'));
  const cid = clinicId();
  const {data} = await sb.from('appointments').select('service_name').eq('clinic_id',cid).not('service_name','is',null).limit(2000);
  return [...new Set((data||[]).map(r=>(r.service_name||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'el'));
}

// Εξάγει τα προϊόντα μιας γραμμής HOMECARE (μορφή "Ετικέτα: Προϊόν Α, Προϊόν Β")
// βάσει της ετικέτας — ίδια μορφή με αυτή που γράφει το ίδιο το cf-save παρακάτω.
function _cfParseHomecareLine(text, label) {
  const m = (text||'').match(new RegExp(label+'\\s*:\\s*([^\\n]+)','i'));
  if (!m) return [];
  return m[1].split(',').map(s=>s.trim()).filter(Boolean);
}
// Λίστα προϊόντων ανά κατηγορία (Καθαρισμός/Περιποίηση/Προστασία) από ό,τι έχει ήδη
// χρησιμοποιηθεί σε προηγούμενα consultation της κλινικής — ίδια λογική με το
// _cfLoadServiceOptions() (άντληση από πραγματικά ιστορικά δεδομένα, όχι hardcoded λίστα).
async function _cfLoadHomecareOptions() {
  const sortGr = s => [...s].sort((a,b)=>a.localeCompare(b,'el'));
  const curated = (S.clinic&&S.clinic.settings&&S.clinic.settings.consultation_products)||{};
  const hasCurated = ['cleaning','care','protection','body'].some(cat=>(curated[cat]||[]).length);
  if (hasCurated) {
    return {
      cleaning: sortGr(curated.cleaning||[]),
      care: sortGr(curated.care||[]),
      protection: sortGr(curated.protection||[]),
      body: sortGr(curated.body||[])
    };
  }
  const cid = clinicId();
  const {data} = await sb.from('gdpr_consents').select('consent_text').eq('clinic_id',cid).ilike('consent_text','%HOMECARE%').limit(500);
  const cleaning = new Set(), care = new Set(), protection = new Set(), body = new Set();
  (data||[]).forEach(r => {
    _cfParseHomecareLine(r.consent_text,'Καθημερινός καθαρισμός').forEach(x=>cleaning.add(x));
    _cfParseHomecareLine(r.consent_text,'Ενεργή περιποίηση').forEach(x=>care.add(x));
    _cfParseHomecareLine(r.consent_text,'Προστασία').forEach(x=>protection.add(x));
    _cfParseHomecareLine(r.consent_text,'Περιποίηση σώματος').forEach(x=>body.add(x));
  });
  return { cleaning: sortGr(cleaning), care: sortGr(care), protection: sortGr(protection), body: sortGr(body) };
}

    <select class="form-control cf-homecare-picker" data-target="${targetId}" style="margin-bottom:6px">
      <option value="">➕ Επιλογή από προϊόντα που έχουν ξαναχρησιμοποιηθεί...</option>
      ${options.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('')}
    </select>`;
  // Ίδια λογική προσθήκης με το .cf-service-picker (append γραμμή στο target textarea,
  // όχι αντικατάσταση) — έχει νόημα να επιλεγούν πολλαπλά προβλήματα δέρματος.
  const skinTypePickerHtml = (targetId) => `
    <select class="form-control cf-service-picker" data-target="${targetId}" style="margin-bottom:6px">
      <option value="">➕ Προσθήκη από λίστα...</option>
      ${CF_SKIN_TYPE_OPTIONS.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('')}
    </select>`;

  const ov = document.createElement('div');
  ov.id = 'cf-overlay';
  ov.style.cssText = 'position:fixed;inset:0;background:var(--bg);z-index:9500;overflow-y:auto;padding:24px 16px';
  ov.innerHTML = `
    <div style="max-width:720px;margin:0 auto;background:var(--white);border-radius:16px;padding:28px;box-shadow:var(--shadow-lg)">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px">
        <div>
          <div style="font-size:18px;font-weight:700;color:var(--navy)">Φόρμα Consultation</div>
          <div style="font-size:12px;color:var(--text-2);margin-top:2px">Αποθηκεύεται στην καρτέλα του ασθενή και στέλνεται αυτόματα το προσωποποιημένο skincare plan email</div>
        </div>
        <button onclick="document.getElementById('cf-overlay').remove()" style="background:none;border:none;font-size:22px;cursor:pointer;color:var(--text-2)">×</button>
      </div>

      ${standalone ? `
      <div style="margin-bottom:18px;padding-bottom:18px;border-bottom:1px dashed var(--border-2);position:relative">
        <div style="font-size:11px;font-weight:700;color:var(--text-2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px">Ασθενής</div>
        <input class="form-control" id="cf-patient-search" placeholder="Αναζήτηση ασθενή (όνομα/τηλέφωνο)..." value="${esc(p.full_name||'')}" autocomplete="off"/>
        <div id="cf-patient-results" style="display:none;position:absolute;left:0;right:0;background:var(--white);border:1px solid var(--border-2);border-radius:8px;box-shadow:var(--shadow-lg);z-index:20;max-height:220px;overflow-y:auto;margin-top:4px"></div>
        <div id="cf-patient-mode" style="margin-top:8px;font-size:12px;color:${selectedPatientId?'var(--green)':'var(--red)'}">${selectedPatientId?'✓ Επιλέχθηκε ασθενής':'⚠ Επίλεξε πρώτα έναν υπάρχοντα ασθενή'}</div>
      </div>` : `<input type="hidden" id="cf-patient-search" value="${esc(p.full_name||'')}"/>`}

      <div class="form-row">
        <div class="form-group"><label class="form-label">Θεραπεύτρια/Θεραπευτής</label><input class="form-control" id="cf-therapist-name" value="${esc((S.profile&&S.profile.full_name)||'')}"/></div>
        <div class="form-group"><label class="form-label">Email Θεραπευτή (bcc, προαιρετικό)</label><input class="form-control" id="cf-therapist-email" type="email" value="${esc((S.profile&&S.profile.email)||'')}"/></div>
      </div>

      <div style="font-size:11px;font-weight:700;color:var(--text-2);text-transform:uppercase;letter-spacing:.6px;margin:16px 0 10px">📌 Skin Profile</div>
      <div class="form-group"><label class="form-label">Τύπος Δέρματος / Πρόβλημα</label>${skinTypePickerHtml('cf-skin-type')}<textarea class="form-control" id="cf-skin-type" rows="2" placeholder="π.χ. Anti-aging, Ξηρότητα/Αφυδάτωση (ή γράψε ελεύθερα, μία ανά γραμμή)"></textarea></div>
      <div class="form-group"><label class="form-label">Παρατηρήσεις Θεραπευτή</label><textarea class="form-control" id="cf-notes" rows="2"></textarea></div>

      <div style="font-size:11px;font-weight:700;color:var(--text-2);text-transform:uppercase;letter-spacing:.6px;margin:16px 0 10px">🏥 In-Clinic (επίλεξε από τη λίστα ή γράψε ελεύθερα, μία θεραπεία ανά γραμμή)</div>
      <div class="form-group"><label class="form-label">1) Καθαρισμός &amp; Προετοιμασία</label>${servicePickerHtml('cf-step1')}<textarea class="form-control" id="cf-step1" rows="2"></textarea></div>
      <div class="form-group"><label class="form-label">2) Θρέψη &amp; Αναζωογόνηση</label>${servicePickerHtml('cf-step2')}<textarea class="form-control" id="cf-step2" rows="2"></textarea></div>
      <div class="form-group"><label class="form-label">Massage &amp; Θεραπείες Σώματος (προαιρετικό, μπαίνει στο βήμα 2)</label>${servicePickerHtml('cf-body-extra')}<textarea class="form-control" id="cf-body-extra" rows="2"></textarea></div>
      <div class="form-group"><label class="form-label">3) Ενίσχυση &amp; Διατήρηση</label>${servicePickerHtml('cf-step3')}<textarea class="form-control" id="cf-step3" rows="2"></textarea></div>

      <div style="font-size:11px;font-weight:700;color:var(--text-2);text-transform:uppercase;letter-spacing:.6px;margin:16px 0 10px">🏠 Homecare (επίλεξε από τη λίστα ή γράψε ελεύθερα, ένα προϊόν ανά κατηγορία)</div>
      <div class="form-group"><label class="form-label">Καθημερινός Καθαρισμός</label>${homecarePickerHtml('cf-prod-cleaning', homecareOptions.cleaning)}<textarea class="form-control" id="cf-prod-cleaning" rows="2"></textarea></div>
      <div class="form-group"><label class="form-label">Ενεργή Περιποίηση</label>${homecarePickerHtml('cf-prod-care', homecareOptions.care)}<textarea class="form-control" id="cf-prod-care" rows="2"></textarea></div>
      <div class="form-group"><label class="form-label">Προστασία</label>${homecarePickerHtml('cf-prod-protection', homecareOptions.protection)}<textarea class="form-control" id="cf-prod-protection" rows="2"></textarea></div>
      <div class="form-group"><label class="form-label">Περιποίηση Σώματος</label>${homecarePickerHtml('cf-prod-body', homecareOptions.body)}<textarea class="form-control" id="cf-prod-body" rows="2"></textarea></div>

      <div class="form-group"><label class="form-label">Σημειώσεις</label><textarea class="form-control" id="cf-additional-notes" rows="2"></textarea></div>

      <div id="cf-error" style="color:var(--red);font-size:12px;margin-bottom:8px"></div>
      <div id="cf-send-status" style="font-size:12px;margin-bottom:8px"></div>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:8px">
        <button class="btn btn-ghost" onclick="document.getElementById('cf-overlay').remove()">Κλείσιμο</button>
        <button class="btn btn-ghost" id="cf-send-email" style="display:none">📧 Αποστολή στον Πελάτη</button>
        <button class="btn btn-primary" id="cf-save">Αποθήκευση</button>
      </div>
    </div>`;
  document.body.appendChild(ov);

  ov.querySelectorAll('.cf-service-picker').forEach(sel => {
    sel.onchange = () => {
      if (!sel.value) return;
      const ta = document.getElementById(sel.dataset.target);
      const lines = _cfSplitLines(ta.value);
      if (!lines.includes(sel.value)) lines.push(sel.value);
      ta.value = lines.join('\n');
      sel.value = '';
    };
  });

  ov.querySelectorAll('.cf-homecare-picker').forEach(sel => {
    sel.onchange = () => {
      if (!sel.value) return;
      document.getElementById(sel.dataset.target).value = sel.value;
      sel.value = '';
    };
  });

  if (standalone) {
    const ps = document.getElementById('cf-patient-search');
    let timer = null;
    const showResults = async () => {
      const q = ps.value.trim().replace(/[,()]/g,' ');
      const res = document.getElementById('cf-patient-results');
      if (!q.length) { res.style.display='none'; return; }
      const {data} = await sb.from('patients').select('id,full_name,phone,email').eq('clinic_id',clinicId())
        .or(`full_name.ilike.%${q}%,phone.ilike.%${q}%`).order('full_name').limit(8);
      res.innerHTML = (data||[]).map(pt=>`<div class="cf-pt-opt" style="padding:9px 12px;cursor:pointer;font-size:12px;border-bottom:1px solid var(--border-2)" data-pid="${pt.id}">${esc(pt.full_name)} · ${esc(pt.phone||'')}</div>`).join('')
        || `<div style="padding:9px 12px;font-size:12px;color:var(--text-3)">Κανένα αποτέλεσμα</div>`;
      res.style.display = 'block';
      res.querySelectorAll('.cf-pt-opt').forEach(el => {
        el.onclick = async () => {
          const {data:pt} = await sb.from('patients').select('*').eq('id',el.dataset.pid).single();
          if (pt) openConsultationFormModal({standalone:true, patient:pt});
        };
      });
    };
    ps.onfocus = showResults;
    ps.oninput = () => { clearTimeout(timer); timer = setTimeout(showResults, 200); };
  }

  // savedConsentId: null μέχρι το πρώτο επιτυχημένο Αποθήκευση — από κει και πέρα
  // ξαναπατώντας Αποθήκευση κάνει UPDATE στην ίδια εγγραφή αντί για νέο INSERT,
  // ώστε ο χειριστής να μπορεί να διορθώσει κάτι πριν πατήσει τελικά Αποστολή.
  let savedConsentId = null;

  function _cfBuildPayload() {
    const skinType = _cfSplitLines(document.getElementById('cf-skin-type').value).join(', ');
    const notes = document.getElementById('cf-notes').value.trim();
    const step1 = document.getElementById('cf-step1').value.trim();
    const step2 = document.getElementById('cf-step2').value.trim();
    const bodyExtra = document.getElementById('cf-body-extra').value.trim();
    const step3 = document.getElementById('cf-step3').value.trim();
    const prodCleaning = document.getElementById('cf-prod-cleaning').value.trim();
    const prodCare = document.getElementById('cf-prod-care').value.trim();
    const prodProtection = document.getElementById('cf-prod-protection').value.trim();
    const prodBody = document.getElementById('cf-prod-body').value.trim();
    const additionalNotes = document.getElementById('cf-additional-notes').value.trim();
    const therapistName = document.getElementById('cf-therapist-name').value.trim();
    const therapistEmail = document.getElementById('cf-therapist-email').value.trim();

    const skinLine = [skinType, notes].filter(Boolean).join(' — ');
    const expectedResults = getConsultationExpectedResults(skinType, notes, step1, step2, step3, bodyExtra);

    const step2Items = _cfSplitLines(step2).concat(_cfSplitLines(bodyExtra));
    const inClinicStepsForEmail = [
      {label:'Καθαρισμός & Προετοιμασία', items:_cfSplitLines(step1)},
      {label:'Θρέψη & Αναζωογόνηση', items:step2Items},
      {label:'Ενίσχυση & Διατήρηση', items:_cfSplitLines(step3)},
    ].filter(s => s.items.length);
    const homecareStepsForEmail = [
      {label:'Καθημερινός καθαρισμός', items:_cfSplitLines(prodCleaning)},
      {label:'Ενεργή περιποίηση', items:_cfSplitLines(prodCare)},
      {label:'Προστασία', items:_cfSplitLines(prodProtection)},
      {label:'Περιποίηση σώματος', items:_cfSplitLines(prodBody)},
    ].filter(s => s.items.length);

    const inClinicBlob = [
      step1 ? '1) Καθαρισμός & Προετοιμασία: '+step1.replace(/\n/g,', ') : '',
      step2Items.length ? '2) Θρέψη & Αναζωογόνηση: '+step2Items.join(', ') : '',
      step3 ? '3) Ενίσχυση & Διατήρηση: '+step3.replace(/\n/g,', ') : '',
    ].filter(Boolean).join('\n');
    const homecareBlob = [
      prodCleaning ? 'Καθημερινός καθαρισμός: '+prodCleaning.replace(/\n/g,', ') : '',
      prodCare ? 'Ενεργή περιποίηση: '+prodCare.replace(/\n/g,', ') : '',
      prodProtection ? 'Προστασία: '+prodProtection.replace(/\n/g,', ') : '',
      prodBody ? 'Περιποίηση σώματος: '+prodBody.replace(/\n/g,', ') : '',
    ].filter(Boolean).join('\n');

    const consent_text = 'Skincare Plan | Θεραπεύτρια: '+therapistName
      + (skinLine ? '\nSKIN PROFILE\nΤύπος δέρματος / κύρια ανάγκη:\n'+skinLine : '')
      + (expectedResults.length ? '\nEXPECTED RESULTS\nΤι να περιμένετε:\n'+expectedResults.join(', ') : '')
      + (inClinicBlob ? '\nIN-CLINIC\n'+inClinicBlob : '')
      + (homecareBlob ? '\nHOMECARE\n'+homecareBlob : '');

    return {consent_text, skinLine, expectedResults, inClinicStepsForEmail, homecareStepsForEmail, additionalNotes, therapistEmail};
  }

  // Διορθώνει αυτόματα ορθογραφικά/τυπογραφικά λάθη στα δύο ελεύθερα πεδία
  // κειμένου (όχι στα πεδία που γεμίζουν από curated λίστες — αυτά είναι ήδη
  // σωστά γραμμένα). Αποτυγχάνει σιωπηλά (κρατάει το αρχικό κείμενο) αν η
  // συνάρτηση δεν έχει ακόμα το ANTHROPIC_API_KEY ρυθμισμένο/deployed.
  async function _cfApplyAiSpellcheck() {
    const notesEl = document.getElementById('cf-notes');
    const addEl = document.getElementById('cf-additional-notes');
    const fields = {};
    if (notesEl.value.trim()) fields.notes = notesEl.value.trim();
    if (addEl.value.trim()) fields.additionalNotes = addEl.value.trim();
    if (!Object.keys(fields).length) return;
    try {
      const {data, error} = await sb.functions.invoke('ai-fix-text', {body: {fields}});
      if (error || !data || !data.fields) return;
      if (data.fields.notes) notesEl.value = data.fields.notes;
      if (data.fields.additionalNotes) addEl.value = data.fields.additionalNotes;
    } catch (e) { /* κρατάμε το αρχικό κείμενο του χειριστή */ }
  }

  document.getElementById('cf-save').addEventListener('click', async () => {
    const errEl = document.getElementById('cf-error');
    const statusEl = document.getElementById('cf-send-status');
    errEl.textContent = '';
    if (!selectedPatientId) { errEl.textContent = 'Επίλεξε πρώτα έναν υπάρχοντα ασθενή.'; return; }

    const btn = document.getElementById('cf-save');
    const wasAlreadySaved = !!savedConsentId;
    btn.textContent = 'Έλεγχος ορθογραφίας...'; btn.disabled = true;
    await _cfApplyAiSpellcheck();

    const payload = _cfBuildPayload();
    btn.textContent = wasAlreadySaved ? 'Ενημέρωση...' : 'Αποθήκευση...';

    const {data: patient, error: ptErr} = await sb.from('patients').select('*').eq('id', selectedPatientId).single();
    if (ptErr || !patient) { errEl.textContent = 'Σφάλμα: '+(ptErr&&ptErr.message||'δεν βρέθηκε ασθενής'); btn.textContent = wasAlreadySaved?'Ενημέρωση':'Αποθήκευση'; btn.disabled=false; return; }

    if (wasAlreadySaved) {
      const {error: updErr} = await sb.from('gdpr_consents').update({consent_text: payload.consent_text}).eq('id', savedConsentId);
      if (updErr) { errEl.textContent = 'Σφάλμα: '+updErr.message; btn.textContent='Ενημέρωση'; btn.disabled=false; return; }
    } else {
      const {data: inserted, error: insErr} = await sb.from('gdpr_consents').insert({
        clinic_id: clinicId(), patient_id: selectedPatientId, consent_text: payload.consent_text, signed_at: new Date().toISOString(),
      }).select('id').single();
      if (insErr) { errEl.textContent = 'Σφάλμα: '+insErr.message; btn.textContent='Αποθήκευση'; btn.disabled=false; return; }
      savedConsentId = inserted.id;
    }

    if (payload.skinLine) await sb.from('patients').update({medical_history: payload.skinLine}).eq('id', selectedPatientId).is('medical_history', null);

    btn.textContent = 'Ενημέρωση'; btn.disabled = false;
    const sendBtn = document.getElementById('cf-send-email');
    if (patient.email) {
      sendBtn.style.display = '';
      statusEl.innerHTML = '<span style="color:var(--green)">✓ Αποθηκεύτηκε. Έλεγξε τα στοιχεία και πάτησε «Αποστολή στον Πελάτη» όταν είσαι έτοιμος/η — δεν στέλνεται αυτόματα.</span>';
    } else {
      statusEl.innerHTML = '<span style="color:var(--text-2)">✓ Αποθηκεύτηκε (ο ασθενής δεν έχει καταχωρημένο email — δεν μπορεί να σταλεί).</span>';
    }

    if (S.patientDetail && S.patientDetail.id === selectedPatientId) await loadPatientDetail(selectedPatientId);
    if (S.page === 'consultations') await loadData();
  });

  document.getElementById('cf-send-email').addEventListener('click', async () => {
    if (!savedConsentId) return;
    const statusEl = document.getElementById('cf-send-status');
    const sendBtn = document.getElementById('cf-send-email');
    sendBtn.textContent = 'Αποστολή...'; sendBtn.disabled = true;

    // Ξανα-χτίζουμε το payload εδώ (όχι από το save) γιατί ο χειριστής μπορεί να
    // διόρθωσε κάτι στη φόρμα μετά το τελευταίο Αποθήκευση· κρατάμε και την
    // εγγραφή στη βάση συγχρονισμένη με ό,τι στέλνεται τελικά.
    const payload = _cfBuildPayload();
    await sb.from('gdpr_consents').update({consent_text: payload.consent_text}).eq('id', savedConsentId);

    const {data: patient} = await sb.from('patients').select('email,full_name').eq('id', selectedPatientId).single();
    const clinicInfo = S.clinic || {};
    const {data: emailResult, error: emailErr} = await sb.functions.invoke('send-consultation-email', {
      body: {
        to: patient&&patient.email, therapist_email: payload.therapistEmail || undefined,
        clinic_name: clinicInfo.name, client_name: patient&&patient.full_name,
        skin_line: payload.skinLine, expected_results: payload.expectedResults,
        in_clinic_steps: payload.inClinicStepsForEmail, homecare_steps: payload.homecareStepsForEmail,
        additional_notes: payload.additionalNotes,
        booking_link: clinicInfo.booking_link, website_link: clinicInfo.website,
        instagram_link: clinicInfo.instagram, facebook_link: clinicInfo.facebook, maps_link: clinicInfo.maps_link,
      },
    });
    const emailErrMsg = emailErr ? await extractInvokeErrorMessage(emailErr) : (emailResult&&emailResult.error||'');
    sendBtn.disabled = false;
    if (emailErrMsg) {
      sendBtn.textContent = '📧 Αποστολή στον Πελάτη';
      statusEl.innerHTML = '<span style="color:var(--red)">⚠ Το email δεν στάλθηκε: '+esc(emailErrMsg)+'</span>';
    } else {
      sendBtn.textContent = '✓ Στάλθηκε';
      statusEl.innerHTML = '<span style="color:var(--green)">✓ Το email στάλθηκε στον πελάτη.</span>';
    }
  });
}

// ── ΕΚΚΡΕΜΕΙΣ CONSULTATIONS — χειροκίνητη σύνδεση με ασθενή ──
function openLinkConsultationModal(ucId) {
  const u = (S.unmatchedConsultations||[]).find(x=>x.id===ucId);
  if (!u) return;
  const old = document.getElementById('lc-overlay'); if (old) old.remove();
  const ov = document.createElement('div');
  ov.id = 'lc-overlay';
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9000;display:flex;align-items:center;justify-content:center;padding:16px';
  ov.innerHTML = `
    <div style="background:var(--white);border-radius:16px;max-width:480px;width:100%;padding:20px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <div style="font-size:15px;font-weight:700">Σύνδεση με ασθενή</div>
        <button onclick="document.getElementById('lc-overlay').remove()" style="background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-2)">×</button>
      </div>
      <div style="background:var(--surface-2);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:12px">
        <b>${esc(u.parsed_name||'')}</b><br>${esc(u.parsed_email||'')}${u.parsed_phone?' · '+esc(u.parsed_phone):''}
      </div>
      <label class="form-label">Αναζήτηση ασθενή</label>
      <input class="form-control" id="uc-patient-search" placeholder="Όνομα ή τηλέφωνο..." autocomplete="off"/>
      <div id="uc-patient-results" style="margin-top:6px;max-height:240px;overflow-y:auto;border-radius:10px;display:none"></div>
    </div>`;
  document.body.appendChild(ov);

  const ps = document.getElementById('uc-patient-search');
  let timer = null;
  const showResults = async () => {
    const q = ps.value.trim().replace(/[,()]/g,' ');
    const res = document.getElementById('uc-patient-results');
    let query = sb.from('patients').select('id,full_name,phone').eq('clinic_id',clinicId());
    if (q.length>=1) query = query.or(`full_name.ilike.%${q}%,phone.ilike.%${q}%`);
    const {data} = await query.order('full_name').limit(8);
    res.innerHTML = (data||[]).map(p=>`<div style="padding:9px 12px;cursor:pointer;font-size:12px;background:var(--white);border-bottom:1px solid var(--border-2)" data-pid="${p.id}" data-pname="${esc(p.full_name)}">${esc(p.full_name)} · ${esc(p.phone||'')}</div>`).join('')
      || `<div style="padding:9px 12px;font-size:12px;color:var(--text-3);background:var(--white)">Κανένα αποτέλεσμα</div>`;
    res.style.display = 'block';
    res.querySelectorAll('[data-pid]').forEach(el => {
      el.onclick = () => confirmLinkConsultation(u.id, el.dataset.pid, el.dataset.pname);
    });
  };
  ps.onfocus = showResults;
  ps.oninput = () => { clearTimeout(timer); timer = setTimeout(showResults, 200); };
}

async function confirmLinkConsultation(ucId, patientId, patientName) {
  const u = (S.unmatchedConsultations||[]).find(x=>x.id===ucId);
  if (!u) return;
  if (!confirm(`Σύνδεση του consultation του/της "${u.parsed_name}" με τον ασθενή "${patientName}";`)) return;
  const {error: insErr} = await sb.from('gdpr_consents').insert({
    clinic_id: clinicId(), patient_id: patientId, consent_text: u.consent_text, signed_at: u.received_at
  });
  if (insErr) { alert('Σφάλμα: '+insErr.message); return; }
  await sb.from('unmatched_consultations').delete().eq('id', ucId);
  const ov = document.getElementById('lc-overlay'); if (ov) ov.remove();
  S.unmatchedConsultations = (S.unmatchedConsultations||[]).filter(x=>x.id!==ucId);
  render();
}

async function discardUnmatchedConsultation(ucId) {
  if (!confirm('Διαγραφή αυτού του consultation χωρίς σύνδεση σε ασθενή; Η ενέργεια δεν αναιρείται.')) return;
  await sb.from('unmatched_consultations').delete().eq('id', ucId);
  S.unmatchedConsultations = (S.unmatchedConsultations||[]).filter(x=>x.id!==ucId);
  render();
}

// ── ΕΠΕΞΕΡΓΑΣΙΑ ΣΤΟΙΧΕΙΩΝ ΑΣΘΕΝΗ (καρτέλα) ──

  'Αιμορροφιλία', 'Πρόσφατο Χειρουργείο', 'Αυτοάνοσα νοσήματα', 'Εγκυμοσύνη',
  'Θηλασμός', 'Δερματικά νοσήματα', 'Πολυκυστικές ωοθήκες', 'Κάπνισμα',
];

function historyFormParseList(text, knownValues) {
  const checked = new Set();
  let rest = (text || '').trim();
  knownValues.forEach(v => {
    if (rest.includes(v)) { checked.add(v); rest = rest.split(v).join(''); }
  });
  rest = rest.replace(/,\s*,/g, ',').replace(/^[,\s]+|[,\s]+$/g, '');
  return { checked, other: rest };
}

      <div style="font-size:11px;font-weight:700;color:var(--text-2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px">📌 Προσωπικά Στοιχεία</div>

      <div class="form-group"><label class="form-label">Προηγούμενες αισθητικές θεραπείες (ποιες)</label><input class="form-control" id="hf-previous-treatments" value="${esc(p.previous_treatments || '')}"/></div>

          ${integrations.privacy_policy_link ? `<br/><a href="${esc(integrations.privacy_policy_link)}" target="_blank">${esc(integrations.privacy_policy_link)}</a>` : ''}</span>
        </label>
      </div>

      <div style="margin-top:14px">
        <div style="font-size:13px;margin-bottom:8px">Θέλω να λαμβάνω email από το Beauty Line με επιστημονικά νέα, οδηγίες και tips για την φροντίδα της επιδερμίδας μου.</div>
        <div style="display:flex;gap:16px">
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px"><input type="radio" name="hf-marketing" value="yes" ${p.marketing_opt_in === true ? 'checked' : ''} style="accent-color:var(--blue)"/> Ναι</label>
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px"><input type="radio" name="hf-marketing" value="no" ${p.marketing_opt_in === false ? 'checked' : ''} style="accent-color:var(--blue)"/> Όχι</label>
        </div>
      </div>

      <div style="margin-top:18px;padding-top:14px;border-top:1px dashed var(--border-2)">
        <div style="font-size:11px;font-weight:700;color:var(--text-2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">✍️ Υπογραφή ασθενούς (προαιρετικό — αν ο ασθενής είναι παρών)</div>
        <div style="font-size:11px;color:var(--text-2);margin-bottom:8px">Αν υπογραφεί, αποθηκεύεται πλήρες αντίγραφο της φόρμας όπως συμπληρώθηκε, με ισχύ 1 έτους. Χωρίς υπογραφή, η φόρμα αποθηκεύεται κανονικά όπως πριν.</div>
        <canvas id="hf-canvas" width="620" height="140" style="width:100%;height:140px;border:2px dashed var(--border);border-radius:10px;background:#fff;touch-action:none"></canvas>
        <div style="display:flex;justify-content:flex-end;margin-top:6px">
          <button type="button" class="btn btn-sm" onclick="hfClearCanvas()" style="font-size:11px">↺ Καθαρισμός</button>

  hfInitCanvas();

  // Standalone mode: αναζήτηση/επιλογή υπάρχοντος ασθενή, ή άφησέ το ασυμπλήρωτο
  // για νέο ασθενή — τότε η Υποβολή θα τον δημιουργήσει αυτόματα με ό,τι γράφτηκε.
  if (standalone) {
    const psEl = document.getElementById('hf-patient-search');
    const resEl = document.getElementById('hf-patient-results');
    const modeEl = document.getElementById('hf-patient-mode');
    let psTimer = null;
    const showResults = async () => {
      const q = psEl.value.trim().replace(/[,()]/g,' ');
      if (q.length < 1) { resEl.style.display='none'; return; }
      const {data} = await sb.from('patients').select('id,full_name,phone').eq('clinic_id',clinicId())
        .or(`full_name.ilike.%${q}%,phone.ilike.%${q}%`).order('full_name').limit(8);
      const rows = (data||[]).map(pt=>`<div class="hf-pt-opt" style="padding:9px 12px;cursor:pointer;font-size:12px" data-pid="${pt.id}">${esc(pt.full_name)} · ${esc(pt.phone||'')}</div>`).join('');

      resEl.style.display='block';
      resEl.querySelectorAll('.hf-pt-opt').forEach(el => {
        el.onmouseover = () => el.style.background='var(--surface)';
        el.onmouseout = () => el.style.background='';
        el.onclick = async () => {
          const {data:full} = await sb.from('patients').select('*').eq('id',el.dataset.pid).single();
          resEl.style.display='none';
          await openHistoryFormModal({standalone:true, patient: full});
        };
      });
    };
    psEl.onfocus = showResults;
    psEl.oninput = () => {
      selectedPatientId = null;
      modeEl.style.color = 'var(--text-2)';
      modeEl.textContent = '✏️ Γράψε όνομα για αναζήτηση, ή συμπλήρωσε τα στοιχεία παρακάτω για νέο ασθενή';
      clearTimeout(psTimer); psTimer = setTimeout(showResults, 200);
    };
    document.addEventListener('click', (e) => {
      if (resEl && !e.target.closest('#hf-patient-search') && !e.target.closest('#hf-patient-results')) resEl.style.display='none';
    });
  }

  document.getElementById('hf-save').addEventListener('click', async () => {
    const errEl = document.getElementById('hf-error');
    const name = document.getElementById('hf-name').value.trim();
    const dob = document.getElementById('hf-dob').value;
    const phone = document.getElementById('hf-phone').value.trim();
    const email = document.getElementById('hf-email').value.trim();
    const city = document.getElementById('hf-city').value.trim();
    const sourceEl = document.querySelector('input[name="hf-source"]:checked');
    const source = sourceEl && sourceEl.value === '__other__' ? document.getElementById('hf-source-other').value.trim() : (sourceEl ? sourceEl.value : '');
    const gdpr = document.getElementById('hf-gdpr').checked;
    const marketingEl = document.querySelector('input[name="hf-marketing"]:checked');
    // Μόνο ό,τι χρειάζεται πραγματικά για να καταγραφεί έγκυρα η συναίνεση GDPR είναι
    // υποχρεωτικό (Όνομα, Τηλέφωνο, αποδοχή GDPR) — τα υπόλοιπα (DOB/Email/Περιοχή/Πηγή/
    // marketing) είναι χρήσιμα αλλά δεν πρέπει να μπλοκάρουν την καταχώρηση όταν απλά δεν
    // είναι γνωστά τη στιγμή που συμπληρώνεται η φόρμα στο ταμείο.
    if (!name || !phone || !gdpr) {
      errEl.textContent = 'Συμπλήρωσε Ονοματεπώνυμο, Τηλέφωνο και αποδέξου τη συναίνεση GDPR.';
      errEl.scrollIntoView({behavior:'smooth', block:'center'});
      return;
    }
    if (dob) {
      const dobDate = new Date(dob + 'T00:00:00');
      const age = (Date.now() - dobDate.getTime()) / (365.25 * 24 * 3600 * 1000);
      if (dobDate.getTime() > Date.now() || age > 120) {
        errEl.textContent = 'Η ημερομηνία γέννησης δεν είναι έγκυρη — έλεγξε ξανά την τιμή.';
        errEl.scrollIntoView({behavior:'smooth', block:'center'});
        return;
      }
    }
    const conditions = Array.from(document.querySelectorAll('.hf-condition:checked')).map(el => el.value);
    const conditionOther = document.getElementById('hf-condition-other').value.trim();
    const medicalHistory = [...conditions, conditionOther ? `Other: ${conditionOther}` : null].filter(Boolean).join(', ');

    const btn = document.getElementById('hf-save');
    btn.textContent = 'Αποθήκευση...'; btn.disabled = true;
    const patch = {
      full_name: normalizePatientName(name), dob: dob || null, phone, email: email || null, city: city || null,
      source: source || null,
      medical_history: medicalHistory || null,
      allergies: document.getElementById('hf-allergies').value.trim() || null,
      medications: document.getElementById('hf-medications').value.trim() || null,
      previous_treatments: document.getElementById('hf-previous-treatments').value.trim() || null,
      avoid_body_areas: document.getElementById('hf-avoid-areas').value.trim() || null,
      gdpr_signed: true,
      gdpr_signed_at: p.gdpr_signed ? undefined : new Date().toISOString(),
      marketing_opt_in: marketingEl ? marketingEl.value === 'yes' : undefined,
      medical_history_completed: true,
      medical_history_completed_at: p.medical_history_completed ? undefined : new Date().toISOString(),
    };

    let finalPatientId = selectedPatientId;
    if (selectedPatientId) {
      const {error} = await sb.from('patients').update(patch).eq('id', selectedPatientId);
      if (error) { errEl.textContent = 'Σφάλμα: ' + error.message; btn.textContent = 'Υποβολή'; btn.disabled = false; return; }
    } else {
      const {data:newPt, error} = await sb.from('patients').insert(Object.assign({clinic_id: clinicId(), status: 'active'}, patch)).select('id').single();
      if (error) { errEl.textContent = 'Σφάλμα: ' + error.message; btn.textContent = 'Υποβολή'; btn.disabled = false; return; }
      finalPatientId = newPt && newPt.id;
    }

    // Προαιρετική υπογραφή: αν υπάρχει μελάνι στο canvas, αποθηκεύουμε ΕΠΙΠΛΕΟΝ ένα πλήρες

    if (_hfHasInk && finalPatientId) {

      };

        clinic_id: clinicId(), patient_id: finalPatientId, signed_at: new Date().toISOString(),

let _svcDrawing = false, _svcHasInk = false;

function openGroupConsentModal(groupKey) {
  const p = S.patientDetail; if (!p) return;
  const g = SERVICE_CONSENT_GROUPS[groupKey]; if (!g) return;
  const old = document.getElementById('lc-overlay'); if (old) old.remove();
  const ov = document.createElement('div');
  ov.id = 'lc-overlay';
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9000;display:flex;align-items:center;justify-content:center;padding:12px';
  ov.innerHTML = `
    <div style="background:var(--white);border-radius:16px;max-width:680px;width:100%;max-height:92vh;overflow-y:auto;padding:20px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div style="font-size:15px;font-weight:700;color:${g.color}">Συναίνεση: ${esc(g.title)} — ${esc(p.full_name)}</div>
        <button onclick="document.getElementById('lc-overlay').remove()" style="background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-2)">×</button>
      </div>
      ${g.text(p.full_name)}
      <div style="margin-top:14px">
        <div style="font-size:11px;font-weight:700;color:${g.color};text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">Υπογραφή ασθενούς (με το δάχτυλο ή γραφίδα)</div>
        <canvas id="svc-canvas" width="620" height="160" style="width:100%;height:160px;border:2px dashed var(--border);border-radius:10px;background:#fff;touch-action:none"></canvas>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:10px;flex-wrap:wrap">
          <button class="btn btn-sm" onclick="svcClearCanvas()" style="font-size:11px">↺ Καθαρισμός</button>
          <div style="font-size:10px;color:var(--text-3)">Υπογράφοντας δηλώνετε αποδοχή των ανωτέρω · ${new Date().toLocaleDateString('el-GR')}</div>
          <button class="btn" onclick="saveGroupConsent('${groupKey}')" style="background:${g.color};color:#fff;font-weight:700">✓ Υπογραφή & Αποθήκευση</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(ov);
  const cv = document.getElementById('svc-canvas');
  const ctx = cv.getContext('2d');
  ctx.strokeStyle = '#0E2757'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  const pos = (e) => {
    const r = cv.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return {x:(t.clientX-r.left)*(cv.width/r.width), y:(t.clientY-r.top)*(cv.height/r.height)};
  };
  const start = (e) => { e.preventDefault(); _svcDrawing=true; const p2=pos(e); ctx.beginPath(); ctx.moveTo(p2.x,p2.y); };
  const move = (e) => { if(!_svcDrawing) return; e.preventDefault(); const p2=pos(e); ctx.lineTo(p2.x,p2.y); ctx.stroke(); _svcHasInk=true; };
  const end = () => { _svcDrawing=false; };
  cv.addEventListener('mousedown',start); cv.addEventListener('mousemove',move); window.addEventListener('mouseup',end);
  cv.addEventListener('touchstart',start,{passive:false}); cv.addEventListener('touchmove',move,{passive:false}); cv.addEventListener('touchend',end);
  _svcHasInk = false;
}

function svcClearCanvas() {
  const cv = document.getElementById('svc-canvas');
  cv.getContext('2d').clearRect(0,0,cv.width,cv.height);
  _svcHasInk = false;
}

  const cv = document.getElementById('svc-canvas');
  const photo = document.getElementById('svc-photo');
  const {data, error} = await sb.from('service_consents').insert({
    clinic_id: clinicId(),
    patient_id: p.id,
    consent_group: g.dbKey,
    signed_at: new Date().toISOString(),
    signature_data: cv.toDataURL('image/png'),
    photo_consent: photo ? photo.checked : false,
    collected_by: (S.profile&&S.profile.full_name)||'',
    consent_version: 'v1'
  }).select('*').single();
  if (error) { alert('Σφάλμα: '+error.message); return; }
  if (groupKey==='cleansing') { S.serviceConsentCleansing = data; if (S.cleansingConsentIds) S.cleansingConsentIds.add(p.id); }
  else if (groupKey==='peelings') { S.serviceConsentPeelings = data; if (S.peelingsConsentIds) S.peelingsConsentIds.add(p.id); }
  else { S.serviceConsentOxygen = data; if (S.oxygenConsentIds) S.oxygenConsentIds.add(p.id); }
  document.getElementById('lc-overlay').remove();
  const panel = document.getElementById('appt-detail-panel');
  if (panel) panel.style.display = 'none'; // κλείσιμο popup ραντεβού μετά την υπογραφή
  render();
}

// Άνοιγμα φόρμας συναίνεσης απευθείας από το popup ραντεβού στο Πρόγραμμα —
// χωρίς να χρειάζεται να ανοίξεις πρώτα ολόκληρη την καρτέλα του ασθενή.
function openConsentFromAppointment(patientId, patientName, group) {
  S.patientDetail = S.patientDetail && S.patientDetail.id===patientId
    ? S.patientDetail
    : {id: patientId, full_name: patientName};
  if (group === 'laser') openLaserConsentModal();
  else openGroupConsentModal(group);
}

function viewGroupConsent(groupKey) {
  const g = SERVICE_CONSENT_GROUPS[groupKey]; if (!g) return;
  const c = groupKey==='cleansing' ? S.serviceConsentCleansing : groupKey==='peelings' ? S.serviceConsentPeelings : S.serviceConsentOxygen;
  if (!c) return;
  const p = S.patientDetail;
  const old = document.getElementById('lc-overlay'); if (old) old.remove();
  const ov = document.createElement('div');
  ov.id = 'lc-overlay';
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9000;display:flex;align-items:center;justify-content:center;padding:12px';
  ov.innerHTML = `
    <div style="background:var(--white);border-radius:16px;max-width:680px;width:100%;max-height:92vh;overflow-y:auto;padding:20px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div style="font-size:15px;font-weight:700;color:${g.color}">Συναίνεση: ${esc(g.title)} — ${esc(p&&p.full_name||'')}</div>
        <button onclick="document.getElementById('lc-overlay').remove()" style="background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-2)">×</button>
      </div>
      ${g.text(p&&p.full_name||'')}
      <div style="margin-top:12px;font-size:11px;color:var(--text-2)">
        Υπεγράφη: <b>${new Date(c.signed_at).toLocaleString('el-GR')}</b> · Συλλογή: ${esc(c.collected_by||'—')} · Φωτογραφίες: ${c.photo_consent?'✓ Ναι':'✗ Όχι'}
      </div>
      <img src="${c.signature_data}" style="margin-top:8px;border:1px solid var(--border);border-radius:10px;max-width:100%;background:#fff"/>
    </div>`;
  document.body.appendChild(ov);
  const ph = ov.querySelector('#svc-photo'); if (ph) { ph.checked = !!c.photo_consent; ph.disabled = true; }
}

// ── ΦΩΤΟΓΡΑΦΙΕΣ ΑΣΘΕΝΗ ──
function clearPhotoSelection() { _selectedPhotoIds.clear(); render(); }

async function deletePatientPhoto(id, path) {
  if (!confirm('Διαγραφή αυτής της φωτογραφίας; Η ενέργεια δεν αναιρείται.')) return;
  await sb.storage.from('patient-photos').remove([path]);
  await sb.from('patient_photos').delete().eq('id', id);
  _selectedPhotoIds.delete(id);
  await loadPatientDetail(S.patientDetail.id);
  render();
}

function openPhotoComparison() {
  if (_selectedPhotoIds.size !== 2) return;
  const ids = [..._selectedPhotoIds];
  const photos = (S.patientPhotos||[]).filter(p=>ids.includes(p.id));
  if (photos.length !== 2) return;
  photos.sort((a,b)=> new Date(a.taken_at) - new Date(b.taken_at)); // παλιότερη = ΠΡΙΝ, νεότερη = ΜΕΤΑ
  const [before, after] = photos;
  const old = document.getElementById('lc-overlay'); if (old) old.remove();
  const ov = document.createElement('div');
  ov.id = 'lc-overlay';
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:9000;display:flex;align-items:center;justify-content:center;padding:16px';
  ov.innerHTML = `
    <div style="background:var(--white);border-radius:16px;max-width:900px;width:100%;max-height:92vh;overflow-y:auto;padding:20px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <div style="font-size:15px;font-weight:700;color:var(--navy)">Σύγκριση Before / After — ${esc((S.patientDetail&&S.patientDetail.full_name)||'')}</div>
        <button onclick="document.getElementById('lc-overlay').remove()" style="background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-2)">×</button>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
        <div>
          <div style="text-align:center;font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--text-2);margin-bottom:6px">ΠΡΙΝ · ${new Date(before.taken_at).toLocaleDateString('el-GR')}</div>
          <img src="${before.url}" style="width:100%;border-radius:10px;display:block"/>
        </div>
        <div>
          <div style="text-align:center;font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--blue);margin-bottom:6px">ΜΕΤΑ · ${new Date(after.taken_at).toLocaleDateString('el-GR')}</div>
          <img src="${after.url}" style="width:100%;border-radius:10px;display:block"/>
        </div>
      </div>
    </div>`;
  document.body.appendChild(ov);
}

async function globalSearch(q) {
  q = (q||'').replace(/[,()]/g,' ').trim();
  if (!q || q.length < 2) { S.globalResults = []; updateSearchDropdown(); return; }
  if (panicActive() && !isSuperAdmin()) { S.globalResults = []; updateSearchDropdown(); return; }
  const cid = clinicId();
  if (!cid) return;
  const results = [];

  // Build search variants
  const qLower = q.toLowerCase();
  const qGreek = latinToGreek(qLower);
  const qLatin = greekToLatin(qLower);

  // Build OR filter for all variants
  const buildFilter = (field) => {
    const variants = [...new Set([qLower, qGreek, qLatin])].filter(v=>v.length>1);
    return variants.map(v=>`${field}.ilike.%${v}%`).join(',');
  };

  // Search patients - name, phone, email
  const {data:pts} = await sb.from('patients').select('id,full_name,phone,status,email')
    .eq('clinic_id',cid)
    .or(`full_name.ilike.%${qLower}%,full_name.ilike.%${qGreek}%,full_name.ilike.%${qLatin}%,phone.ilike.%${qLower}%,email.ilike.%${qLower}%`)
    .limit(6);
  (pts||[]).forEach(p => results.push({
    type:'patient', id:p.id,
    title:p.full_name,
    sub:p.phone||p.email||'',
    tag:(STATUS_PAT[p.status]&&STATUS_PAT[p.status].l)||p.status||'—'
  }));

  // Search appointments by service name
  const {data:apts} = await sb.from('appointments')
    .select('id,patient_id,service_name,start_time,status,patients(full_name)')
    .eq('clinic_id',cid)
    .or(`service_name.ilike.%${qLower}%,service_name.ilike.%${qGreek}%`)
    .limit(3);
  (apts||[]).forEach(a => results.push({
    type:'appointment', id:a.patient_id||a.id,
    title:(a.patients&&a.patients.full_name)||a.service_name||'—',
    sub:a.service_name+' · '+fmtDt(a.start_time),
    tag:(STATUS_APPT[a.status]&&STATUS_APPT[a.status].l)||a.status
  }));

  // Remove duplicates by id
  const seen = new Set();
  S.globalResults = results.filter(r => {
    const key = r.type+r.id;
    if (seen.has(key)) return false;
    seen.add(key); return true;
  });
  updateSearchDropdown();
}

// ── VOICE AGENT ──
let _recognition = null;
let _voiceProcessing = false;

function startVoiceAgent() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    alert('Ο browser σου δεν υποστηρίζει φωνητική αναγνώριση. Χρησιμοποίησε Chrome.');
    return;
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  _recognition = new SR();
  _recognition.lang = 'el-GR';
  _recognition.continuous = false;
  _recognition.interimResults = false;
  _recognition.onresult = (e) => {
    const text = e.results[0][0].transcript;
    S.voiceActive = false;
    S.voiceResult = '🎤 "' + text + '" — Επεξεργασία...';
    render();
    processVoiceCommand(text);
  };
  _recognition.onerror = () => { S.voiceActive=false; S.voiceResult='❌ Δεν ακούστηκε τίποτα. Δοκίμασε ξανά.'; render(); };
  _recognition.onend = () => { if(S.voiceActive) { S.voiceActive=false; render(); } };
  S.voiceActive = true;
  render();
  _recognition.start();
}

function stopVoiceAgent() {
  if (_recognition) _recognition.stop();
  S.voiceActive = false;
  render();
}

async function processVoiceCommand(text) {
  const t = text.toLowerCase().trim();
  // Navigation commands
  if (t.includes('dashboard') || t.includes('αρχική')) { S.page='dashboard'; S.voiceResult='✓ Πήγα στο Dashboard'; await loadPageData(); render(); return; }
  if (t.includes('ασθεν') || t.includes('πελάτ')) { S.page='patients'; S.voiceResult='✓ Άνοιξα τους Ασθενείς'; await loadPageData(); render(); return; }
  if (t.includes('ραντεβού') || t.includes('προγραμμα')) { S.page='appointments'; S.voiceResult='✓ Άνοιξα τα Ραντεβού'; await loadPageData(); render(); return; }
  if (t.includes('calendar') || t.includes('πρόγραμμα') || t.includes('ημερολόγιο')) { S.page='calendar'; S.voiceResult='✓ Άνοιξα το Πρόγραμμα'; await loadPageData(); render(); return; }
  if (t.includes('ρυθμίσεις') || t.includes('settings')) { S.page='settings'; S.voiceResult='✓ Άνοιξα τις Ρυθμίσεις'; render(); return; }

  // New appointment
  if ((t.includes('νέο') || t.includes('καινούργιο') || t.includes('προσθ')) && t.includes('ραντεβού')) {
    S.modal='new-appt'; S.voiceResult='✓ Άνοιξα φόρμα νέου ραντεβού'; render(); return;
  }
  // New patient
  if ((t.includes('νέο') || t.includes('καινούργιο') || t.includes('προσθ')) && (t.includes('ασθεν') || t.includes('πελάτ'))) {
    S.modal='new-patient'; S.voiceResult='✓ Άνοιξα φόρμα νέου ασθενή'; render(); return;
  }

  // Search patient by name
  const searchTriggers = ['βρες', 'ψάξε', 'αναζήτηση', 'βρείτε', 'άνοιξε'];
  const hasTrigger = searchTriggers.some(tr => t.includes(tr));
  if (hasTrigger) {
    // Extract name after trigger word
    let query = t;
    searchTriggers.forEach(tr => { query = query.replace(tr,''); });
    query = query.replace(/ασθεν[ή|η|α]?|πελάτ[η|α]?/g,'').trim();
    if (query.length > 1) {
      S.voiceResult='🔍 Αναζητώ "' + query + '"...';
      render();
      S.globalSearch = query;
      // Also try greek transliteration
      const qGreek = latinToGreek(query);
      await globalSearch(qGreek.length > 1 ? qGreek : query);
      // If found single patient, open it
      if (S.globalResults&&S.globalResults.length===1&&S.globalResults[0].type==='patient') {
        await loadPatientDetail(S.globalResults[0].id);
        S.voiceResult='✓ Βρήκα και άνοιξα: ' + S.globalResults[0].title;
        S.globalSearch=''; S.globalResults=[];
      } else if (S.globalResults&&S.globalResults.length>0) {
        S.voiceResult='✓ Βρήκα ' + S.globalResults.length + ' αποτελέσματα για "' + query + '"';
      } else {
        S.voiceResult='❌ Δεν βρέθηκε "' + query + '"';
      }
      render(); return;
    }
  }

  // Status change commands
  if (t.includes('ολοκλήρωσε') || t.includes('ολοκληρώθηκε')) {
    S.voiceResult='💡 Πες τον ασθενή + "ολοκλήρωσε ραντεβού"'; render(); return;
  }

  // Today's schedule
  if (t.includes('σήμερα') || t.includes('πρόγραμμα σήμερα')) {
    const today = new Date().toDateString();
    const todayApts = (S.appointments||[]).filter(a=>new Date(a.start_time).toDateString()===today);
    S.voiceResult=`📅 Σήμερα έχεις ${todayApts.length} ραντεβού${todayApts.length?': '+todayApts.map(a=>(a.patients&&a.patients.full_name||'—')+' '+new Date(a.start_time).toLocaleTimeString('el-GR',{hour:'2-digit',minute:'2-digit'})).join(', '):''}`;
    render(); return;
  }

  // Fallback
  S.voiceResult='❓ Δεν κατάλαβα "' + text + '". Πες: "βρες [όνομα]", "νέο ραντεβού", "άνοιξε ασθενείς"';
  render();
}
