    </div>`:''}
    <div style="display:flex;border:1px solid var(--border-2);border-radius:12px;background:var(--white);min-width:max-content">
      <!-- Time column -->
      <div style="width:56px;flex-shrink:0;border-right:1px solid var(--border-2)">
        <div style="height:48px;border-bottom:1px solid var(--border-2);position:sticky;top:0;background:var(--white);z-index:11"></div>
        ${hours.map(h=>`<div style="height:${HOUR_H}px;border-bottom:1px solid var(--border-2);padding:4px 6px;font-size:10px;color:var(--text-3);font-family:var(--mono);text-align:right">${h}:00</div>`).join('')}
      </div>
      <!-- Staff columns -->
      ${cols.map(col=>{
        const colAppts = calMode==='therapist'
          ? dayAppts.filter(a=>{
              const t = apptTherapist(a);
              return col.id==='unassigned' ? !t : ('t:'+canonTherapist(t))===col.id;
            })
          : dayAppts.filter(a=>roomMap[a.id]===col.id);

        return `<div style="flex:1;min-width:160px;border-right:1px solid var(--border-2);position:relative" ${calMode==='therapist'&&col.id!=='unassigned'?`data-drop-col="${esc(col.full_name)}"`:''}>
          <!-- Header -->
          <div style="height:48px;border-bottom:1px solid var(--border-2);display:flex;align-items:center;justify-content:center;padding:0 8px;background:var(--surface);position:sticky;top:0;z-index:10">
            <div style="text-align:center">
              <div style="font-size:12px;font-weight:500;color:var(--navy)">${esc(col.full_name)}</div>
              <div style="font-size:10px;color:var(--text-3)">${colAppts.length} ραντεβού</div>
            </div>
          </div>
          <!-- Hour grid -->
          <div style="position:relative;height:${hours.length*HOUR_H}px">
            ${hours.map(h=>`
              <div style="position:absolute;left:0;right:0;top:${(h-startHour)*HOUR_H}px;height:${HOUR_H}px;border-bottom:1px solid var(--border-2)">
                <div style="position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,0.03)"></div>
              </div>`).join('')}
            <!-- Appointments -->
            ${colAppts.map(a=>{
              const start = new Date(a.start_time);
              const dur = a.duration_minutes||60;
              const topMin = (start.getHours()-startHour)*60 + start.getMinutes();
              const topPx = topMin * PX_PER_MIN;
              const heightPx = Math.max(dur*PX_PER_MIN, 24);
              const c = apptColor(a);
              const gdpr = a.patients&&a.patients.gdpr_signed;
              const isVip = a.patients&&a.patients.status==='vip';
              const startTime = start.toLocaleTimeString('el-GR',{hour:'2-digit',minute:'2-digit'});
              const endTime = new Date(start.getTime()+dur*60000).toLocaleTimeString('el-GR',{hour:'2-digit',minute:'2-digit'});

              const hasConflict = laserConflictIds.has(a.id);
              const missingGrp = missingConsent(a);
              const hasNoConsent = !!missingGrp;
              return `<div
                data-appt-cal="${a.id}"
                data-drag-appt="${a.id}"
                draggable="true"
                style="position:absolute;left:3px;right:3px;top:${topPx}px;height:${heightPx}px;
                  background:${hasConflict?'rgba(239,68,68,0.15)':hasNoConsent?'rgba(217,119,6,0.14)':c.bg};border-left:3px solid ${hasConflict?'#DC2626':hasNoConsent?'#D97706':c.border};${hasConflict?'outline:2px solid #DC2626;':hasNoConsent?'outline:2px dashed #D97706;':''}border-radius:6px;
                  padding:3px 6px;cursor:pointer;overflow:hidden;z-index:${hasConflict||hasNoConsent?6:5};transition:.15s"
                onmouseover="showCalTooltip(this, event)"
                onmouseout="hideCalTooltip(this)"
                data-name="${esc(a.patients&&a.patients.full_name||'—')}"
                data-service="${esc(a.service_name||'')}"
                data-time="${startTime} – ${endTime} (${dur} λεπτά)"
                data-gdpr="${gdpr?'1':'0'}"
                data-vip="${isVip?'1':'0'}"
                data-price="${canSeeFinancials&&a.price?euro(a.price):''}"
                data-medical="${esc((a.patients&&a.patients.medical_history||'').slice(0,120))}"
                data-allergies="${esc(a.patients&&a.patients.allergies||'')}"
                data-notes="${esc(a.notes||'')}"
                data-status="${a.status||'pending'}"
                data-consent-missing="${missingGrp?CONSENT_GROUP_LABEL[missingGrp]:''}">
                <div style="font-size:10px;font-weight:500;color:${c.text};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
                  ${hasNoConsent?'⚠ ':''}${isVip?'★ ':''}${esc(a.patients&&a.patients.full_name||'—')}
                </div>
                ${hasNoConsent&&heightPx>30?`<div style="font-size:8px;font-weight:700;color:#B45309;white-space:nowrap;overflow:hidden">⚠ ΧΩΡΙΣ ΣΥΝΑΙΝΕΣΗ ${CONSENT_GROUP_LABEL[missingGrp]}</div>`:''}
                ${heightPx>(hasNoConsent?58:30)?`<div style="font-size:9px;color:${c.text};opacity:0.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(a.service_name||'')}</div>`:''}
                ${heightPx>44?`<div style="font-size:9px;color:${c.text};opacity:0.7">${startTime}${!gdpr?' ⚠':''}</div>`:''}
              </div>`;
            }).join('')}
            ${(()=>{
              const now = new Date();
              const isToday = calDate.toDateString() === now.toDateString();
              if (!isToday) return '';
              const nowMin = (now.getHours()-startHour)*60 + now.getMinutes();
              if (nowMin < 0 || nowMin > hours.length*60) return '';
              const nowPx = nowMin * PX_PER_MIN;
              return `<div data-now-line style="position:absolute;left:0;right:0;top:${nowPx}px;z-index:8;pointer-events:none">
                <div style="position:absolute;left:-3px;top:-2.5px;width:6px;height:6px;border-radius:50%;background:#F0A0A0"></div>
                <div style="height:1px;background:#F0A0A0;opacity:0.6"></div>
              </div>`;
            })()}
          </div>
        </div>`;
      }).join('')}
    </div>`;
  };

  const renderWeekView = () => {
    const weekDays = [];
    for (let i=0;i<7;i++) {
      const d = new Date(weekStart);
      d.setDate(weekStart.getDate()+i);
      weekDays.push(d);
    }
    return `
    <div style="border:1px solid var(--border-2);border-radius:12px;background:var(--white);min-width:max-content">
      <div style="display:grid;grid-template-columns:56px repeat(7,1fr);min-width:700px">
        <div style="height:48px;border-bottom:1px solid var(--border-2);border-right:1px solid var(--border-2);position:sticky;top:0;background:var(--white);z-index:11"></div>
        ${weekDays.map(d=>{
          const isToday = localDateStr(d)===localDateStr(new Date());
          const dayAppts2 = appts.filter(a=>localDateStr(new Date(a.start_time))===localDateStr(d));
          return `<div style="height:48px;border-bottom:1px solid var(--border-2);border-right:1px solid var(--border-2);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:${isToday?'var(--blue-soft)':'var(--surface)'};position:sticky;top:0;z-index:10" data-cal-day="${d.toISOString()}">
            <div style="font-size:10px;color:var(--text-2)">${d.toLocaleDateString('el-GR',{weekday:'short'})}</div>
            <div style="font-size:16px;font-weight:${isToday?600:400};color:${isToday?'var(--blue)':'var(--navy)'}">${d.getDate()}</div>
            ${dayAppts2.length?`<div style="width:16px;height:4px;border-radius:2px;background:var(--blue);margin-top:2px"></div>`:''}
          </div>`;
        }).join('')}
        <!-- Time rows -->
        ${hours.map(h=>`
          <div style="height:${HOUR_H}px;border-bottom:1px solid var(--border-2);border-right:1px solid var(--border-2);padding:3px 6px;font-size:9px;color:var(--text-3);font-family:var(--mono);text-align:right;display:flex;align-items:flex-start;justify-content:flex-end">${h}:00</div>
          ${weekDays.map(d=>{
            const dayAppts3 = appts.filter(a=>{
              const ad=new Date(a.start_time);
              return localDateStr(ad)===localDateStr(d)&&ad.getHours()===h;
            });
            return `<div style="height:${HOUR_H}px;border-bottom:1px solid var(--border-2);border-right:1px solid var(--border-2);position:relative;padding:1px">
              ${dayAppts3.map(a=>{
                const c=apptColor(a);
                return `<div data-appt-cal="${a.id}" style="background:${c.bg};border-left:2px solid ${c.border};border-radius:3px;padding:1px 3px;font-size:9px;color:${c.text};margin-bottom:1px;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis" title="${esc(a.patients&&a.patients.full_name||'')} · ${esc(a.service_name||'')}">
                  ${esc((a.patients&&a.patients.full_name||'—').split(' ')[0])}
                </div>`;
              }).join('')}
            </div>`;
          }).join('')}
        `).join('')}
      </div>
    </div>`;
  };

  return `<div class="page" style="display:flex;flex-direction:column;gap:14px;height:calc(100vh - 56px);overflow:hidden;padding:16px">
    <!-- Tooltip -->
    <div id="cal-tooltip" style="display:none;position:fixed;top:0;left:0;z-index:1000;background:var(--navy);color:#fff;padding:10px 14px;border-radius:10px;font-size:12px;line-height:1.6;pointer-events:none;max-width:240px;box-shadow:var(--shadow-lg)"></div>

    <!-- Toolbar -->
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex-shrink:0">
      <!-- Date nav -->
      <button class="btn btn-ghost btn-sm" data-cal-nav="-1">‹</button>
      <span style="font-size:13px;font-weight:500;min-width:200px;text-align:center">${calView==='day'?dateStr:
        `${weekStart.toLocaleDateString('el-GR',{day:'numeric',month:'short'})} – ${new Date(weekStart.getTime()+6*86400000).toLocaleDateString('el-GR',{day:'numeric',month:'short',year:'numeric'})}`
      }</span>
      <button class="btn btn-ghost btn-sm" data-cal-nav="1">›</button>
      <button class="btn btn-ghost btn-sm" data-cal-today>Σήμερα</button>

      <div style="flex:1"></div>

      <!-- View mode -->
      <div style="display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden">
        <button class="btn btn-sm" style="border-radius:0;background:${calView==='day'?'var(--blue)':'transparent'};color:${calView==='day'?'#fff':'var(--text-2)'}" data-cal-view="day">Ημέρα</button>
        <button class="btn btn-sm" style="border-radius:0;background:${calView==='week'?'var(--blue)':'transparent'};color:${calView==='week'?'#fff':'var(--text-2)'};border-left:1px solid var(--border)" data-cal-view="week">Εβδομάδα</button>
      </div>

      <!-- Column mode -->
      <div style="display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden">
        <button class="btn btn-sm" style="border-radius:0;background:${calMode==='therapist'?'var(--blue)':'transparent'};color:${calMode==='therapist'?'#fff':'var(--text-2)'}" data-cal-mode="therapist">Θεραπευτές</button>
        <button class="btn btn-sm" style="border-radius:0;background:${calMode==='room'?'var(--blue)':'transparent'};color:${calMode==='room'?'#fff':'var(--text-2)'};border-left:1px solid var(--border)" data-cal-mode="room">Δωμάτια</button>
      </div>

      <button class="btn btn-primary btn-sm" data-modal="new-appt">+ Ραντεβού</button>
    </div>

    <!-- Legend -->
    <div style="display:flex;gap:10px;flex-wrap:wrap;flex-shrink:0;font-size:11px">
      ${[['#534AB7','#EEEDFE','VIP'],['#1D9E75','#E1F5EE','Ολοκληρώθηκε'],['#2B3BF0','#E6F1FB','Επιβεβαιωμένο'],['#EF9F27','#FAEEDA','Εκκρεμεί'],['#D85A30','#FAECE7','Ακυρώθηκε']].map(([c,bg,l])=>`
      <div style="display:flex;align-items:center;gap:4px">
        <div style="width:10px;height:10px;border-radius:2px;background:${bg};border-left:3px solid ${c}"></div>
        <span style="color:var(--text-2)">${l}</span>
      </div>`).join('')}
      <div style="display:flex;align-items:center;gap:4px"><span style="color:#D85A30">⚠</span><span style="color:var(--text-2)">Χωρίς GDPR</span></div>
      <div style="display:flex;align-items:center;gap:4px"><span style="color:#534AB7">★</span><span style="color:var(--text-2)">VIP</span></div>
    </div>

    <!-- Calendar grid -->
    <div id="cal-scroller" style="flex:1;overflow:auto">
      ${calView==='day' ? renderDayView() : renderWeekView()}
    </div>

    <!-- Appointment detail panel -->
    <div id="appt-detail-panel" style="display:none;position:fixed;right:20px;top:80px;width:320px;background:var(--white);border-radius:14px;box-shadow:var(--shadow-lg);border:1px solid var(--border-2);z-index:500;padding:20px">
      <div style="display:flex;justify-content:space-between;margin-bottom:14px">
        <span style="font-size:14px;font-weight:600">Ραντεβού</span>
        <button onclick="document.getElementById('appt-detail-panel').style.display='none'" style="background:none;border:none;font-size:18px;cursor:pointer;color:var(--text-2)">×</button>
      </div>
      <div id="appt-detail-content"></div>
    </div>
  </div>`;
}

// ── CONSULTATIONS MODULE ──
// Ταξινομεί μια εγγραφή gdpr_consents στον τύπο της, βάσει του περιεχομένου του consent_text —
// ο πίνακας αυτός φιλοξενεί ΚΑΙ πραγματικά consultation ΚΑΙ απλές υπογραφές GDPR ΚΑΙ συναινέσεις
// Laser, οπότε χρειάζεται σωστή ταξινόμηση αντί να δείχνει τα πάντα "Consultation". Δεν στηριζόμαστε
// ΜΟΝΟ στο literal "Skincare Plan |" πρόθεμα (αυτό το βάζει μόνο η νέα φόρμα μέσα στο CRM) — records
// από παλαιότερα/εξωτερικά pipelines (π.χ. το πρώην Google Form/Apps Script) έχουν πραγματικό
// IN-CLINIC/SKIN PROFILE/HOMECARE περιεχόμενο χωρίς αυτό το πρόθεμα, και πρέπει να μετρήσουν το ίδιο.
function classifyConsultationType(text) {
  const t = text||'';
  if (t.includes('Skincare Plan') || /IN-CLINIC|SKIN PROFILE|HOMECARE/.test(t)) return 'consultation';
  if (/laser/i.test(t)) return 'laser';
  return 'gdpr';
}
function renderConsultations() {
  const cid = clinicId();
  if (!cid) return '<div class="page"><div class="empty-state"><div class="empty-icon">📋</div><div>Επίλεξε κλινική</div></div></div>';
  const items = S.allConsultations||[];
  const q = (S.consultSearch||'').toLowerCase();
  const filterType = S.consultFilter||'all';

  const filtered = items.filter(c=>{
    const name = (c.patients&&c.patients.full_name||c.patient_name||'').toLowerCase();
    const matchQ = !q || name.includes(q);
    const matchF = filterType==='all' || classifyConsultationType(c.consent_text)===filterType;
    return matchQ && matchF;
  });

  const fmtDate = d => d ? new Date(d).toLocaleDateString('el-GR',{day:'2-digit',month:'2-digit',year:'numeric'}) : '—';
  const fmtTime = d => d ? new Date(d).toLocaleTimeString('el-GR',{hour:'2-digit',minute:'2-digit'}) : '';

  const canDeleteConsult = ['clinic_admin','super_admin'].includes(S.profile&&S.profile.role);
  const typeLabel = t => ({consultation:'Consultation',gdpr:'GDPR','laser':'Laser',general:'Γενική'}[t]||t||'Consultation');
  const typeBadge = t => {
    const map = {consultation:'#E6F1FB|#185FA5',gdpr:'#E1F5EE|#0F6E56',laser:'#EEEDFE|#534AB7'};
    const [bg,col] = (map[t]||'#F1F4F7|#556').split('|');
    return `<span style="background:${bg};color:${col};font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap">${typeLabel(t)}</span>`;
  };

  return `<div class="page">
    <div class="page-header" style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
      <div>
        <h1 class="page-title">Consultation</h1>
        <p class="page-sub">${items.length} αρχεία</p>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <input id="consult-search" class="form-control" style="width:200px;font-size:12px" placeholder="🔍 Αναζήτηση ασθενή…" value="${esc(S.consultSearch||'')}" oninput="S.consultSearch=this.value;render()"/>
        <select id="consult-filter" class="form-control" style="width:140px;font-size:12px" onchange="S.consultFilter=this.value;render()">
          <option value="all" ${filterType==='all'?'selected':''}>Όλα</option>
          <option value="consultation" ${filterType==='consultation'?'selected':''}>Consultation</option>
          <option value="gdpr" ${filterType==='gdpr'?'selected':''}>GDPR</option>
          <option value="laser" ${filterType==='laser'?'selected':''}>Laser</option>
        </select>

// ── ΑΝΑΦΟΡΕΣ (REPORTS) ──
function computeReportStats() {
  const apts = S.reportAppointments||[];
  const newPatients = S.reportNewPatients||[];
  const allPatients = S.reportAllPatients||[];
  const paidCompleted = apts.filter(a=>a.status==='paid'||a.status==='completed');
  const revenue = paidCompleted.reduce((s,a)=>s+(a.price||0),0);
  const noShows = apts.filter(a=>a.status==='no_show').length;
  const noShowRate = apts.length ? Math.round((noShows/apts.length)*100) : null;
  const completedCount = apts.filter(a=>a.status==='completed'||a.status==='paid').length;
  const cancelledCount = apts.filter(a=>a.status==='cancelled').length;
  const pendingCount = apts.length - completedCount - cancelledCount - noShows;
  const activePatients = allPatients.filter(p=>p.status!=='inactive');
  const gdprSigned = activePatients.filter(p=>p.gdpr_signed).length;
  const gdprRate = activePatients.length ? Math.round((gdprSigned/activePatients.length)*100) : null;
  const svc = {};
  // Το "Ραντεβού" μετράει όλα τα κλεισμένα ραντεβού της υπηρεσίας, αλλά τα "Έσοδα" μετράνε
  // ΜΟΝΟ τα πληρωμένα/ολοκληρωμένα — αλλιώς το άθροισμα ανά υπηρεσία ξεπερνούσε το συνολικό
  // KPI "Έσοδα" (που μετράει μόνο paid/completed), δείχνοντας ασυνεπή νούμερα στην αναφορά.
  apts.forEach(a=>{ if(a.service_name) { svc[a.service_name]=svc[a.service_name]||{count:0,revenue:0}; svc[a.service_name].count++; if(a.status==='paid'||a.status==='completed') svc[a.service_name].revenue+=(a.price||0); } });
  const topServices = Object.entries(svc).sort((a,b)=>b[1].revenue-a[1].revenue).slice(0,8);

  // Νέοι πελάτες vs ισόχρονη προηγούμενη περίοδος
  const prevNewPatientsCount = (S.reportPrevNewPatients||[]).length;
  const newPatientsDelta = newPatients.length - prevNewPatientsCount;
  const newPatientsPct = prevNewPatientsCount>0 ? Math.round((newPatientsDelta/prevNewPatientsCount)*100) : (newPatients.length>0?100:0);

  // Consultations vs ισόχρονη προηγούμενη περίοδος
  const consultations = S.reportConsultations||[];
  const prevConsultCount = (S.reportPrevConsultations||[]).length;
  const consultDelta = consultations.length - prevConsultCount;
  const consultPct = prevConsultCount>0 ? Math.round((consultDelta/prevConsultCount)*100) : (consultations.length>0?100:0);

  // % Κάλυψης Ωραρίου Λειτουργίας: κλεισμένα λεπτά ραντεβού / διαθέσιμα λεπτά χωρητικότητας
  // (ώρες λειτουργίας × ημέρες περιόδου × αριθμός ενεργού προσωπικού — εκτίμηση χωρητικότητας
  // όταν δουλεύουν παράλληλα περισσότερες από μία θεραπεύτριες).
  const fromDate = new Date((S.reportRange&&S.reportRange.from)+'T00:00:00');
  const toDate = new Date((S.reportRange&&S.reportRange.to)+'T23:59:59');
  const rangeDays = Math.max(1, Math.round((toDate-fromDate)/86400000)+1);
  const startHour = (S.clinic&&S.clinic.settings&&S.clinic.settings.start_hour!=null) ? S.clinic.settings.start_hour : 9;
  const endHour = (S.clinic&&S.clinic.settings&&S.clinic.settings.end_hour!=null) ? S.clinic.settings.end_hour : 20;
  const staffCount = Math.max(1, S.reportStaffCount||1);
  const capacityMinutes = Math.max(0, endHour-startHour) * 60 * rangeDays * staffCount;
  const bookedMinutes = apts.filter(a=>a.status!=='cancelled').reduce((s,a)=>s+(a.duration_minutes||60),0);
  const utilizationRate = capacityMinutes ? Math.round((bookedMinutes/capacityMinutes)*100) : null;

  // Πόσες προτεινόμενες υπηρεσίες (IN-CLINIC steps) από consultations πραγματοποιήθηκαν τελικά —
  // ίδια συνάρτηση αντιστοίχισης (findServiceMatch/parseConsultInClinicSteps) με το progress
  // badge της καρτέλας ασθενή, ώστε ο αριθμός να είναι συνεπής παντού στο CRM.
  const apptsByPatient = {};
  (S.reportConsultAppointments||[]).forEach(a=>{ (apptsByPatient[a.patient_id]=apptsByPatient[a.patient_id]||[]).push(a); });
  let recommendedTotal = 0, recommendedDone = 0;
  const missedRecommendations = [];
  consultations.forEach(c=>{
    const steps = parseConsultInClinicSteps(c.consent_text);
    const patientAppts = apptsByPatient[c.patient_id]||[];
    steps.forEach(step=>{
      recommendedTotal++;
      if (findServiceMatch(patientAppts, c.signed_at, step)) recommendedDone++;
      else missedRecommendations.push({
        patientId: c.patient_id,
        patientName: (c.patients&&c.patients.full_name)||'—',
        patientPhone: (c.patients&&c.patients.phone)||'',
        step, signedAt: c.signed_at,
      });
    });
  });

  return { apts, newPatients, allPatients, revenue, noShowRate, noShows, gdprRate, gdprSigned, activeCount:activePatients.length, topServices,
    newPatientsDelta, newPatientsPct, consultations, prevConsultCount, consultDelta, consultPct,
    utilizationRate, recommendedTotal, recommendedDone, missedRecommendations,
    completedCount, cancelledCount, pendingCount };
}

// Ίδια σύμβαση εμφάνισης delta με το widget "Από πού μας βρήκαν" του Dashboard
function reportDeltaLabel(diff, pct) {
  const color = diff>0?'#0F6E56':diff<0?'var(--red)':'var(--text-3)';
  const arrow = diff>0?'▲':diff<0?'▼':'▬';
  return `<span style="font-weight:600;color:${color}">${diff>0?'+':''}${diff} (${arrow}${Math.abs(pct)}%)</span> vs προηγούμενη ισόχρονη περίοδο`;
}

function renderModal() {
  const existing = document.getElementById('modal-overlay');
  if (existing) existing.remove();
  const div = document.createElement('div');
  div.id = 'modal-overlay';
  div.className = 'modal-overlay';
  const content = {
    'new-patient': modalNewPatient,
    'new-appt': modalNewAppt,
    'new-lead': modalNewLead,
    'new-clinic': modalNewClinic,
    'new-laser': modalNewLaser,
    'new-consent-tmpl': modalNewConsentTmpl,
    'new-user': modalNewUser,
  }[S.modal];
  if (!content) return;
  div.innerHTML = content();
  document.body.appendChild(div);
  div.onclick = e => { if(e.target===div) closeModal(); };
  bindModalEvents();
}

function closeModal() { S.modal=null; S.modalData={}; const _mo=document.getElementById('modal-overlay');if(_mo)_mo.remove(); }

// ── BIND EVENTS ──
function bindEvents() {
  // Login
  const loginBtn = document.getElementById('login-btn');
  if (loginBtn) {
    const doLogin = async () => {
      const email = document.getElementById('login-email').value;
      const pass = document.getElementById('login-pass').value;
      loginBtn.textContent = 'Σύνδεση...'; loginBtn.disabled = true;
      try { await login(email, pass); }
      catch(e) {
        const err = document.getElementById('login-err');
        err.textContent = e.message||'Λάθος στοιχεία'; err.style.display='block';
        loginBtn.textContent = 'Σύνδεση →'; loginBtn.disabled = false;
      }
    };
    loginBtn.onclick = doLogin;
    const _lp=document.getElementById('login-pass');if(_lp)_lp.addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
  }

  // Forgot password
  const forgotLink = document.getElementById('forgot-pass-link');
  if (forgotLink) {
    forgotLink.onclick = (e) => {
      e.preventDefault();
      const emailVal = document.getElementById('login-email').value;
      const modal = document.getElementById('forgot-pass-modal');
      document.getElementById('forgot-pass-email').value = emailVal||'';
      document.getElementById('forgot-pass-result').textContent = '';
      modal.style.display = 'flex';
    };
  }
  const forgotSend = document.getElementById('forgot-pass-send');
  if (forgotSend) {
    forgotSend.onclick = async () => {
      const email = document.getElementById('forgot-pass-email').value.trim();
      const resultEl = document.getElementById('forgot-pass-result');
      if (!email) { resultEl.innerHTML = '<span style="color:var(--red)">Συμπλήρωσε email</span>'; return; }
      forgotSend.textContent = 'Αποστολή...'; forgotSend.disabled = true;
      const { error } = await sb.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin
      });
      forgotSend.textContent = 'Αποστολή'; forgotSend.disabled = false;
      if (error) {
        resultEl.innerHTML = '<span style="color:var(--red)">'+esc(error.message)+'</span>';
      } else {
        resultEl.innerHTML = '<span style="color:#0F6E56">✓ Στάλθηκε! Έλεγξε το email σου για σύνδεσμο επαναφοράς.</span>';
        setTimeout(() => { document.getElementById('forgot-pass-modal').style.display='none'; }, 2500);
      }
    };
  }

  // Nav
  document.querySelectorAll('[data-page]').forEach(el => {
    el.onclick = () => { S.sidebarOpen=false; S.filter='all'; S.search=''; S.page=el.dataset.page; loadPageData(); render(); };
  });

  // Patients
  document.querySelectorAll('[data-patient]').forEach(el => {
    el.onclick = e => { if(!e.target.closest('button[data-patient]')&&!e.target.matches('button[data-patient]')) { loadPatientDetail(el.dataset.patient, el.dataset.patientTab); } };
  });
  document.querySelectorAll('button[data-patient]').forEach(el => {
    el.onclick = e => { e.stopPropagation(); loadPatientDetail(el.dataset.patient); };
  });

  // Filter tabs
  document.querySelectorAll('[data-filter]').forEach(el => {
    el.onclick = () => { S.filter=el.dataset.filter; render(); };
  });

  // Ραντεβού — φίλτρο ημέρας (Σήμερα / συγκεκριμένη ημέρα / όλες)
  const _apptToday = document.getElementById('appt-date-today');
  if (_apptToday) _apptToday.onclick = () => { S.apptDateFilter = new Date().toLocaleDateString('sv-SE'); render(); };
  const _apptDateInput = document.getElementById('appt-date-input');
  if (_apptDateInput) _apptDateInput.onchange = () => { S.apptDateFilter = _apptDateInput.value; render(); };
  const _apptDateClear = document.getElementById('appt-date-clear');
  if (_apptDateClear) _apptDateClear.onclick = () => { S.apptDateFilter = ''; render(); };

  const _openMergeDup = document.getElementById('open-merge-duplicates');
  if (_openMergeDup) _openMergeDup.onclick = () => openMergeDuplicatesModal();

  // Search
  // (local search removed — using global search topbar)

  // Appointment status change
  document.querySelectorAll('[data-appt-status]').forEach(el => {
    const prevValue = el.value;
    el.onchange = async () => {
      const newValue = el.value;
      const {error} = await sb.from('appointments').update({status:newValue}).eq('id',el.dataset.apptStatus);
      if (error) { alert('✗ Η αλλαγή κατάστασης απέτυχε: '+error.message); el.value = prevValue; return; }
      loadPageData();
    };
  });

  // Modals trigger
  document.querySelectorAll('[data-modal]').forEach(el => {
    el.onclick = (e) => { if(e) e.stopPropagation(); S.modal=el.dataset.modal; S.modalData = el.dataset.clinicId ? {clinicId: el.dataset.clinicId} : {}; render(); };
  });

  // Save laser form detail
  // Επεξεργασία στοιχείων ασθενή (καρτέλα) — όνομα, στοιχεία επικοινωνίας, κατάσταση/VIP
  const _epb = document.getElementById('edit-patient-btn');
  if (_epb) _epb.addEventListener('click', openEditPatientModal);

  // Φωτογραφίες — κλικ σε κάρτα = επιλογή (μέχρι 2), upload input
  document.querySelectorAll('[data-photo-card]').forEach(card => {
    card.addEventListener('click', () => {
      const id = card.dataset.photoCard;
      if (_selectedPhotoIds.has(id)) { _selectedPhotoIds.delete(id); }
      else {
        if (_selectedPhotoIds.size >= 2) { const first = _selectedPhotoIds.values().next().value; _selectedPhotoIds.delete(first); }
        _selectedPhotoIds.add(id);
      }
      render();
    });
  });
  const handlePatientPhotoFiles = async (files) => {
    if (!files.length) return;
    const statusEl = document.getElementById('photo-upload-status');
    if (statusEl) statusEl.style.display = 'block';
    const pid = S.patientDetail.id, cid = clinicId();
    for (const file of files) {
      const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
      const path = `${cid}/${pid}/${Date.now()}_${safeName}`;
      const {error: upErr} = await sb.storage.from('patient-photos').upload(path, file);
      if (upErr) { alert('Σφάλμα μεταφόρτωσης: '+upErr.message); continue; }
      await sb.from('patient_photos').insert({
        clinic_id: cid, patient_id: pid, storage_path: path,
        taken_at: new Date().toISOString(),
        uploaded_by: (S.profile&&S.profile.full_name)||''
      });
    }
    await loadPatientDetail(pid);
    render();
  };
  const _pui = document.getElementById('photo-upload-input');
  if (_pui) _pui.addEventListener('change', (e) => handlePatientPhotoFiles(Array.from(e.target.files||[])));
  const _pli = document.getElementById('photo-library-input');
  if (_pli) _pli.addEventListener('change', (e) => handlePatientPhotoFiles(Array.from(e.target.files||[])));

  // Sortable επικεφαλίδες πίνακα Ασθενών
  document.querySelectorAll('th[data-sort]').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.sort;
      if (S.patSortKey === key) { S.patSortDir = S.patSortDir==='asc' ? 'desc' : 'asc'; }
      else { S.patSortKey = key; S.patSortDir = 'asc'; }
      render();
    });
  });

  // Checkbox "Φοιτητής" — αποθήκευση άμεση με το κλικ
  const _stu = document.getElementById('pat-student-toggle');
  if (_stu) _stu.addEventListener('change', async () => {
    const val = _stu.checked;
    const {error} = await sb.from('patients').update({is_student: val}).eq('id', S.patientDetail.id);
    if (error) { alert('Σφάλμα: '+error.message); _stu.checked = !val; return; }
    S.patientDetail.is_student = val;
  });

  const _slf = document.getElementById('save-laser-form');
  if (_slf) _slf.addEventListener('click', async () => {
    if (!S.laserFormId) return;

    // Συγκέντρωση όλων των ημερομηνιών συνεδριών (ΠΕΡΙΟΧΗ 1-N, γραμμές 1-6) + Ημ. Έναρξης
    const _now = new Date();
    const todayStr = `${_now.getFullYear()}-${String(_now.getMonth()+1).padStart(2,'0')}-${String(_now.getDate()).padStart(2,'0')}`;
    const allDates = [];
    _laserRegions.forEach(r => (r.sessions||[]).forEach(s => { if (s && s.date) allDates.push(s.date); }));
    const startDateEl = document.getElementById('start-date');
    if (startDateEl && startDateEl.value) allDates.push(startDateEl.value);

    // Κανόνας: αν ΟΛΕΣ οι καταχωρημένες ημερομηνίες είναι αυστηρά ΠΑΛΑΙΟΤΕΡΕΣ από σήμερα (ιστορικές
    // συνεδρίες laser που καταχωρούνται εκ των υστέρων), η αποθήκευση επιτρέπεται χωρίς συναίνεση.
    // Αν έστω ΜΙΑ ημερομηνία είναι σήμερα ή στο μέλλον, απαιτείται πρώτα υπογεγραμμένη συναίνεση.
    const hasTodayOrFutureDate = allDates.some(d => d >= todayStr);
    const isPureHistorical = allDates.length > 0 && !hasTodayOrFutureDate;

    if (!S.laserPatientConsent && !isPureHistorical) {
      alert('⚠ Ο ασθενής δεν έχει υπογράψει Συναίνεση Laser.\n\nΓια σημερινή ή μελλοντική συνεδρία, η φόρμα δεν μπορεί να αποθηκευτεί πριν την υπογραφή. Άνοιξε τη Φόρμα Συναίνεσης.');
      openLaserConsentModal();
      return;
    }

    // Υποχρεωτικά πεδία πριν την αποθήκευση — χωρίς αυτά η φόρμα Laser είναι
    // κλινικά ανολοκλήρωτη (δεν ξέρουμε σε ποια περιοχή/ρύθμιση αναφέρεται).
    const hairColors = Array.from(document.querySelectorAll('.lf-hair-color:checked')).map(cb=>cb.value);
    const missing = [];
    if (!(S.laserFormDetail && S.laserFormDetail.gender)) missing.push('Φύλο');
    if (!(S.laserFormDetail && S.laserFormDetail.skin_type)) missing.push('Φωτότυπος Δέρματος');
    if (!hairColors.length) missing.push('Χρώμα Τρίχας');
    if (!_laserBodyParts.length) missing.push('Περιοχή Σώματος');
    if (missing.length) {
      alert('⚠ Συμπλήρωσε πρώτα: ' + missing.join(', ') + '.\n\nΗ φόρμα Laser δεν μπορεί να αποθηκευτεί χωρίς αυτά τα στοιχεία.');
      return;
    }

    _slf.textContent='Αποθήκευση...'; _slf.disabled=true;
    const notes = document.getElementById('treatment-notes');
    const operator = document.getElementById('lf-operator');
    const startDate = document.getElementById('start-date');
    const {error} = await sb.from('laser_forms').update({
      body_parts: _laserBodyParts,
      skin_type: S.laserFormDetail&&S.laserFormDetail.skin_type||'',
      gender: S.laserFormDetail&&S.laserFormDetail.gender||'',
      treatment_notes: notes?notes.value:'',
      consent_signed: !!S.laserPatientConsent,
      machine_settings: {
        hair_colors: hairColors,
        operator: operator?operator.value:'',
        start_date: startDate?startDate.value:'',
        regions: _laserRegions,
      }
    }).eq('id',S.laserFormId);
    if (error) { alert(error.message); _slf.textContent='💾 Αποθήκευση'; _slf.disabled=false; return; }
    _slf.textContent='✓ Αποθηκεύτηκε!';
    setTimeout(()=>{ _slf.textContent='💾 Αποθήκευση'; _slf.disabled=false; }, 2000);
  });

  // Patient detail tabs
  document.querySelectorAll('[data-pat-tab]').forEach(el => {
    el.onclick = () => { S.patTab=el.dataset.patTab; render(); };
  });

  // Open the in-CRM Ιατρικό Ιστορικό / GDPR form
  const _ohfb = document.getElementById('open-history-form-btn');
  if (_ohfb) _ohfb.addEventListener('click', openHistoryFormModal);

  // Sync patient from Google Sheet

    try {
      const [rows1, rows2] = await Promise.all([
        fetchGoogleSheet(sheetId, 'Νέα Ιστορικά').catch(()=>[]),
        fetchGoogleSheet(sheetId, 'Παλιά Ιστορικά').catch(()=>[])
      ]);
      const allRows = [...rows1, ...rows2];
      const phone = normalizePhone(p.phone||'');
      const fullName = (p.full_name||'').trim().toLowerCase();
      // Βρες γραμμή που ταιριάζει: ΑΚΡΙΒΕΣ τηλέφωνο, αλλιώς ΑΚΡΙΒΕΣ ονοματεπώνυμο (ποτέ substring

      // ιατρικό ιστορικό άλλου ατόμου). Αν βρεθούν παραπάνω από 1 πιθανές γραμμές, δεν μαντεύουμε.
      const rowPhone = row => normalizePhone(row['Τηλέφωνο:']||row['Τηλέφωνο']||'');
      const rowName = row => (row['Ονοματεπώνυμο:']||row['Ονοματεπώνυμο']||'').trim().toLowerCase();
      let candidates = phone ? allRows.filter(row => rowPhone(row)===phone) : [];
      if (!candidates.length && fullName) candidates = allRows.filter(row => rowName(row)===fullName);
      if (candidates.length !== 1) {
        _spsb.textContent = candidates.length>1 ? '❌ Διφορούμενη αντιστοίχιση' : '❌ Δεν βρέθηκε';
        setTimeout(()=>{ _spsb.textContent='🔄 Sync από Sheet'; _spsb.disabled=false; },2500);
        return;
      }
      const match = candidates[0];
      // Update patient with smart column matching
      const getCol = (row, keywords) => Object.keys(row).reduce((val, k) => {
        if (val) return val;
        if (keywords.some(kw => k.includes(kw))) return row[k]||'';
        return val;
      }, '')||'';
      const updates = {
        medical_history: getCol(match, ['ΙΑΤΡΙΚΟ ΙΣΤΟΡΙΚΟ','Ιατρικό Ιστορικό'])||p.medical_history,

        medications: getCol(match, ['παθήσεις','φαρμακευτική'])||p.medications,
        previous_treatments: getCol(match, ['Προηγούμενες αισθητικές'])||p.previous_treatments,
        source: getCol(match, ['γνωρίσατε'])||p.source,

  const _rb247 = document.getElementById('run-b247check-btn');
  if (_rb247) _rb247.addEventListener('click', async () => {
    const rows = S._csvB247Check||[];
    if (!rows.length) return;
    const result = document.getElementById('b247check-result');
    _rb247.disabled = true;
    result.innerHTML = '<span style="color:var(--text-2)">Φόρτωση πελατών κλινικής...</span>';
    const cid = clinicId();

    // Φόρτωσε ΟΛΟΥΣ τους πελάτες (σελιδοποιημένα, όχι μόνο τους πρώτους 1000)
    const phoneToPatient = new Map();
    {
      let from = 0; const pageSize = 1000;
      while (true) {
        const {data, error} = await sb.from('patients').select('id,phone').eq('clinic_id',cid).range(from, from+pageSize-1);
        if (error) { result.innerHTML = `<span style="color:var(--red)">✗ ${esc(error.message)}</span>`; _rb247.disabled=false; return; }
        (data||[]).forEach(p => { const n = normalizePhone(p.phone); if (n) phoneToPatient.set(n, p.id); });
        if (!data || data.length < pageSize) break;
        from += pageSize;
      }
    }

    const parsed = rows.map(row => {
      const dtRaw = row['Ημερομηνία έναρξης']||'';
      const m = dtRaw.match(/(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2})/);
      if (!m) return null;
      const [, d, mo, y, h, mi] = m;
      const localTs = `${y}-${mo}-${d}T${h}:${mi}:00`; // ίδια μορφή (χωρίς offset) με του gmail-auto-sync
      const durRaw = (row['Διάρκεια']||'').trim();
      const durMatch = durRaw.match(/(?:(\d+)\s*ω)?\s*(?:(\d+)\s*λ)?/);
      const duration = durMatch ? (parseInt(durMatch[1],10)||0)*60 + (parseInt(durMatch[2],10)||0) : 0;
      const priceRaw = (row['Πληρωμή']||'').replace(/[^\d.,]/g,'').replace(',','.');
      return {
        localTs, dtRaw,
        name: (row['Πελάτης ή Τηλέφωνο']||'').trim(),
        phone: normalizePhone(row['Αριθμός τηλεφώνου πελάτη']||''),
        service: (row['Υπηρεσία']||'').trim(),
        staff: (row['Προσωπικό']||'').trim(),
        duration: duration||60,
        price: priceRaw ? parseFloat(priceRaw)||null : null,
      };
    }).filter(Boolean);

    result.innerHTML = `<span style="color:var(--text-2)">Έλεγχος 0/${parsed.length}...</span>`;
    let matched = 0, missingNoPatient = [], missingHasPatient = [];
    const CONCURRENCY = 20;
    for (let i = 0; i < parsed.length; i += CONCURRENCY) {
      const batch = parsed.slice(i, i+CONCURRENCY);
      await Promise.all(batch.map(async (r) => {
        const patientId = phoneToPatient.get(r.phone);
        r.patientId = patientId||null;
        if (!patientId) { missingNoPatient.push(r); return; }
        const {data: ex} = await sb.rpc('match_appt_by_local_time', {p_clinic_id:cid, p_patient_id:patientId, p_local_ts:r.localTs});
        if (ex && ex.length) matched++; else missingHasPatient.push(r);
      }));
      result.innerHTML = `<span style="color:var(--text-2)">Έλεγχος ${Math.min(i+CONCURRENCY,parsed.length)}/${parsed.length}...</span>`;
    }

    const allMissing = [...missingHasPatient, ...missingNoPatient];
    S._b247MissingRows = allMissing;
    const importBtn = document.getElementById('import-b247missing-btn');
    if (allMissing.length) { importBtn.style.display = 'inline-flex'; importBtn.textContent = `📥 Εισαγωγή ${allMissing.length} ραντεβού που λείπουν`; }
    else importBtn.style.display = 'none';
    const missingLines = allMissing.map(r => `${r.dtRaw} · ${esc(r.name)} · ${esc(r.phone)||'χωρίς τηλέφωνο'} · ${esc(r.service)}${r.patientId?'':' · (άγνωστος πελάτης στο CRM — θα δημιουργηθεί νέος)'}`);
    result.innerHTML = `
      <div style="margin-bottom:8px">
        <span style="color:var(--green)">✓ Ήδη στο CRM: ${matched}</span> ·
        <span style="color:var(--red)">✗ Λείπουν: ${allMissing.length}</span>

  // μετά το ραντεβού. Ξαναελέγχει με το ίδιο RPC πριν την εγγραφή, ώστε να μην πειράξει τίποτα αν έτρεξε το check παλιά.
  const _ib247 = document.getElementById('import-b247missing-btn');

    const result = document.getElementById('b247check-result');
    _ib247.disabled = true;
    const cid = clinicId();
    let created = 0, skippedDup = 0, err = 0;
    const now = new Date();
    const CONCURRENCY = 10;
    for (let i = 0; i < missing.length; i += CONCURRENCY) {
      const batch = missing.slice(i, i+CONCURRENCY);
      await Promise.all(batch.map(async (r) => {
        try {
          let patientId = r.patientId;
          if (!patientId) {
            const {data: newPt, error: ptErr} = await sb.from('patients')
              .insert({clinic_id:cid, full_name:normalizePatientName(r.name), phone:r.phone||null, status:'active', source:'booking247'})
              .select('id').single();
            if (ptErr || !newPt) { err++; return; }
            patientId = newPt.id;
            r.patientId = patientId;
          }
          const {data: ex} = await sb.rpc('match_appt_by_local_time', {p_clinic_id:cid, p_patient_id:patientId, p_local_ts:r.localTs});
          if (ex && ex.length) { skippedDup++; return; }
          const status = new Date(r.localTs) < now ? 'completed' : 'confirmed';
          const {error: apErr} = await sb.from('appointments').insert({
            clinic_id: cid, patient_id: patientId, service_name: r.service,
            start_time: r.localTs, duration_minutes: r.duration||60, price: r.price,
            status, notes: r.staff?'Προσωπικό: '+r.staff:'',
          });
          if (apErr) err++; else created++;
        } catch (e) { err++; }
      }));
      result.innerHTML = `<span style="color:var(--text-2)">Εισαγωγή ${Math.min(i+CONCURRENCY,missing.length)}/${missing.length}...</span>`;
    }
    result.innerHTML = `<span style="color:var(--green)">✓ Δημιουργήθηκαν ${created} ραντεβού</span> · <span style="color:var(--text-2)">${skippedDup} ήδη υπήρχαν</span>${err?` · <span style="color:var(--red)">${err} σφάλματα</span>`:''}`;

  // Sync GDPR Sheet now - reads BOTH tabs
  const _sgn = document.getElementById('sync-gdpr-now');
  if (_sgn) _sgn.addEventListener('click', async () => {
    const integrations = (S.clinic&&S.clinic.integrations)||{};
    const sheetId = integrations.gdpr_sheet_id || '1enyraKQzFwRd8V8hTykTg-TCZuS0B2egrXo3MXh-aA8';
    const result = document.getElementById('sync-result');
    if (!sheetId) { result.innerHTML='<span style="color:var(--red)">Δεν έχεις ρυθμίσει Google Sheet.</span>'; return; }
    result.innerHTML='<span style="color:var(--text-2)">Φόρτωση από Google Sheets (Νέα + Παλιά Ιστορικά)...</span>';
    _sgn.disabled=true;
    try {
      // Read both tabs
      const [rows1, rows2] = await Promise.all([
        fetchGoogleSheet(sheetId, 'Νέα Ιστορικά').catch(()=>[]),
        fetchGoogleSheet(sheetId, 'Παλιά Ιστορικά').catch(()=>[])
      ]);
      const allRows = dedupeHistoryRowsByPhone([...rows1, ...rows2]);
      let updated=0, skip=0;
      const skippedList = [];

      for (const row of allRows) {
        // Map columns from the sheet (ίδια keyword-λογική με το buildHistoryImportRow)
        const phone = normalizePhone(
          row['Τηλέφωνο:']||row['Τηλέφωνο']||row['phone']||''
        );
        const name = (
          row['Ονοματεπώνυμο:']||row['Ονοματεπώνυμο']||row['name']||''
        ).trim();
        if (!name&&!phone) { continue; }
        const email = row['Email:']||row['Email']||'';
        const dob = parseGreekDate(row['Ημερομηνία Γέννησης']||row['Ημ. Γέννησης']||'');
        const city = row['Περιοχή Κατοικίας:']||row['Περιοχή Κατοικίας']||row['Περιοχή']||'';
        const source = row['Από πού μας γνωρίσατε:']||row['Από πού μας γνωρίσατε']||'';
        const medHistory = historyImportGetCol(row, ['ΙΑΤΡΙΚΟ ΙΣΤΟΡΙΚΟ']);
        const allergies = historyImportGetCol(row, ['Αλλεργίες']);
        const otherConditions = historyImportGetCol(row, ['φαρμακευτική']);
        const prevTreatments = historyImportGetCol(row, ['Προηγούμενες αισθητικές']);
        const avoidAreas = historyImportGetCol(row, ['προς αποφυγή']);
        const gdprRaw = historyImportGetCol(row, ['Συναιν', 'Συμφων', 'GDPR']);
        const gdprSigned = /ναι/i.test(gdprRaw);
        const marketingRaw = historyImportGetCol(row, ['προσφορές']);
        const signedAt = parseHistoryTimestamp(historyImportGetCol(row, ['Χρονική σήμανση']));

        // Find EXISTING patient only — ακριβές τηλέφωνο, αλλιώς μοναδικό ονοματεπώνυμο.
        // Ποτέ δεν δημιουργούμε νέο πελάτη εδώ (μόνο ενημέρωση υπαρχόντων).
        let existingId = null;
        if (phone) {
          const {data:byPhone} = await sb.from('patients').select('id').eq('clinic_id',clinicId()).eq('phone',phone).limit(1);
          if (byPhone&&byPhone.length) existingId = byPhone[0].id;
        }
        if (!existingId && name) {
          const {data:byName} = await sb.from('patients').select('id').eq('clinic_id',clinicId()).ilike('full_name',name).limit(2);
          if (byName&&byName.length===1) existingId = byName[0].id;
        }

        if (!existingId) { skip++; skippedList.push(`${name||'—'} · ${phone||'χωρίς τηλέφωνο'}`); continue; }

        const payload = {
          email: email||undefined,
          dob: dob||undefined,
          city: city||undefined,
          source: source||undefined,
          medical_history: medHistory||undefined,
          allergies: allergies||undefined,
          medications: otherConditions||undefined,
          previous_treatments: prevTreatments||undefined,
          avoid_body_areas: avoidAreas||undefined,
          gdpr_signed: gdprRaw ? gdprSigned : undefined,
          gdpr_signed_at: gdprSigned && signedAt ? signedAt : undefined,
          marketing_opt_in: marketingRaw ? /ναι/i.test(marketingRaw) : undefined,
          medical_history_completed: true,
          medical_history_completed_at: signedAt||undefined,
        };
        Object.keys(payload).forEach(k => payload[k]===undefined && delete payload[k]);

        const {error} = await sb.from('patients').update(payload).eq('id',existingId);
        if (error) { console.error(error); skip++; skippedList.push(`${name||'—'} · ${phone||'—'} (σφάλμα: ${error.message})`); } else updated++;
      }
      result.innerHTML=`<span style="color:var(--green)">✓ Sync ολοκληρώθηκε!</span> ${updated} ενημερώθηκαν · ${skip} παραλείφθηκαν (χωρίς ταίριασμα υπάρχοντα πελάτη)`;
      result.innerHTML += `<br><span style="color:var(--text-2);font-size:11px">Νέα Ιστορικά: ${rows1.length} · Παλιά Ιστορικά: ${rows2.length}</span>`;
      if (skippedList.length) {
        result.innerHTML += `<div style="max-height:180px;overflow-y:auto;border:1px solid var(--border-2);border-radius:8px;padding:8px;margin-top:8px;font-size:11px;color:var(--text-2)">${skippedList.map(esc).join('<br>')}</div>`;
      }
      setTimeout(() => { loadPageData(); }, 3000);
    } catch(e) {
      result.innerHTML=`<span style="color:var(--red)">✗ ${e.message}</span>`;
    }
    _sgn.disabled=false;
  });

  // Audit — read-only comparison of Sheet vs CRM, no writes at all
  const _agn = document.getElementById('audit-gdpr-now');
  if (_agn) _agn.addEventListener('click', async () => {
    const integrations = (S.clinic&&S.clinic.integrations)||{};
    const sheetId = integrations.gdpr_sheet_id || '1enyraKQzFwRd8V8hTykTg-TCZuS0B2egrXo3MXh-aA8';
    const result = document.getElementById('audit-result');
    result.innerHTML='<span style="color:var(--text-2)">Έλεγχος (καμία αλλαγή δεν γίνεται)...</span>';
    _agn.disabled=true;
    try {
      const [rows1, rows2] = await Promise.all([
        fetchGoogleSheet(sheetId, 'Νέα Ιστορικά').catch(()=>[]),
        fetchGoogleSheet(sheetId, 'Παλιά Ιστορικά').catch(()=>[])
      ]);
      const allRows = dedupeHistoryRowsByPhone([...rows1, ...rows2]);
      const cid = clinicId();
      const FIELD_LABELS = {
        dob: 'Ημ. Γέννησης', city: 'Περιοχή', source: 'Πηγή',
        medical_history: 'Ιατρικό Ιστορικό', allergies: 'Αλλεργίες',
        medications: 'Φαρμ. Αγωγή / Παθήσεις', previous_treatments: 'Προηγ. Θεραπείες',
        avoid_body_areas: 'Περιοχές Αποφυγής',
      };
      let matchedOk = 0;
      const unmatched = [];
      const mismatches = [];

      for (const row of allRows) {
        const phone = normalizePhone(row['Τηλέφωνο:']||row['Τηλέφωνο']||row['phone']||'');
        const name = (row['Ονοματεπώνυμο:']||row['Ονοματεπώνυμο']||row['name']||'').trim();
        if (!name&&!phone) continue;
        const sheetVals = {
          dob: parseGreekDate(row['Ημερομηνία Γέννησης']||row['Ημ. Γέννησης']||'')||'',
          city: (row['Περιοχή Κατοικίας:']||row['Περιοχή Κατοικίας']||row['Περιοχή']||'').trim(),
          source: (row['Από πού μας γνωρίσατε:']||row['Από πού μας γνωρίσατε']||'').trim(),
          medical_history: historyImportGetCol(row, ['ΙΑΤΡΙΚΟ ΙΣΤΟΡΙΚΟ']).trim(),
          allergies: historyImportGetCol(row, ['Αλλεργίες']).trim(),
          medications: historyImportGetCol(row, ['φαρμακευτική']).trim(),
          previous_treatments: historyImportGetCol(row, ['Προηγούμενες αισθητικές']).trim(),
          avoid_body_areas: historyImportGetCol(row, ['προς αποφυγή']).trim(),
        };

        let existing = null;
        if (phone) {
          const {data} = await sb.from('patients').select('*').eq('clinic_id',cid).eq('phone',phone).limit(1);
          if (data&&data.length) existing = data[0];
        }
        if (!existing && name) {
          const {data} = await sb.from('patients').select('*').eq('clinic_id',cid).ilike('full_name',name).limit(2);
          if (data&&data.length===1) existing = data[0];
        }
        if (!existing) { unmatched.push(`${name||'—'} · ${phone||'χωρίς τηλέφωνο'}`); continue; }

        let rowMismatch = false;
        Object.keys(FIELD_LABELS).forEach(f => {
          const sheetV = sheetVals[f];
          const crmV = (existing[f]||'').toString().trim();
          if (sheetV && sheetV !== crmV) {
            mismatches.push({ name: existing.full_name, phone: existing.phone, field: FIELD_LABELS[f], crm: crmV||'(κενό)', sheet: sheetV });
            rowMismatch = true;
          }
        });
        if (!rowMismatch) matchedOk++;
      }

      let html = `<div style="margin-bottom:8px">
        <span style="color:var(--green);font-weight:600">✓ ${matchedOk} ταιριάζουν πλήρως</span>
        ${mismatches.length ? ` · <span style="color:var(--amber-dark);font-weight:600">⚠ ${mismatches.length} διαφορές σε ${new Set(mismatches.map(m=>m.name+m.phone)).size} πελάτες</span>` : ''}
        ${unmatched.length ? ` · <span style="color:var(--red)">✗ ${unmatched.length} χωρίς ταίριασμα</span>` : ''}
      </div>`;
      if (mismatches.length) {
        html += `<div style="max-height:320px;overflow-y:auto;border:1px solid var(--border-2);border-radius:8px"><table style="width:100%;border-collapse:collapse;font-size:11px">
          <thead><tr style="background:var(--surface)"><th style="padding:6px 8px;text-align:left">Πελάτης</th><th style="padding:6px 8px;text-align:left">Πεδίο</th><th style="padding:6px 8px;text-align:left">Στο CRM</th><th style="padding:6px 8px;text-align:left">Στο Sheet</th></tr></thead>
          <tbody>${mismatches.map(m=>`<tr style="border-top:1px solid var(--border-2)">
            <td style="padding:5px 8px">${esc(m.name)} · ${esc(m.phone||'')}</td>
            <td style="padding:5px 8px">${esc(m.field)}</td>
            <td style="padding:5px 8px;color:var(--red)">${esc(m.crm)}</td>
            <td style="padding:5px 8px;color:var(--green)">${esc(m.sheet)}</td>
          </tr>`).join('')}</tbody>
        </table></div>`;
      }
      if (unmatched.length) {
        html += `<div style="margin-top:8px;font-size:11px;color:var(--text-2)"><b>Χωρίς ταίριασμα:</b><br>${unmatched.map(esc).join('<br>')}</div>`;
      }
      result.innerHTML = html;
    } catch(e) {
      result.innerHTML=`<span style="color:var(--red)">✗ ${e.message}</span>`;
    }
    _agn.disabled=false;
  });

  // Bulk history backfill (file upload ή paste)
  const _hif = document.getElementById('history-import-file');
  if (_hif) _hif.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      document.getElementById('history-import-paste').value = ev.target.result;
      document.getElementById('history-import-file-name').textContent = `📎 ${file.name} (${(file.size/1024).toFixed(1)} KB) φορτώθηκε — πάτησε Προεπισκόπηση`;
    };
    reader.readAsText(file, 'UTF-8');
  });
  const _phib = document.getElementById('preview-history-import-btn');
  if (_phib) _phib.addEventListener('click', previewHistoryImport);
  const _chib = document.getElementById('confirm-history-import-btn');
  if (_chib) _chib.addEventListener('click', confirmHistoryImport);

  // Clear CSV buttons
  const _ccpb = document.getElementById('clear-patients-csv');
  if (_ccpb) _ccpb.addEventListener('click', () => {
    S._csvPatients=null;
    document.getElementById('csv-patients-preview').innerHTML='';
    document.getElementById('import-patients-btn').style.display='none';
    _ccpb.style.display='none';
    document.getElementById('csv-patients-file').value='';
  });
  const _ccab = document.getElementById('clear-appts-csv');
  if (_ccab) _ccab.addEventListener('click', () => {
    S._csvAppts=null;
    document.getElementById('csv-appts-preview').innerHTML='';
    document.getElementById('import-appts-btn').style.display='none';
    _ccab.style.display='none';
    document.getElementById('csv-appts-file').value='';
  });

  // Settings logout
  const _sl=document.getElementById('settings-logout');if(_sl)_sl.addEventListener('click', async () => { await logout(); });

  // Delete consent template
  document.querySelectorAll('[data-del-tmpl]').forEach(el => {
    el.onclick = async () => {
      if (!confirm('Διαγραφή template;')) return;
      await sb.from('service_consent_templates').delete().eq('id',el.dataset.delTmpl);
      loadPageData();
    };
  });

  // Delete consultation (μόνο clinic_admin/super_admin, βλ. canDeleteConsult στο renderConsultations)
  document.querySelectorAll('[data-del-consult]').forEach(el => {
    el.onclick = async () => {
      if (!confirm('Σίγουρα θέλεις να διαγράψεις οριστικά αυτό το consultation; Δεν αναιρείται.')) return;
      const {error} = await sb.from('gdpr_consents').delete().eq('id', el.dataset.delConsult);
      if (error) { alert('Σφάλμα: '+error.message); return; }
      await loadData();
      render();
    };
  });

  // Seed the 5 standard consent-group templates (skips ones that already exist)
  const _scg = document.getElementById('seed-consent-groups');
  if (_scg) _scg.addEventListener('click', async () => {
    _scg.textContent = 'Δημιουργία...'; _scg.disabled = true;
    const existing = new Set((S.consentTemplates||[]).map(t=>t.service_name));
    const toCreate = CONSENT_GROUPS.filter(g=>!existing.has(g));
    for (const g of toCreate) {
      await sb.from('service_consent_templates').insert({
        clinic_id: clinicId(), service_name: g, consent_text: CONSENT_GROUP_TEXTS[g]
      });
    }
    _scg.textContent = '✨ Δημιουργία των 5 βασικών templates'; _scg.disabled = false;
    if (!toCreate.length) alert('Τα 5 βασικά templates υπάρχουν ήδη.');
    await loadPageData();
  });

  // Save service → consent-group mapping
  const _sscm = document.getElementById('save-service-consent-map');
  if (_sscm) _sscm.addEventListener('click', async () => {
    const result = document.getElementById('save-service-consent-map-result');
    _sscm.textContent = 'Αποθήκευση...'; _sscm.disabled = true;
    const map = {};
    document.querySelectorAll('.svc-consent-group').forEach(sel => {
      if (sel.value) map[sel.dataset.svc] = sel.value;
    });
    const settings = Object.assign({}, (S.clinic&&S.clinic.settings)||{}, {service_consent_groups: map});
    const {error} = await sb.from('clinics').update({settings}).eq('id', clinicId());
    _sscm.textContent = 'Αποθήκευση Αντιστοιχίσεων'; _sscm.disabled = false;
    if (error) { if(result) result.innerHTML = '<span style="color:var(--red)">✗ '+esc(error.message)+'</span>'; return; }
    if (S.clinic) S.clinic.settings = settings;
    S.serviceConsentMap = map;
    if (result) { result.innerHTML = '<span style="color:var(--green)">✓ Αποθηκεύτηκε</span>'; setTimeout(()=>{ if(result) result.innerHTML=''; }, 2500); }
  });

  // Consultation curated services/products lists
  const _addSvc = document.getElementById('add-consult-service');
  if (_addSvc) _addSvc.addEventListener('click', () => {
    const inp = document.getElementById('new-consult-service');
    const v = (inp&&inp.value||'').trim();
    if (!v) return;
    S._consultServicesDraft = S._consultServicesDraft||[];
    if (!S._consultServicesDraft.includes(v)) S._consultServicesDraft.push(v);
    render();
  });
  document.querySelectorAll('[data-remove-consult-service]').forEach(el => {
    el.addEventListener('click', () => {
      const i = Number(el.dataset.removeConsultService);
      S._consultServicesDraft.splice(i,1);
      render();
    });
  });
  document.querySelectorAll('[data-add-consult-product]').forEach(el => {
    el.addEventListener('click', () => {
      const cat = el.dataset.addConsultProduct;
      const inp = document.getElementById('new-consult-product-'+cat);
      const v = (inp&&inp.value||'').trim();
      if (!v) return;
      S._consultProductsDraft = S._consultProductsDraft||{cleaning:[],care:[],protection:[],body:[]};
      S._consultProductsDraft[cat] = S._consultProductsDraft[cat]||[];
      if (!S._consultProductsDraft[cat].includes(v)) S._consultProductsDraft[cat].push(v);
      render();
    });
  });
  document.querySelectorAll('[data-remove-consult-product]').forEach(el => {
    el.addEventListener('click', () => {
      const cat = el.dataset.cat;
      const i = Number(el.dataset.removeConsultProduct);
      S._consultProductsDraft[cat].splice(i,1);
      render();
    });
  });
  const _scl = document.getElementById('save-consult-lists');
  if (_scl) _scl.addEventListener('click', async () => {
    const result = document.getElementById('save-consult-lists-result');
    _scl.textContent = 'Αποθήκευση...'; _scl.disabled = true;
    const settings = Object.assign({}, (S.clinic&&S.clinic.settings)||{}, {
      consultation_services: S._consultServicesDraft||[],
      consultation_products: S._consultProductsDraft||{cleaning:[],care:[],protection:[],body:[]}
    });
    const {error} = await sb.from('clinics').update({settings}).eq('id', clinicId());
    _scl.textContent = 'Αποθήκευση Λιστών'; _scl.disabled = false;
    if (error) { if(result) result.innerHTML = '<span style="color:var(--red)">✗ '+esc(error.message)+'</span>'; return; }
    if (S.clinic) S.clinic.settings = settings;
    if (result) { result.innerHTML = '<span style="color:var(--green)">✓ Αποθηκεύτηκε</span>'; setTimeout(()=>{ if(result) result.innerHTML=''; }, 2500); }
  });

  // Laser form click
  document.querySelectorAll('[data-laser]').forEach(el => {
    el.onclick = () => { loadLaserForm(el.dataset.laser); };
  });
  const _hb=document.getElementById('hamburger');if(_hb)_hb.addEventListener('click', () => { S.sidebarOpen=!S.sidebarOpen; render(); });
  const _tt=document.getElementById('theme-toggle');if(_tt)_tt.addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme')==='dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', cur);
    try { localStorage.setItem('medi360-theme', cur); } catch(e) {}
    const _m=document.querySelector('meta[name="theme-color"]'); if(_m)_m.setAttribute('content', cur==='dark'?'#0A1830':'#0E2757');
    render();
  });
  const _ov=document.getElementById('overlay');if(_ov)_ov.addEventListener('click', () => { S.sidebarOpen=false; render(); });
  const _cb=document.getElementById('collapse-btn');if(_cb)_cb.addEventListener('click', () => { S.sidebarCollapsed=!S.sidebarCollapsed; render(); });
  const _lb=document.getElementById('logout-btn');if(_lb)_lb.addEventListener('click', async () => { await logout(); });

  // Clinic picker
  const _cpb=document.getElementById('clinic-picker-btn');if(_cpb)_cpb.addEventListener('click', () => {
    const dd = document.getElementById('clinic-dropdown');
    if (dd) dd.style.display = dd.style.display==='none' ? 'block' : 'none';
  });
  document.querySelectorAll('[data-clinic]').forEach(el => {
    el.onclick = () => { selectClinic(el.dataset.clinic); };
  });

  // Reports — date range refresh
  const _rrf = document.getElementById('report-refresh');
  if (_rrf) _rrf.addEventListener('click', () => {
    const from = document.getElementById('report-from').value;
    const to = document.getElementById('report-to').value;
    if (!from||!to) return alert('Επίλεξε και τις δύο ημερομηνίες');
    if (from>to) return alert('Η ημερομηνία "Από" πρέπει να είναι πριν το "Έως"');
    S.reportRange = {from, to};
    loadPageData();
  });

  // Reports — send by email
  const _rse = document.getElementById('report-send-email');
  if (_rse) _rse.addEventListener('click', async () => {
    const to = document.getElementById('report-email-to').value.trim();
    const result = document.getElementById('report-email-result');
    if (!to) { if(result) result.innerHTML = '<span style="color:var(--red)">Συμπλήρωσε email παραλήπτη</span>'; return; }
    _rse.textContent = 'Αποστολή...'; _rse.disabled = true;
    if (result) result.innerHTML = '<span style="color:var(--text-2)">Αποστολή...</span>';
    try {
      const s = computeReportStats();
      const {data, error} = await sb.functions.invoke('send-report-email', {
        body: {
          to,
          clinic_name: (S.clinic&&S.clinic.name)||'',
          range: S.reportRange,
          stats: {
            appointments: s.apts.length,
            revenue: canSee(['super_admin','clinic_admin']) ? s.revenue : null,
            new_patients: s.newPatients.length,
            new_patients_delta: s.newPatientsDelta,
            new_patients_pct: s.newPatientsPct,
            no_show_rate: s.noShowRate,
            gdpr_rate: s.gdprRate,
            utilization_rate: s.utilizationRate,
            consultations: s.consultations.length,
            consultations_delta: s.consultDelta,
            consultations_pct: s.consultPct,
            recommended_done: s.recommendedDone,
            recommended_total: s.recommendedTotal,
            top_services: s.topServices.map(([name,d])=>({name, count:d.count, revenue:d.revenue})),
          }
        }
      });
      if (error) { result.innerHTML = '<span style="color:var(--red)">✗ Αποτυχία αποστολής: '+esc(await extractInvokeErrorMessage(error))+'</span>'; return; }
      if (result) result.innerHTML = '<span style="color:var(--green)">✓ Η αναφορά στάλθηκε στο '+esc(to)+'</span>';
    } catch(e) {
      if (result) result.innerHTML = '<span style="color:var(--red)">✗ Αποτυχία αποστολής: '+esc(e.message||'άγνωστο σφάλμα')+'</span>';
    } finally {
      _rse.textContent = '📧 Αποστολή με Email'; _rse.disabled = false;
    }
  });
}

function bindModalEvents() {
  // Warn on duplicate phone while filling in a new patient
  const _fp = document.getElementById('f-phone');
  if (_fp) _fp.addEventListener('blur', async () => {
    const phone = _fp.value.trim();
    const warning = document.getElementById('f-phone-warning');
    if (!warning) return;
    if (!phone) { warning.style.display='none'; return; }
    const dup = await findDuplicatePatientByPhone(phone);
    warning.style.display = dup ? 'block' : 'none';
    warning.textContent = dup ? `⚠ Υπάρχει ήδη ασθενής με αυτό το τηλέφωνο: ${dup.full_name}` : '';
  });

  // Save patient
  const _sp=document.getElementById('save-patient');if(_sp)_sp.addEventListener('click', async () => {
    const name = document.getElementById('f-name').value.trim();
    const phone = document.getElementById('f-phone').value.trim();
    const email = document.getElementById('f-email').value.trim();
    if (!name||!phone||!email) return alert('Συμπλήρωσε τα υποχρεωτικά πεδία: Ονοματεπώνυμο, Τηλέφωνο, Email');
    if (!/^\S+@\S+\.\S+$/.test(email)) return alert('Το email δεν είναι έγκυρο');
    if (!/^\+?\d{10,13}$/.test(phone.replace(/\s/g,''))) return alert('Το τηλέφωνο δεν είναι έγκυρο (10-13 ψηφία)');
    const dup = await findDuplicatePatientByPhone(phone);
    if (dup && !confirm(`Υπάρχει ήδη ασθενής με αυτό το τηλέφωνο: ${dup.full_name}. Θέλεις να συνεχίσεις με νέα καταχώρηση;`)) return;
    const btn = document.getElementById('save-patient');
    btn.textContent='Αποθήκευση...'; btn.disabled=true;
    const {error} = await sb.from('patients').insert({
      full_name:normalizePatientName(name), phone, email:document.getElementById('f-email').value,
      gender:document.getElementById('f-gender').value,
      status:document.getElementById('f-status').value,
      source:document.getElementById('f-source').value,
      clinic_id:clinicId()
    });
    if (error) { alert(error.message); btn.textContent='Αποθήκευση'; btn.disabled=false; return; }
    closeModal(); await loadPageData();
  });

  // Patient search for appointment — dropdown με το focus, live αναζήτηση, δημιουργία νέου ασθενή
  const ps = document.getElementById('a-patient-search');
  if (ps) {
    let psTimer = null;
    const showPatientDropdown = async () => {
      const q = ps.value.trim().replace(/[,()]/g,' ');
      const res = document.getElementById('a-patient-results');
      let query = sb.from('patients').select('id,full_name,phone').eq('clinic_id',clinicId());
      if (q.length >= 1) query = query.or(`full_name.ilike.%${q}%,phone.ilike.%${q}%`);
      const {data} = await query.order('full_name').limit(8);
      const rows = (data||[]).map(p=>`<div class="pt-opt" style="padding:9px 12px;cursor:pointer;font-size:12px" data-pid="${p.id}" data-pname="${esc(p.full_name)}">${esc(p.full_name)} · ${esc(p.phone||'')}</div>`).join('');
      const newOpt = `<div id="pt-new" style="padding:10px 12px;cursor:pointer;font-size:12px;font-weight:700;color:var(--blue);background:var(--surface-2)">➕ Νέος ασθενής${q.length>=2?`: «${esc(q)}»`:''}</div>`;
      res.innerHTML = (rows || `<div style="padding:9px 12px;font-size:12px;color:var(--text-3)">Κανένα αποτέλεσμα</div>`) + newOpt;
      res.style.display='block';
      res.querySelectorAll('.pt-opt').forEach(el => {
        el.onclick = () => { document.getElementById('a-patient-id').value=el.dataset.pid; ps.value=el.dataset.pname; res.style.display='none'; };
        el.onmouseover = () => el.style.background='var(--surface)';
        el.onmouseout = () => el.style.background='';
      });
      const nb = document.getElementById('pt-new');
      if (nb) nb.onclick = async () => {
        let name = q.length>=2 ? q : (prompt('Ονοματεπώνυμο νέου ασθενή:')||'').trim();
        if (!name || name.length<2) return;
        const phone = (prompt('Τηλέφωνο (υποχρεωτικό):')||'').trim();
        if (!/^\+?\d{10,13}$/.test(phone.replace(/\s/g,''))) { alert('Το τηλέφωνο είναι υποχρεωτικό (10-13 ψηφία)'); return; }
        const email = (prompt('Email (υποχρεωτικό):')||'').trim();
        if (!/^\S+@\S+\.\S+$/.test(email)) { alert('Το email είναι υποχρεωτικό και πρέπει να είναι έγκυρο'); return; }
        const {data:np, error} = await sb.from('patients')
          .insert({clinic_id:clinicId(), full_name:normalizePatientName(name), phone, email, status:'active'})
          .select('id,full_name').single();
        if (error) { alert('Σφάλμα: '+error.message); return; }
        document.getElementById('a-patient-id').value = np.id;
        ps.value = np.full_name;
        res.style.display='none';
      };
    };
    ps.onfocus = showPatientDropdown;
    ps.oninput = () => { clearTimeout(psTimer); psTimer = setTimeout(showPatientDropdown, 200); };
    document.addEventListener('click', (e) => {
      const res = document.getElementById('a-patient-results');
      if (res && !e.target.closest('#a-patient-search') && !e.target.closest('#a-patient-results')) res.style.display='none';
    }, {once:false});
  }

  // Save appointment
  const _sa=document.getElementById('save-appt');if(_sa)_sa.addEventListener('click', async () => {

// ── BOOKING247 EMAIL SYNC ──
function normalizePatientName(s) {
  // Στα κεφαλαία ελληνικά τα φωνήεντα γράφονται ΧΩΡΙΣ τόνο (ΓΕΩΡΓΙΑ, όχι ΓΕΩΡΓΊΑ).
  // Αποσυνθέτουμε (NFD) το γράμμα από τον τόνο και αφαιρούμε μόνο
  // το combining mark του τόνου (U+0301) — όχι τα διαλυτικά (U+0308, π.χ. Ϊ).
  return (s||'')
    .trim()
    .toUpperCase()
    .normalize('NFD')
    .replace(/\u0301/g, '')
    .normalize('NFC');
}

function normalizePhone(p) {
  if (!p) return '';
  let digits = (p+'').replace(/[^\d]/g,'');
  // "00" international access code (π.χ. 0039...) ισοδυναμεί με "+" — αφαίρεσέ το
  // πριν ελέγξουμε για ελληνικό κωδικό χώρας, αλλιώς π.χ. "0030..." δεν αναγνωριζόταν.
  if (digits.startsWith('00') && digits.length > 10) digits = digits.slice(2);
  if (digits.startsWith('30') && digits.length > 10) digits = digits.slice(2);
  digits = digits.replace(/^0+/,'');
  return digits;
}

async function findDuplicatePatientByPhone(phone) {
  const norm = normalizePhone(phone);
  if (!norm || norm.length < 9) return null;
  const {data} = await sb.from('patients').select('id,full_name').eq('clinic_id',clinicId()).ilike('phone','%'+norm+'%').limit(1);
  return (data&&data[0])||null;
}

const MERGE_REASSIGN_TABLES = ['appointments','laser_forms','laser_consents','service_consents','gdpr_consents','patient_photos','sms_log'];
const MERGE_FILL_FIELDS = ['email','dob','city','source','medical_history','allergies','medications','previous_treatments','avoid_body_areas','gdpr_signed_at'];

function detectDuplicatePatientGroups() {
  const groups = {};
  (S.patients||[]).forEach(p => {
    const norm = normalizePhone(p.phone);
    if (!norm || norm.length < 9) return;
    (groups[norm] = groups[norm] || []).push(p);
  });
  return Object.values(groups).filter(list => list.length > 1);
}

function pickMergePrimary(list) {
  const score = (p) => {
    let s = 0;
    ['email','dob','city','source','medical_history','allergies','medications','previous_treatments','avoid_body_areas'].forEach(f => { if (p[f]) s++; });
    if (p.gdpr_signed) s += 2;
    if (p.ltv) s += 1;
    return s;
  };
  return [...list].sort((a,b) => score(b)-score(a) || new Date(a.created_at)-new Date(b.created_at))[0];
}

async function mergePatients(primaryId, dupIds) {
  try {
    for (const table of MERGE_REASSIGN_TABLES) {
      for (const dupId of dupIds) {
        await sb.from(table).update({patient_id: primaryId}).eq('patient_id', dupId);
      }
    }
    const {data: rows, error: fetchErr} = await sb.from('patients').select('*').in('id', [primaryId, ...dupIds]);
    if (fetchErr) return fetchErr.message;
    const primary = (rows||[]).find(r=>r.id===primaryId);
    const dups = (rows||[]).filter(r=>dupIds.includes(r.id));
    if (!primary) return 'Δεν βρέθηκε ο κύριος ασθενής';
    const patch = {};
    MERGE_FILL_FIELDS.forEach(f => {
      if (!primary[f]) {
        const donor = dups.find(d=>d[f]);
        if (donor) patch[f] = donor[f];
      }
    });
    if (!primary.gdpr_signed && dups.some(d=>d.gdpr_signed)) patch.gdpr_signed = true;
    if (!primary.marketing_opt_in && dups.some(d=>d.marketing_opt_in)) patch.marketing_opt_in = true;
    // Αν μετά τη συγχώνευση ο κύριος ασθενής έχει (ή αποκτά) υπογεγραμμένο GDPR, ή κάποιος από
    // τους διπλότυπους είχε ήδη ολοκληρωμένο ιατρικό ιστορικό, βάλε τη σημαία τώρα — αλλιώς μένει
    // "❌ Όχι" στα Στοιχεία παρότι το ιατρικό ιστορικό μεταφέρθηκε κανονικά (MERGE_FILL_FIELDS).
    const finalGdprSigned = patch.gdpr_signed !== undefined ? patch.gdpr_signed : primary.gdpr_signed;
    const donorHadCompleted = dups.some(d=>d.medical_history_completed);
    if (!primary.medical_history_completed && (finalGdprSigned || donorHadCompleted)) {
      patch.medical_history_completed = true;
      patch.medical_history_completed_at = primary.medical_history_completed_at || dups.map(d=>d.medical_history_completed_at).find(Boolean) || primary.gdpr_signed_at || new Date().toISOString();
    }
    const sumLtv = (primary.ltv||0) + dups.reduce((s,d)=>s+(d.ltv||0),0);
    if (sumLtv !== (primary.ltv||0)) patch.ltv = sumLtv;
    if (Object.keys(patch).length) {
      const {error: updErr} = await sb.from('patients').update(patch).eq('id', primaryId);
      if (updErr) return updErr.message;
    }
    for (const dupId of dupIds) {
      const {error: delErr} = await sb.from('patients').delete().eq('id', dupId);
      if (delErr) return delErr.message;
    }
    return null;
  } catch (e) {
    return e.message || String(e);
  }
}

  const inclinicMatch = text.match(/IN-CLINIC\s*:?\s*\n?([\s\S]+?)(?:\nHOMECARE|$)/i)
                      || text.match(/In-Clinic:\s*([\s\S]+?)(?:\nHomecare:|$)/i);
  const homecareMatch = text.match(/HOMECARE\s*:?\s*\n?([\s\S]+?)$/i)
                      || text.match(/Homecare:\s*([\s\S]+?)$/i);

  document.getElementById('ce-skin').value = skinMatch ? skinMatch[1].trim() : '';
  document.getElementById('ce-expected').value = expectedMatch ? expectedMatch[1].trim() : '';
  document.getElementById('ce-inclinic').value = inclinicMatch ? inclinicMatch[1].trim() : '';
  document.getElementById('ce-homecare').value = homecareMatch ? homecareMatch[1].trim() : '';
  document.getElementById('consult-edit-result').textContent = '';
  document.getElementById('consult-edit-modal').style.display = 'block';
}

  const inclinic = document.getElementById('ce-inclinic').value.trim();

    + (skin ? '\nSKIN PROFILE\nΤύπος δέρματος / κύρια ανάγκη:\n' + skin : '')
    + (expected ? '\nEXPECTED RESULTS\nΤι να περιμένετε:\n' + expected : '')
    + (inclinic ? '\nIN-CLINIC\n' + inclinic : '')
    + (homecare ? '\nHOMECARE\n' + homecare : '');

  resultEl.innerHTML = '<span style="color:var(--text-2)">Αποθήκευση...</span>';

// Σπάει ένα IN-CLINIC/HOMECARE block σε {label, items} ανά γραμμή — ίδια μορφή με
// αυτή που γράφει το cf-save (index.html) στο consent_text ("1) Ετικέτα: Α, Β").
function _parseConsentStepLines(raw) {
  return (raw||'').split('\n').map(l=>l.trim()).filter(Boolean).map(line => {
    const m = line.match(/^(?:\d\)\s*)?([^:]+):\s*(.*)$/);
    if (!m) return null;
    const items = m[2].split(',').map(s=>s.trim()).filter(Boolean);
    return items.length ? {label: m[1].trim(), items} : null;
  }).filter(Boolean);
}

// Επαναποστολή ενός ΠΑΛΑΙΟΤΕΡΟΥ, ήδη αποθηκευμένου consultation στον πελάτη —
// ξαναπαρσάρει το αποθηκευμένο consent_text (ό,τι είναι πραγματικά αποθηκευμένο,
// άρα και τυχόν επεξεργασία μέσω saveConsultEdit) και καλεί το ίδιο edge function
// με το αρχικό Consultation Form.
async function resendConsultationToPatient(consultId) {
  const c = (S.patConsultations||[]).find(x=>x.id===consultId);
  const p = S.patientDetail;
  if (!c || !p) return;
  if (!p.email) { alert('Ο/Η '+(p.full_name||'ασθενής')+' δεν έχει καταχωρημένο email — δεν μπορεί να σταλεί.'); return; }

  const text = c.consent_text||'';
  const skinMatch = text.match(/SKIN PROFILE\s*:?\s*\n?([\s\S]+?)(?:\n\s*(?:EXPECTED|IN-CLINIC|HOMECARE|Σημειώσεις)|$)/i);
  const expectedMatch = text.match(/EXPECTED[^\n]*\n?([\s\S]+?)(?:\n\s*(?:IN-CLINIC|HOMECARE|Σημειώσεις)|$)/i);
  const inClinicMatch = text.match(/IN-CLINIC\s*:?\s*\n?([\s\S]+?)(?:\n\s*(?:HOMECARE|EXPECTED|Σημειώσεις)|$)/i);
  const homecareMatch = text.match(/HOMECARE\s*:?\s*\n?([\s\S]+?)(?:\n\s*(?:EXPECTED|Σημειώσεις)|$)/i);
  const notesMatch = text.match(/Σημειώσεις:?\s*\n?([\s\S]+?)$/i);

  const skinLine = (skinMatch ? skinMatch[1] : '').replace(/^Τύπος δέρματος[^\n]*:\s*\n?/i, '').trim();
  const expectedRaw = (expectedMatch ? expectedMatch[1] : '').replace(/^Τι να περιμένετε[^\n]*:\s*\n?/i, '').trim();
  const expectedResults = expectedRaw.split(',').map(s=>s.trim()).filter(Boolean);
  const inClinicSteps = _parseConsentStepLines(inClinicMatch ? inClinicMatch[1] : '');
  const homecareSteps = _parseConsentStepLines(homecareMatch ? homecareMatch[1] : '');
  const additionalNotes = notesMatch ? notesMatch[1].trim() : '';

  if (!confirm('Επαναποστολή αυτού του consultation στον/στην '+p.full_name+' ('+p.email+');')) return;

  const clinicInfo = S.clinic || {};
  const {data, error} = await sb.functions.invoke('send-consultation-email', {
    body: {
      to: p.email, clinic_name: clinicInfo.name, client_name: p.full_name,
      skin_line: skinLine, expected_results: expectedResults,
      in_clinic_steps: inClinicSteps, homecare_steps: homecareSteps,
      additional_notes: additionalNotes,
      booking_link: clinicInfo.booking_link, website_link: clinicInfo.website,
      instagram_link: clinicInfo.instagram, facebook_link: clinicInfo.facebook, maps_link: clinicInfo.maps_link,
    },
  });
  const errMsg = error ? await extractInvokeErrorMessage(error) : ((data&&data.error)||'');
  if (errMsg) { alert('⚠ Δεν στάλθηκε: '+errMsg); return; }
  alert('✓ Στάλθηκε ξανά στον/στην '+p.full_name);
}

function parseFullSkincareEmail(text) {
  const clean = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  const nameMatch = clean.match(/Αγαπητή\/έ\s+(.+?)[,\n]/i)||clean.match(/Αγαπητ[ήη]\s+(.+?)[,\n]/i);
  const therapistMatch = clean.match(/θεραπεύτριά\s+σας[,\s]+([^,\n]+)/i)||clean.match(/Θεραπεύτρια:\s*([^\n]+)/i);
  const skinStart = clean.search(/[Ss]kin\s*[Pp]rofile|Τύπος δέρματος/i);
  const expectedStart = clean.search(/[Ee]xpected|Τι να περιμένετε|Αναμενόμενα/i);
  const inClinicStart = clean.search(/IN-CLINIC|in.clinic|Κλινική θεραπ/i);
  const homecareStart = clean.search(/HOMECARE|[Hh]omecare|Καθημερινός καθαρισμός/i);
  const section = (start, end) => {
    if (start < 0) return '';
    const s = end > start && end > 0 ? clean.slice(start, end) : clean.slice(start);
    return s.replace(/^[^\n]*\n/,'').trim();
  };
  return {
    name: nameMatch ? nameMatch[1].trim() : '',
    therapist: therapistMatch ? therapistMatch[1].trim() : '',
    skin: section(skinStart, [expectedStart,inClinicStart,homecareStart].filter(x=>x>skinStart).sort((a,b)=>a-b)[0]||0),
    expected: section(expectedStart, [inClinicStart,homecareStart].filter(x=>x>expectedStart).sort((a,b)=>a-b)[0]||0),
    inClinic: section(inClinicStart, homecareStart > inClinicStart ? homecareStart : 0),
    homecare: section(homecareStart, 0).split(/Κλείστε|Book|Beauty Line/i)[0].trim()
  };
}

function parseSkincareEmail(snippet, toEmail, date) {
  // Format: "... Αγαπητή/έ NAME, Η θεραπεύτριά σας, THERAPIST, ετοίμασε ..."
  // Then: "Skin profile CONDITION" or "skin profile CONDITION"
  const clean = (snippet||'').replace(/&amp;/g,'&').replace(/<[^>]+>/g,'').replace(/\s+/g,' ');
  const nameMatch = clean.match(/Αγαπητή\/έ\s+(.+?),\s+Η θεραπεύτριά/i)
                 || clean.match(/Αγαπητή\/έ\s+(.+?),\s+Σας/i);
  const therapistMatch = clean.match(/θεραπεύτριά σας,\s+([^,]+),/i);
  const skinMatch = clean.match(/[Ss]kin\s*profile\s+(.+?)(?:Προτεινόμενες|Καταγραφή|EXPECTED|IN-CLINIC|$)/i)
                 || clean.match(/Skin profile\s+(.{5,80})/i);

  if (!nameMatch) return null;
  const name = nameMatch[1].trim();
  // Skip test emails (Γιόχαν/Johan)
  if (/γιόχαν|yohan|johan/i.test(name)) return null;

  return {
    name,
    therapist: therapistMatch ? therapistMatch[1].trim() : '',
    skin_profile: skinMatch ? skinMatch[1].trim().slice(0,200) : '',
    email: toEmail||'',
    date: date ? new Date(date).toISOString().split('T')[0] : new Date().toISOString().split('T')[0],
  };
}
