<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0E2757"/>
<script>
// Theme init ΠΡΙΝ το render — αποφυγή flash. Προτεραιότητα: επιλογή χρήστη → ρύθμιση συσκευής
(function(){
  try {
    var t = localStorage.getItem('medi360-theme');
    if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  } catch(e) { document.documentElement.setAttribute('data-theme','light'); }
})();
</script>
<title>medi360 CRM</title>
<!-- Security cleaned: no service_role key in frontend. Version: safe-frontend-2026-04-28 -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&family=DM+Mono:wght@400&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://use.typekit.net/fbo3icq.css"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* ── MEDI360 BRAND SYSTEM v1.0 ── */
  --blue:#0344F2;/* Electric Blue — Action Glow (links, actions) */
  --blue-soft:rgba(3,68,242,0.08);
  --navy:#0E2757;/* Midnight Blue — Brand Primary / Authority Core */
  --neon:#C0F968;/* Active Pulse — ΜΟΝΟ για ΜΙΑ conversion ενέργεια ανά σελίδα */
  --neon-text:#0E2757;
  --light-blue:#9BC0FA;/* Clear Sky */
  --soft-mint:#C6E5DE;/* Structural Shade */
  --teal:#00475D;/* Midnight Support */
  --white:#fff;--surface:#F7FAFD;/* Ghost White — primary content surfaces */
  --surface-2:#F1F4F7;/* Surface Low — Canvas Base */
  --border:rgba(14,39,87,0.1);--border-2:rgba(14,39,87,0.06);
  --green:#10b981;--green-soft:#E1F5EE;--green-dark:#0F6E56;
  --amber-soft:#FAEEDA;--amber-dark:#854F0B;
  --red:#ef4444;--red-soft:#FCEBEB;--red-dark:#A32D2D;
  --purple-soft:#EEEDFE;--purple-dark:#3C3489;
  --blue-2-soft:#E6F1FB;--blue-2-dark:#185FA5;
  --text:#181C1E;/* ΠΟΤΕ pure black */ --text-2:#5b6380;--text-3:#9aa0b8;
  --shadow-sm:0 1px 3px rgba(14,39,87,0.06);
  --shadow:0 4px 16px rgba(14,39,87,0.1);
  --shadow-lg:0 16px 48px rgba(14,39,87,0.15);
  /* Body/UI: Myriad Pro (Typekit) → fallback Segoe UI/Liberation Sans */
  --font:'myriad-pro','Segoe UI','Liberation Sans',system-ui,sans-serif;
  /* Headlines only: Ubuntu */
  --font-head:'Ubuntu',sans-serif;
  --mono:'DM Mono',monospace;
}
html{font-size:14px}
/* ── DARK MODE (Night) — Midnight Blue βάση, tonal layering σε σκούρα επίπεδα ── */
html[data-theme="dark"]{color-scheme:dark}
html[data-theme="dark"]:root{
  --white:#12233F;            /* κάρτες/επιφάνειες πάνω από το βαθύ φόντο */
  --surface:#0A1830;          /* κύριο φόντο — βαθύτερο του Midnight */
  --surface-2:#0E2040;        /* Canvas base σκούρο */
  --border:rgba(155,192,250,0.16);
  --border-2:rgba(155,192,250,0.10);
  --text:#E8ECF4;--text-2:#9FB0CC;--text-3:#6B7A99;
  --blue:#6E96FF;             /* Action Glow πιο φωτεινό για αντίθεση σε σκούρο */
  --blue-soft:rgba(110,150,255,0.14);
  --neon-text:#0E2757;
  --green-soft:rgba(16,185,129,0.16);--green-dark:#5DD3AE;
  --amber-soft:rgba(217,155,55,0.16);--amber-dark:#E5B567;
  --red-soft:rgba(239,68,68,0.16);--red-dark:#F08A8A;
  --purple-soft:rgba(124,116,220,0.18);--purple-dark:#B4ADF0;
  --blue-2-soft:rgba(70,130,200,0.18);--blue-2-dark:#7FB3E8;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.4);
  --shadow:0 4px 16px rgba(0,0,0,0.5);
  --shadow-lg:0 16px 48px rgba(0,0,0,0.6);
}
html[data-theme="dark"] .sidebar{background:#001338}
html[data-theme="dark"] .hamburger span{background:var(--text)}
html[data-theme="dark"] thead th{background:var(--surface-2)}
html[data-theme="dark"] .page-header{background:var(--surface)}
/* Toggle κουμπί θέματος */
.theme-toggle{background:none;border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:14px;cursor:pointer;color:var(--text-2);line-height:1;flex-shrink:0}
.theme-toggle:hover{background:var(--surface-2)}
/* ── MOBILE POLISH — iOS/Android ── */
@supports(padding:env(safe-area-inset-left)){
  .sidebar{padding-left:env(safe-area-inset-left)}
  .topbar{padding-left:calc(14px + env(safe-area-inset-left));padding-right:calc(14px + env(safe-area-inset-right))}
  .page{padding-bottom:calc(14px + env(safe-area-inset-bottom))}
}
@media(max-width:768px){
  input,select,textarea{font-size:16px!important} /* iOS: αποφυγή auto-zoom στο focus */
  .btn{min-height:40px} .btn-sm{min-height:34px} .btn-xs{min-height:30px} /* touch targets */
  .modal{max-width:100%;border-radius:16px 16px 0 0;max-height:94vh;align-self:flex-end}
  .modal-overlay{align-items:flex-end;padding:0}
}
button,.nav-item,.btn{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
/* Mobile search: πλήρες πλάτος dropdown, επαρκές input, απόκρυψη ημερομηνίας */
.search-dropdown-box{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:300}
@media(max-width:768px){
  #global-search-wrap{min-width:110px;margin:0 8px;position:static}
  .search-dropdown-box{position:fixed!important;top:60px;left:8px;right:8px;max-height:65vh;overflow-y:auto;border-radius:12px;box-shadow:var(--shadow-lg);z-index:300}
  .topbar-date{display:none}
}
body{font-family:var(--font);background:var(--surface);color:var(--text);-webkit-font-smoothing:antialiased}
h1,h2,h3,.page-title,.topbar-title,.logo-text,.modal-title{font-family:var(--font-head)}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}
input,select,textarea{font-family:var(--font);font-size:13px;color:var(--text);background:var(--white);border:1px solid var(--border);border-radius:8px;padding:8px 11px;outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(43,59,240,0.08)}
input::placeholder,textarea::placeholder{color:var(--text-3)}
button{font-family:var(--font);cursor:pointer;border:none;transition:.15s}
a{color:inherit;text-decoration:none}

/* LAYOUT */
#app{display:flex;min-height:100vh}
.sidebar{width:220px;background:var(--navy);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;transition:transform .2s}
.sidebar.collapsed{width:60px}
.sidebar-logo{padding:16px;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:space-between;min-height:60px}
.logo-circles{display:flex;align-items:center}
.logo-circles span:first-child{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,0.35);display:block}
.logo-circles span:last-child{width:14px;height:14px;border-radius:50%;background:var(--blue);margin-left:-5px;display:block}
.logo-text{color:#fff;font-size:15px;font-weight:600;margin-left:8px;letter-spacing:-.3px}
.logo-sub{color:rgba(255,255,255,0.3);font-size:9px;letter-spacing:.5px;display:block}
.collapse-btn{background:none;color:rgba(255,255,255,0.4);padding:4px;border-radius:4px;font-size:16px;line-height:1}
.collapse-btn:hover{color:rgba(255,255,255,0.7)}

.clinic-picker{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,0.08)}
.clinic-picker-btn{width:100%;display:flex;align-items:center;justify-content:space-between;background:rgba(43,59,240,0.25);border:1px solid rgba(255,255,255,0.15);border-radius:8px;padding:7px 10px;cursor:pointer;color:#fff;font-size:11px;font-family:var(--font)}
.clinic-dropdown{position:absolute;top:100%;left:12px;right:12px;background:var(--white);border-radius:8px;border:1px solid var(--border);z-index:200;box-shadow:var(--shadow-lg);max-height:200px;overflow-y:auto}
.clinic-option{padding:10px 12px;font-size:12px;cursor:pointer;color:var(--text)}
.clinic-option:hover{background:var(--surface)}
.clinic-option.selected{background:var(--blue-soft);color:var(--blue);font-weight:500}

.sidebar-nav{flex:1;padding:8px 0;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 16px;font-size:13px;color:rgba(255,255,255,0.55);cursor:pointer;border-left:3px solid transparent;min-height:44px;transition:all .12s;user-select:none}
.nav-item:hover{color:rgba(255,255,255,0.85);background:rgba(255,255,255,0.05)}
.nav-item.active{color:#fff;background:rgba(43,59,240,0.3);border-left-color:var(--blue);font-weight:500}
.nav-icon{font-size:15px;flex-shrink:0;width:16px;text-align:center}
.nav-label{}
.sidebar.collapsed .nav-label{display:none}
.sidebar.collapsed .nav-item{justify-content:center;padding:10px 0}
.sidebar.collapsed .clinic-picker{display:none}
.sidebar.collapsed .logo-text,.sidebar.collapsed .logo-sub{display:none}

.sidebar-footer{padding:12px 16px;border-top:1px solid rgba(255,255,255,0.08)}
.sidebar.collapsed .sidebar-footer{padding:12px 0;display:flex;justify-content:center}
.user-info{display:flex;align-items:center;gap:8px}
.user-avatar{width:30px;height:30px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff;flex-shrink:0}
.user-name{color:rgba(255,255,255,0.85);font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-role{color:rgba(255,255,255,0.35);font-size:9px;text-transform:uppercase;letter-spacing:.5px}
.logout-btn{background:none;color:rgba(255,255,255,0.3);font-size:16px;padding:4px;margin-left:auto}
.logout-btn:hover{color:rgba(255,255,255,0.7)}

.main{margin-left:220px;flex:1;display:flex;flex-direction:column;min-height:100vh;transition:margin-left .2s}
.main.expanded{margin-left:60px}
.topbar{height:56px;background:var(--white);border-bottom:1px solid var(--border-2);display:flex;align-items:center;padding:0 24px;gap:12px;position:sticky;top:0;z-index:50}
.topbar-title{font-size:15px;font-weight:500;flex:1}
.hamburger{display:none;flex-direction:column;gap:4px;padding:8px;background:none;border-radius:6px}
.hamburger span{width:18px;height:2px;background:var(--navy);border-radius:99px;display:block}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:99}

.page{padding:24px;animation:pageIn .2s ease}
@keyframes pageIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.page-header{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px;position:sticky;top:56px;z-index:45;background:var(--surface);margin-left:-24px;margin-right:-24px;margin-top:-24px;padding:16px 24px 12px}
@media (max-width:768px){.page-header{margin-left:-14px;margin-right:-14px;margin-top:-14px;padding:12px 14px 10px}}
thead th{position:sticky;top:0;background:var(--surface);z-index:5}
.table-wrap{overflow:auto;max-height:calc(100dvh - 150px);overscroll-behavior:contain}
.page-title{font-size:20px;font-weight:600;color:var(--navy);letter-spacing:-.4px}
.page-sub{font-size:12px;color:var(--text-2);margin-top:3px}

/* CARD */
.card{background:var(--white);border-radius:12px;border:1px solid var(--border-2);box-shadow:var(--shadow-sm);overflow:hidden}
.card-header{padding:14px 18px;border-bottom:1px solid var(--border-2);display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:13px;font-weight:600}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat-card{background:var(--white);border-radius:12px;border:1px solid var(--border-2);padding:18px;box-shadow:var(--shadow-sm);transition:.15s}
.stat-card:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.stat-label{font-size:11px;font-weight:500;color:var(--text-2);text-transform:uppercase;letter-spacing:.7px;margin-bottom:8px}
.stat-value{font-size:28px;font-weight:600;letter-spacing:-1px;line-height:1;margin-bottom:6px}
.stat-change{font-size:11px;color:var(--text-3)}
.stat-change.up{color:var(--green)}
.stat-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;margin-bottom:10px}

/* TABLE */
.table-wrap{overflow:auto;max-height:calc(100dvh - 150px);overscroll-behavior:contain}
table{width:100%;border-collapse:collapse}
thead tr{background:var(--surface)}
th{padding:9px 14px;text-align:left;font-size:10.5px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:.6px;white-space:nowrap}
td{padding:12px 14px;font-size:13px;border-top:1px solid var(--border-2)}
tr:hover td{background:var(--surface)}
tr{cursor:pointer}

/* BADGE */
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:500;padding:2px 8px;border-radius:99px;white-space:nowrap}
.badge-green{background:var(--green-soft);color:var(--green-dark)}
.badge-red{background:var(--red-soft);color:var(--red-dark)}
.badge-amber{background:var(--amber-soft);color:var(--amber-dark)}
.badge-navy{background:var(--surface-2);color:var(--navy)}
.badge-gray{background:var(--surface-2);color:var(--text-2)}
.app-build-info{position:fixed;bottom:6px;right:10px;font-size:10px;color:var(--text-3);font-family:monospace;pointer-events:none;z-index:5;opacity:.7}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:500;line-height:1;white-space:nowrap;transition:.15s}
.btn-primary{background:var(--blue);color:#fff}
.btn-neon{background:var(--neon);color:var(--neon-text);font-weight:600}
.btn-neon:hover{opacity:.88}
.btn-primary:hover{background:#1e2cb8;box-shadow:0 4px 12px rgba(43,59,240,0.3)}
.btn-ghost{background:transparent;color:var(--text-2);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--surface);color:var(--text)}
.btn-sm{padding:5px 11px;font-size:12px}
.btn-xs{padding:3px 8px;font-size:11px;border-radius:6px}
.btn-danger{background:var(--red-soft);color:var(--red-dark)}

/* SEARCH */
.search-box{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 12px}
.search-box input{border:none;background:transparent;font-size:12px;outline:none;width:100%;color:var(--text)}

/* FILTER TABS */
.filter-tabs{display:flex;gap:6px;flex-wrap:wrap}
.filter-tab{font-size:11px;padding:4px 10px;border-radius:6px;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text-2);font-family:var(--font)}
.filter-tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(10,12,24,0.5);backdrop-filter:blur(3px);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .15s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--white);border-radius:16px;box-shadow:var(--shadow-lg);width:100%;max-width:460px;animation:slideUp .2s cubic-bezier(.34,1.56,.64,1);max-height:90vh;overflow-y:auto}
@keyframes slideUp{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal-header{padding:20px 22px 0;display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:15px;font-weight:600}
.modal-close{width:26px;height:26px;border-radius:50%;background:var(--surface-2);color:var(--text-2);display:flex;align-items:center;justify-content:center;font-size:16px}
.modal-close:hover{background:var(--surface)}
.modal-body{padding:18px 22px}
.modal-footer{padding:0 22px 20px;display:flex;gap:10px;justify-content:flex-end}
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:12px;font-weight:500;color:var(--text-2);margin-bottom:5px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-control{width:100%}

/* APPT CARD */
.appt-card{background:var(--white);border-radius:10px;border:1px solid var(--border-2);padding:14px 16px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow-sm);transition:.15s}
.appt-card:hover{box-shadow:var(--shadow);transform:translateY(-1px)}

/* LOGIN */
.login-screen{min-height:100vh;display:flex;background:linear-gradient(135deg,#0d1129 0%,#1a1f3a 50%,#0f1628 100%);overflow:hidden;position:relative}
.login-blob{position:absolute;border-radius:50%;filter:blur(60px);pointer-events:none}
.login-wrap{margin:auto;width:100%;max-width:400px;padding:20px;position:relative;z-index:1}
.login-card{background:rgba(255,255,255,0.05);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:38px 34px}
.login-input{background:rgba(255,255,255,0.07)!important;border:1px solid rgba(255,255,255,0.12)!important;color:#fff!important;margin-bottom:14px}
.login-input::placeholder{color:rgba(255,255,255,0.3)!important}
.login-label{display:block;font-size:12px;font-weight:500;color:rgba(255,255,255,0.5);margin-bottom:5px}

/* EMPTY */
.empty-state{text-align:center;padding:48px 20px;color:var(--text-2)}
.empty-icon{font-size:32px;margin-bottom:10px;opacity:.35}

.mobile-pt-indicators{display:none}

/* PIPELINE */
.pipeline-col{background:var(--surface);border-radius:10px;padding:12px;min-width:220px;flex:1}
.pipeline-card{background:var(--white);border-radius:8px;border:1px solid var(--border-2);padding:12px;margin-bottom:8px;box-shadow:var(--shadow-sm);cursor:pointer}
.pipeline-card:hover{box-shadow:var(--shadow);transform:translateY(-1px)}

/* RESPONSIVE */
@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.mobile-open{transform:translateX(0);box-shadow:var(--shadow-lg)}
  .main,.main.expanded{margin-left:0}
  .hamburger{display:flex}
  .overlay.open{display:block}
  .page{padding:14px}
  .stats-grid{grid-template-columns:1fr 1fr;gap:10px}
  .stat-value{font-size:22px}
  .hide-mobile{display:none}
  .mobile-pt-indicators{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
  .form-row{grid-template-columns:1fr}
  .dash-grid{grid-template-columns:1fr!important}
  th,td{padding:9px 10px}
}
@media(max-width:1100px){.stats-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="app"></div>
<div class="app-build-info" id="app-build-info"></div>
<script>
// ── BUILD INFO ──
const APP_VERSION = '1.0.0';
const BUILD_TIME = '2026-07-16 20:00';
document.getElementById('app-build-info').textContent = `v${APP_VERSION} · ${BUILD_TIME}`;

// ── ΑΠΛΟΠΟΙΗΜΕΝΕΣ ΟΜΑΔΕΣ ΣΥΝΑΙΝΕΣΗΣ (όλα εκτός Laser, που κρατά τη δική του λεπτομερή φόρμα) ──
const CONSENT_GROUPS = ['Καθαρισμός Προσώπου','Θεραπεία Προσώπου','Μεσοθεραπεία','Peeling','Ηλεκτρόλυση'];
const CF_SKIN_TYPE_OPTIONS = ['Ακμή','Anti-aging','Ευαισθησία','Υπερλιπαρότητα','Ξηρότητα/Αφυδάτωση','Πανάδες/Ρυτίδες'];
const CONSENT_AFTERCARE = 'Μετά τη θεραπεία αποφεύγω για μερικές ώρες την έντονη σωματική άσκηση, το χαμάμ και τη σάουνα, την άμεση έκθεση στον ήλιο, την έντονη τριβή και το πολύ ζεστό νερό στην περιοχή. Η χρήση αντηλιακού με πολύ υψηλό δείκτη προστασίας είναι απαραίτητη, και η έκθεση στον ήλιο γίνεται σύμφωνα με την καθοδήγηση του θεραπευτή. Σε περίπτωση οποιασδήποτε μη αναμενόμενης αντίδρασης, οφείλω να επικοινωνήσω άμεσα με τον θεραπευτή.';

// Ταξινόμηση υπηρεσίας → απαιτούμενη κατηγορία συναίνεσης (global — χρησιμοποιείται
// και στο Πρόγραμμα για τα warnings, και στην καρτέλα ασθενή για να δείχνει
// μόνο τις σχετικές συναινέσεις, όχι όλες)
function classifyConsentGroup(serviceName) {
  const s = (serviceName||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  if (/alexandrite|laser/.test(s)) return 'laser';
  if (/καθαρισμ|δερμοαποξ|pore ?over|eco ?peel/.test(s)) return 'cleansing';
  if (/peeling|peel|prx|dermapen|μικροβελον|microneedl|tca/.test(s)) return 'peelings';
  if (/οξυγον|ενυδατ|dermalux|λαμψ|λευκανσ|αντιγηρανσ|glow/.test(s)) return 'oxygen';
  return null;
}

// Η ομάδα συναίνεσης είναι σχετική με τον ασθενή μόνο αν έχει κλεισμένο (μη ακυρωμένο)

// να δείχνουμε προειδοποίηση για συναίνεση υπηρεσίας που ποτέ δεν έκανε/έκλεισε.
function patientNeedsServiceConsent(patient, groupKey) {

// ── SCORE ΠΕΛΑΤΗ ── Σύνθετο σκορ 0-100 από 3 άξονες (Αξία/LTV, Πρόσφατη Επίσκεψη, Αξιοπιστία/no-shows).
// Σταθερά όρια βαθμονομημένα σε τιμές μιας μικρής κλινικής αισθητικής (LTV σε δεκάδες/εκατοντάδες
// ευρώ, όχι χιλιάδες) — όχι percentile βάσει όλων των πελατών, ώστε να δουλεύει και με 1 μόνο ασθενή.
function computePatientScore(p) {
  const appts = (p&&p.appointments)||[];
  const now = new Date();
  const pastAppts = appts.filter(a=>a.start_time && new Date(a.start_time)<=now);
  const noShows = pastAppts.filter(a=>a.status==='no_show').length;
  const noShowRate = pastAppts.length ? noShows/pastAppts.length : 0;
  const lastVisit = pastAppts.filter(a=>a.status!=='cancelled' && a.status!=='no_show')
    .sort((a,b)=>new Date(b.start_time)-new Date(a.start_time))[0];
  const daysSince = lastVisit ? Math.floor((now-new Date(lastVisit.start_time))/86400000) : null;

  const ltv = (p&&p.ltv)||0;
  const valueScore = ltv>=1000?100:ltv>=500?75:ltv>=200?50:ltv>0?25:0;
  const recencyScore = daysSince===null?0:daysSince<=30?100:daysSince<=60?75:daysSince<=90?50:daysSince<=180?25:0;
  const reliabilityScore = pastAppts.length===0?50:noShowRate===0?100:noShowRate<=0.1?80:noShowRate<=0.25?50:noShowRate<=0.5?25:0;

  const overall = Math.round(valueScore*0.4 + recencyScore*0.35 + reliabilityScore*0.25);
  return {overall, valueScore, recencyScore, reliabilityScore, daysSince, noShowRatePct: Math.round(noShowRate*100)};
}
function scoreRingSvg(value, size, color) {
  const r = (size-8)/2, c = size/2, circ = 2*Math.PI*r;
  const offset = circ * (1 - Math.max(0,Math.min(100,value))/100);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg);flex-shrink:0">
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--border-2)" stroke-width="6"/>
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${color}" stroke-width="6" stroke-linecap="round"
      stroke-dasharray="${circ}" stroke-dashoffset="${offset}"/>
  </svg>`;
}

function normalizeGreek(s) {
  return (s||'').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'') // αφαίρεση τόνων
    .replace(/[^\wα-ωΑ-Ω0-9\s]/g,' ')
    .replace(/\s+/g,' ').trim();
}
function findServiceMatch(appointments, afterDateStr, treatmentText) {
  const afterDate = new Date(afterDateStr);
  const normTreatment = normalizeGreek(treatmentText);
  const treatWords = normTreatment.split(' ').filter(w=>w.length>=4);
  if (!treatWords.length) return null;
  const candidates = (appointments||[]).filter(a => a.start_time && new Date(a.start_time) > afterDate);
  candidates.sort((a,b)=>new Date(a.start_time)-new Date(b.start_time)); // πιο κοντινό στο μέλλον πρώτα
  for (const a of candidates) {
    const normService = normalizeGreek(a.service_name||'');
    if (!normService) continue;
    if (normService.includes(normTreatment) || normTreatment.includes(normService)) return a;
    const overlap = treatWords.filter(w => normService.includes(w));
    if (overlap.length >= Math.min(2, treatWords.length)) return a;
  }
  return null;
}
// Εξάγει τα βήματα (μία γραμμή = ένα βήμα) του IN-CLINIC μέρους ενός consultation
// consent_text — ίδια κοκκομετρία/regex με το progress badge της καρτέλας ασθενή
// (tab Consultation), ώστε ο αριθμός "X/Y έγιναν" να είναι ίδιος παντού στο CRM.
function parseConsultInClinicSteps(text) {
  const m = (text||'').match(/IN-CLINIC\s*:?\s*\n?([\s\S]+?)(?:\n\s*(?:HOMECARE|EXPECTED|Σημειώσεις)|$)/i);
  if (!m) return [];
  return m[1].split('\n').map(l=>l.trim()).filter(Boolean).map(l => {
    const nm = l.match(/^\d\)\s*(.*)$/);
    if (nm) { const c = nm[1].trim(); return c.includes(':') ? c.split(':').slice(1).join(':').trim() : c; }
    return l.replace(/^[•\-]\s*/,'');
  }).filter(t => t.length >= 4);
}

// supabase-js's FunctionsHttpError.message is ALWAYS the generic "Edge Function
// returned a non-2xx status code", regardless of what the function actually
// responded with — the real reason lives in error.context (the raw Response),
// unread by default. Without this, every Edge Function failure in the app
// shows the same useless message and the real cause can never be diagnosed
// from the UI alone (this is exactly what happened with send-consultation-email).
async function extractInvokeErrorMessage(error) {
  if (!error) return '';
  if (error.context && typeof error.context.clone === 'function') {
    try {
      const body = await error.context.clone().json();
      if (body && body.error) return body.error;
    } catch(e) {}
    try {
      const text = await error.context.clone().text();
      if (text) return text;
    } catch(e) {}
  }
  return error.message || 'Άγνωστο σφάλμα';
}

  if (S.page==='dashboard') {
    // Τελευταία επίσκεψη για VIP + ενεργούς πελάτες — ειδικό, ακριβές query (όχι από το
    // περικομμένο S.appointments των 200 πιο πρόσφατων, που κρύβει παλαιότερες επισκέψεις).
    const vipIds = (S.patients||[]).filter(p=>p.status==='vip').map(p=>p.id);
    const activeIds = (S.patients||[]).filter(p=>p.status==='active').map(p=>p.id);
    S.vipLastVisit = {};
    S.activeLastVisit = {};
    const fetchLastVisits = async (ids, target) => {
      if (!ids.length) return;
      const {data:visitApts} = await sb.from('appointments').select('patient_id,start_time')
        .in('patient_id', ids).neq('status','cancelled')
        .lte('start_time', new Date().toISOString())
        .order('start_time',{ascending:false});
      (visitApts||[]).forEach(a => { if (!target[a.patient_id]) target[a.patient_id] = a.start_time; });
    };
    await fetchLastVisits(vipIds, S.vipLastVisit);
    await fetchLastVisits(activeIds, S.activeLastVisit);

    // Ημερήσιο breakdown κατάστασης (Ολοκληρώθηκαν/Ακυρώθηκαν/No-show/Λοιπά) τελευταίων
    // 14 ημερών — ΞΕΧΩΡΙΣΤΟ, date-range-scoped query, όχι από το S.appointments (εκείνο
    // είναι "τελευταία 200 by start_time" και σε πολυάσχολη κλινική με ήδη κλεισμένα
    // μελλοντικά ραντεβού θα έκρυβε ιστορικές μέρες).
    const trendFrom = new Date(); trendFrom.setDate(trendFrom.getDate()-13); trendFrom.setHours(0,0,0,0);
    const trendTo = new Date(); trendTo.setHours(23,59,59,999);
    const {data: trendApts} = await sb.from('appointments').select('start_time,status').eq('clinic_id',cid)
      .gte('start_time', trendFrom.toISOString()).lte('start_time', trendTo.toISOString());
    S.dashStatusTrend = trendApts||[];
  }
  if (S.page==='patients') {
    // Χάρτης patient_id → πιο πρόσφατη ημερομηνία consultation
    const {data:consults} = await sb.from('gdpr_consents').select('patient_id,signed_at').eq('clinic_id',cid).order('signed_at',{ascending:false}).limit(3000);
    const map = {};
    (consults||[]).forEach(c => { if (!map[c.patient_id]) map[c.patient_id] = c.signed_at; }); // πρώτη εμφάνιση = πιο πρόσφατη (ήδη ordered desc)
    S.consultDates = map;
  }
  if (S.page==='appointments' || S.page==='dashboard') {
    const {data} = await sb.from('appointments').select('*, patients(full_name,phone,status,gdpr_signed,medical_history,allergies)').eq('clinic_id',cid).order('start_time',{ascending:false}).limit(200);
    S.appointments = data||[];
  }
  if (S.page==='calendar') {
    // Φόρτωση ραντεβού σε παράθυρο ±60 ημερών γύρω από την ημερομηνία του ημερολογίου.
    // (Το παλιό limit(3000) ascending έφερνε τα 3000 ΠΑΛΑΙΟΤΕΡΑ ραντεβού — όταν ο πίνακας
    // ξεπέρασε τα 3000, οι πρόσφατες μέρες κόβονταν και το Πρόγραμμα εμφανιζόταν άδειο.)
    const calBase = S.calDate ? new Date(S.calDate) : new Date();
    const calFrom = new Date(calBase); calFrom.setDate(calFrom.getDate()-60); calFrom.setHours(0,0,0,0);
    const calTo = new Date(calBase); calTo.setDate(calTo.getDate()+60); calTo.setHours(23,59,59,999);
    const {data, error} = await sb.from('appointments').select('*, patients(full_name,phone,status,gdpr_signed,medical_history,allergies)').eq('clinic_id',cid)
      .gte('start_time', calFrom.toISOString()).lte('start_time', calTo.toISOString())
      .order('start_time',{ascending:true}).limit(3000);
    if (error) console.error('Πρόγραμμα — σφάλμα φόρτωσης ραντεβού:', error);
    S.appointments = data||[];
    S.calRangeFrom = calFrom.getTime(); S.calRangeTo = calTo.getTime();
    // Ασθενείς με υπογεγραμμένη συναίνεση — για warnings σε ραντεβού που τις απαιτούν
    const {data:lcIds} = await sb.from('laser_consents').select('patient_id').eq('clinic_id',cid);
    S.laserConsentIds = new Set((lcIds||[]).map(r=>r.patient_id));
    const {data:scIds} = await sb.from('service_consents').select('patient_id,consent_group').eq('clinic_id',cid);
    S.cleansingConsentIds = new Set((scIds||[]).filter(r=>r.consent_group==='cleansing_poreover').map(r=>r.patient_id));
    S.peelingsConsentIds = new Set((scIds||[]).filter(r=>r.consent_group==='peelings_microneedling').map(r=>r.patient_id));
    S.oxygenConsentIds = new Set((scIds||[]).filter(r=>r.consent_group==='oxygen_facetreatments').map(r=>r.patient_id));
  }
  if (S.page==='calendar') {
    const {data:staff} = await sb.from('profiles').select('*').eq('clinic_id',cid).in('role',['therapist','clinic_admin','super_admin']);
    S.staff = staff||[];
  }
  if (S.page==='dashboard' || S.page==='appointments') {
    // Ίδιο set συναινέσεων, χρειάζεται και το Dashboard (KPI) και το Ραντεβού (badges ανά ραντεβού)
    const {data:lcIds2} = await sb.from('laser_consents').select('patient_id').eq('clinic_id',cid);
    S.laserConsentIds = new Set((lcIds2||[]).map(r=>r.patient_id));
    const {data:scIds2} = await sb.from('service_consents').select('patient_id,consent_group').eq('clinic_id',cid);
    S.cleansingConsentIds = new Set((scIds2||[]).filter(r=>r.consent_group==='cleansing_poreover').map(r=>r.patient_id));
    S.peelingsConsentIds = new Set((scIds2||[]).filter(r=>r.consent_group==='peelings_microneedling').map(r=>r.patient_id));
    S.oxygenConsentIds = new Set((scIds2||[]).filter(r=>r.consent_group==='oxygen_facetreatments').map(r=>r.patient_id));
  }
  if (S.page==='appointments') {
    // Χάρτης κανονικοποιημένο τηλέφωνο → σύνολο patient_id — ώστε μια ένδειξη "Χωρίς Συναίνεση"
    // να μπορεί να ξεχωρίσει αν πρόκειται για διπλότυπη καρτέλα που ΗΔΗ έχει τη συναίνεση
    // (βλ. apptMissingConsent), αντί να μοιάζει με πραγματικά ανυπόγραφο πελάτη.
    const phoneGroups = new Map();
    let from = 0; const pageSize = 1000;
    while (true) {
      const {data, error} = await sb.from('patients').select('id,phone').eq('clinic_id',cid).range(from, from+pageSize-1);
      if (error) break;
      (data||[]).forEach(p => {
        const n = normalizePhone(p.phone);
        if (!n) return;
        if (!phoneGroups.has(n)) phoneGroups.set(n, new Set());
        phoneGroups.get(n).add(p.id);
      });
      if (!data || data.length < pageSize) break;
      from += pageSize;
    }
    S.patientPhoneGroups = phoneGroups;
  }
  if (S.page==='pipeline' || S.page==='dashboard') {
    const {data} = await sb.from('pipeline_deals').select('*').eq('clinic_id',cid).order('created_at',{ascending:false});
    S.pipeline = data||[];
  }
  if (S.page==='laser') {
    const {data} = await sb.from('laser_forms').select('*, patients(full_name,phone)').eq('clinic_id',cid).order('created_at',{ascending:false});
    S.laserForms = data||[];
  }
  if (S.page==='laser-detail') {
    if (S.laserFormId) {
      const {data} = await sb.from('laser_forms').select('*, patients(full_name,phone,gender,email)').eq('id',S.laserFormId).single();
      S.laserFormDetail = data||null;
      // Συναίνεση Laser του ασθενή (μία φορά, ισχύει για πάντα)
      S.laserPatientConsent = null;
      if (data && data.patient_id) {
        const {data:lc} = await sb.from('laser_consents').select('*').eq('patient_id', data.patient_id).order('signed_at',{ascending:false}).limit(1);
        S.laserPatientConsent = (lc&&lc[0])||null;
      }
    }
  }
  if (S.page==='sms') {
    const {data:clinicData} = await sb.from('clinics').select('sms_settings').eq('id',cid).single();
    S.smsSettings = (clinicData&&clinicData.sms_settings) || null;
    const {data:log} = await sb.from('sms_log').select('*, patients(full_name)').eq('clinic_id',cid).order('sent_at',{ascending:false}).limit(50);
    S.smsLog = log||[];
  }
  if (S.page==='consultations') {
    const {data} = await sb.from('gdpr_consents').select('*, patients(full_name,phone,status,gdpr_signed)').eq('clinic_id',cid).order('signed_at',{ascending:false}).limit(200);
    S.allConsultations = data||[];
  }
  if (S.page==='consents') {
    const {data:gdprPts} = await sb.from('patients').select('id,full_name,phone,gdpr_signed,created_at').eq('clinic_id',cid).eq('gdpr_signed',true).order('created_at',{ascending:false});
    S.gdprConsents = (gdprPts||[]).map(p=>({patients:{id:p.id,full_name:p.full_name,phone:p.phone},signed:true,signed_at:p.created_at}));
    S.serviceConsents = [];
    const {data:tmpl} = await sb.from('service_consent_templates').select('*').eq('clinic_id',cid).order('created_at',{ascending:false});
    S.consentTemplates = tmpl||[];
    const {data:svcRows} = await sb.from('appointments').select('service_name').eq('clinic_id',cid).not('service_name','is',null);
    S.allServiceNames = [...new Set((svcRows||[]).map(r=>(r.service_name||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'el'));
    S.serviceConsentMap = (S.clinic&&S.clinic.settings&&S.clinic.settings.service_consent_groups)||{};
    S._consultServicesDraft = [...((S.clinic&&S.clinic.settings&&S.clinic.settings.consultation_services)||[])];
    S._consultProductsDraft = JSON.parse(JSON.stringify((S.clinic&&S.clinic.settings&&S.clinic.settings.consultation_products)||{cleaning:[],care:[],protection:[],body:[]}));
  }
  if (S.page==='reports') {
    if (!S.reportRange) {
      const now = new Date();
      const firstOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
      S.reportRange = { from: firstOfMonth.toISOString().slice(0,10), to: now.toISOString().slice(0,10) };
    }
    const fromISO = S.reportRange.from+'T00:00:00';
    const toISO = S.reportRange.to+'T23:59:59';
    const {data:apts} = await sb.from('appointments').select('*, patients(full_name,phone)').eq('clinic_id',cid).gte('start_time',fromISO).lte('start_time',toISO).order('start_time',{ascending:false});
    S.reportAppointments = apts||[];
    const {data:newPts} = await sb.from('patients').select('id,created_at').eq('clinic_id',cid).gte('created_at',fromISO).lte('created_at',toISO);
    S.reportNewPatients = newPts||[];
    const {data:allPts} = await sb.from('patients').select('id,status,gdpr_signed').eq('clinic_id',cid);
    S.reportAllPatients = allPts||[];

    // Ισόχρονη προηγούμενη περίοδος (ίδιος αριθμός ημερών, αμέσως πριν) — για τα
    // deltas Νέων Πελατών & Consultations, ίδια λογική με το widget "Από πού μας βρήκαν".
    const fromDate = new Date(fromISO), toDate = new Date(toISO);
    const rangeDays = Math.max(1, Math.round((toDate-fromDate)/86400000)+1);
    const prevTo = new Date(fromDate); prevTo.setDate(prevTo.getDate()-1); prevTo.setHours(23,59,59,999);
    const prevFrom = new Date(prevTo); prevFrom.setDate(prevFrom.getDate()-(rangeDays-1)); prevFrom.setHours(0,0,0,0);
    const {data:prevNewPts} = await sb.from('patients').select('id').eq('clinic_id',cid).gte('created_at',prevFrom.toISOString()).lte('created_at',prevTo.toISOString());
    S.reportPrevNewPatients = prevNewPts||[];

    // Consultations — φέτος και ισόχρονη προηγούμενη περίοδος. Φέρνουμε ΟΛΕΣ τις συναινέσεις της
    // περιόδου (όχι μόνο όσες έχουν το literal "Skincare Plan |" πρόθεμα) και τις ταξινομούμε με το
    // ίδιο classifyConsultationType() που χρησιμοποιεί η σελίδα Consultation — έτσι ένα consultation
    // από παλαιότερο/εξωτερικό pipeline (χωρίς αυτό το πρόθεμα, αλλά με πραγματικό IN-CLINIC κ.λπ.)
    // μετράει το ίδιο παντού, αντί να λείπει μόνο από την Αναφορά.
    const {data:consentsInRange} = await sb.from('gdpr_consents').select('id,patient_id,signed_at,consent_text,patients(full_name,phone)').eq('clinic_id',cid).gte('signed_at',fromISO).lte('signed_at',toISO);
    const consults = (consentsInRange||[]).filter(c=>classifyConsultationType(c.consent_text)==='consultation');
    S.reportConsultations = consults;
    const {data:prevConsentsInRange} = await sb.from('gdpr_consents').select('id,consent_text').eq('clinic_id',cid).gte('signed_at',prevFrom.toISOString()).lte('signed_at',prevTo.toISOString());
    S.reportPrevConsultations = (prevConsentsInRange||[]).filter(c=>classifyConsultationType(c.consent_text)==='consultation');

    // Ραντεβού των ασθενών που έκαναν consultation (μετά την ημ/νία του), για να δούμε
    // πόσες από τις προτεινόμενες υπηρεσίες (IN-CLINIC) πραγματοποιήθηκαν τελικά.
    const consultPatientIds = [...new Set((consults||[]).map(c=>c.patient_id).filter(Boolean))];
    if (consultPatientIds.length) {
      const {data:consultApts} = await sb.from('appointments').select('patient_id,service_name,status,start_time').eq('clinic_id',cid).in('patient_id',consultPatientIds).neq('status','cancelled');
      S.reportConsultAppointments = consultApts||[];
    } else {
      S.reportConsultAppointments = [];
    }

    // Αριθμός ενεργού προσωπικού (θεραπεύτριες/admins) — χρησιμοποιείται ως πολλαπλασιαστής
    // χωρητικότητας στο % Κάλυψης Ωραρίου (πολλαπλά ραντεβού μπορούν να τρέχουν ταυτόχρονα).
    const {data:staffRows} = await sb.from('profiles').select('id').eq('clinic_id',cid).in('role',['therapist','clinic_admin','super_admin']);
    S.reportStaffCount = (staffRows||[]).length || 1;
  }
  if (S.page==='settings') {
    const {data:uc} = await sb.from('unmatched_consultations').select('*').eq('clinic_id',cid).order('received_at',{ascending:false});
    S.unmatchedConsultations = uc||[];
  }
  // Επιτρέπει ξανά το auto-scroll στην τρέχουσα ώρα ΜΕΤΑ τη φόρτωση δεδομένων —
  // αν γινόταν νωρίτερα (πριν τα awaits), «κατανάλωνε» το flag σε ένα πρόωρο render με
  // παλιά δεδομένα, και το τελικό render (με το πραγματικό DOM) δεν ξανασκρόλαρε ποτέ.
  if (S.page==='calendar') S._calScrollKey = null;
  render();
}

async function loadPatientDetail(id, tab) {
  S.patientDetail = null;
  S.patientLoadError = null;
  set({page:'patient-detail'}); // Show loading state immediately
  try {
    const {data:p, error:pErr} = await sb.from('patients').select('*').eq('id',id).single();
    if (pErr) throw new Error('Ασθενής: '+pErr.message);
    const {data:a} = await sb.from('appointments').select('*').eq('patient_id',id).order('start_time',{ascending:true}).limit(500);
    const {data:lf} = await sb.from('laser_forms').select('*').eq('patient_id',id).order('created_at',{ascending:false});
    // Συναίνεση Laser (γενική, ανεξάρτητη από συγκεκριμένη φόρμα) — για tab Συναινέσεις
    const {data:lc} = await sb.from('laser_consents').select('*').eq('patient_id',id).order('signed_at',{ascending:false}).limit(1);
    S.laserPatientConsent = (lc&&lc[0])||null;
    // Συναινέσεις Υπηρεσιών (3 ξεχωριστές ομάδες) — μία φορά ανά ομάδα, ισχύει για πάντα
    const {data:svcCon1} = await sb.from('service_consents').select('*').eq('patient_id',id)
      .eq('consent_group','cleansing_poreover').order('signed_at',{ascending:false}).limit(1);
    S.serviceConsentCleansing = (svcCon1&&svcCon1[0])||null;
    const {data:svcCon2} = await sb.from('service_consents').select('*').eq('patient_id',id)
      .eq('consent_group','peelings_microneedling').order('signed_at',{ascending:false}).limit(1);
    S.serviceConsentPeelings = (svcCon2&&svcCon2[0])||null;
    const {data:svcCon3} = await sb.from('service_consents').select('*').eq('patient_id',id)
      .eq('consent_group','oxygen_facetreatments').order('signed_at',{ascending:false}).limit(1);
    S.serviceConsentOxygen = (svcCon3&&svcCon3[0])||null;
    // Πιο πρόσφατο υπογεγραμμένο στιγμιότυπο GDPR & Ιατρικού Ιστορικού (προαιρετικό —
    // υπάρχει μόνο αν έχει χρησιμοποιηθεί η νέα υπογραφή· παλιοί ασθενείς χωρίς αυτό
    // συνεχίζουν να δουλεύουν κανονικά μέσω των flags patients.gdpr_signed κ.λπ.)
    const {data:mhc} = await sb.from('medical_history_consents').select('*').eq('patient_id',id)
      .order('signed_at',{ascending:false}).limit(1);
    S.historyConsent = (mhc&&mhc[0])||null;
    S.patientDetail = {...p, appointments: a||[]};
    S.laserForms = lf||[];
    S.patTab = tab || 'overview';

    // Φωτογραφίες ασθενή — μεταδεδομένα + signed URLs (private bucket)
    S.patientPhotos = [];
    _selectedPhotoIds.clear();
    const {data:photos} = await sb.from('patient_photos').select('*').eq('patient_id',id).order('taken_at',{ascending:false});
    if (photos && photos.length) {
      const signed = await Promise.all(photos.map(async ph => {
        const {data:su} = await sb.storage.from('patient-photos').createSignedUrl(ph.storage_path, 3600);
        return {...ph, url: su ? su.signedUrl : ''};
      }));
      S.patientPhotos = signed;
    }

    // Load consultations from Supabase by patient_id (αξιόπιστο — ο patient έχει ήδη phone)
    const phone = normalizePhone(p&&p.phone||'');
    let consultData = [];
    const {data:direct} = await sb.from('gdpr_consents').select('*').eq('patient_id',id).order('signed_at',{ascending:false}).limit(50);
    consultData = direct||[];
    // Phone-based fallback: βρες άλλους ασθενείς με ίδιο phone
    if (phone && phone.length >= 9) {
      const cid = clinicId();
      const {data:samePhone} = await sb.from('patients').select('id').eq('clinic_id',cid).ilike('phone','%'+phone+'%').neq('id',id);
      if (samePhone && samePhone.length) {
        for (const sp of samePhone) {
          const {data:extra} = await sb.from('gdpr_consents').select('*').eq('patient_id',sp.id).order('signed_at',{ascending:false}).limit(20);
          if (extra) consultData = [...consultData, ...extra];
        }
        const seen = new Set();
        consultData = consultData.filter(c => { if(seen.has(c.id)) return false; seen.add(c.id); return true; });
      }
    }
    consultData.sort((a,b) => new Date(b.signed_at||0) - new Date(a.signed_at||0));
    S.patConsultations = consultData;
    render();
  } catch(e) {
    console.error('loadPatientDetail error:', e);
    S.patientLoadError = e.message || String(e);
    render();
  }
}

// ── APPOINTMENT COLOR (global — χρησιμοποιείται σε render + click handlers) ──
function globalApptColor(a) {
  const st = a.patients&&a.patients.status;
  if (st==='vip') return {bg:'#EEEDFE',border:'#534AB7',text:'#3C3489'};
  if (st==='lead') return {bg:'#E6F1FB',border:'#2B3BF0',text:'#185FA5'};
  if (a.status==='cancelled') return {bg:'#FCEBEB',border:'#D85A30',text:'#A32D2D'};
  if (a.status==='completed'||a.status==='paid') return {bg:'#E1F5EE',border:'#1D9E75',text:'#0F6E56'};
  if (a.status==='confirmed') return {bg:'#E6F1FB',border:'#2B3BF0',text:'#185FA5'};
  return {bg:'#FAEEDA',border:'#EF9F27',text:'#854F0B'};
}

// ── RENDER ──
function render() {
  // Διατήρηση focus/cursor σε input που είναι ενεργό κατά το re-render
  // (αλλιώς το πεδίο αναζήτησης χάνει το focus σε κάθε πληκτρολόγηση)
  const _act = document.activeElement;
  const _actId = _act && _act.id && (_act.tagName==='INPUT'||_act.tagName==='TEXTAREA') ? _act.id : null;
  const _selStart = _actId ? _act.selectionStart : null;
  const _selEnd = _actId ? _act.selectionEnd : null;

  document.getElementById('app').innerHTML =
    !S.user ? renderLogin() :
    S.page==='patient-detail' ? renderShell(renderPatientDetail()) :
    renderShell(
      S.page==='dashboard' ? renderDashboard() :
      S.page==='patients' ? renderPatients() :
      S.page==='appointments' ? renderAppointments() :
      S.page==='calendar' ? renderCalendar() :
      S.page==='pipeline' ? renderPipeline() :
      S.page==='clinics' ? renderClinics() :
      S.page==='laser' ? renderLaserForms() :
      S.page==='laser-detail' ? renderLaserDetail() :
      S.page==='sms' ? renderSms() :
      S.page==='consents' ? renderConsents() :
      S.page==='consultations' ? renderConsultations() :
      S.page==='reports' ? renderReports() :
      S.page==='settings' ? renderSettings() :
      `<div class="page"><div class="empty-state"><div class="empty-icon">🚧</div><div>Σύντομα διαθέσιμο</div></div></div>`
    );
  if (S.modal) renderModal();
  bindEvents();

  // Επαναφορά focus/cursor στο ίδιο input μετά το re-render
  if (_actId) {
    const el = document.getElementById(_actId);
    if (el) {
      el.focus();
      try { if (_selStart!==null && el.setSelectionRange) el.setSelectionRange(_selStart, _selEnd); } catch(e) {}
    }
  }
}

// ── LOGIN ──
function renderLogin() {
  return `<div class="login-screen">
    <div class="login-blob" style="width:400px;height:400px;background:rgba(43,59,240,0.12);top:-100px;right:-80px"></div>

// ── DASHBOARD ──
function renderDashboard() {
  const pts = S.patients||[], apts = S.appointments||[];
  const today = new Date().toDateString();
  const now = new Date();
  const cid = clinicId();
  if (!cid && isSuperAdmin()) return `<div class="page"><div class="empty-state"><div class="empty-icon">⊞</div><div style="font-size:14px;font-weight:500;margin-bottom:8px">Επίλεξε κλινική</div><div>Χρησιμοποίησε τον επιλογέα στα αριστερά</div></div></div>`;

  const canFin = canSee(['super_admin','clinic_admin']);
  const hour = now.getHours();
  const greet = hour<12?'Καλημέρα':hour<17?'Καλό απόγευμα':'Καλό βράδυ';

  // Stats
  const todayApts = apts.filter(a=>new Date(a.start_time).toDateString()===today);
  const upcomingApts = apts.filter(a=>new Date(a.start_time)>now&&a.status!=='cancelled').sort((a,b)=>new Date(a.start_time)-new Date(b.start_time));
  const thisMonth = apts.filter(a=>{const d=new Date(a.start_time);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();});
  const revenue30 = apts.filter(a=>{const d=new Date(a.start_time);return d<=now&&(now-d)<30*86400000&&(a.status==='paid'||a.status==='completed');}).reduce((s,a)=>s+(a.price||0),0);
  const wonLeads = (S.pipeline||[]).filter(l=>l.stage==='won').length;
  const totalLeads = (S.pipeline||[]).length;
  const conversionRate = totalLeads ? Math.round((wonLeads/totalLeads)*100) : 0;
  const paidCompleted = apts.filter(a=>a.status==='paid'||a.status==='completed');
  const avgTicket = paidCompleted.length ? Math.round(paidCompleted.reduce((s,a)=>s+(a.price||0),0)/paidCompleted.length) : 0;
  const noShowRate = apts.length ? Math.round((apts.filter(a=>a.status==='no_show').length/apts.length)*100) : 0;
  const repeatPatients = pts.filter(p=>apts.filter(a=>a.patient_id===p.id).length>1).length;
  const repeatRate = pts.length ? Math.round((repeatPatients/pts.length)*100) : 0;
  const completedToday = todayApts.filter(a=>a.status==='completed'||a.status==='paid').length;
  const pendingToday = todayApts.filter(a=>a.status==='pending'||a.status==='confirmed').length;
  const noGdpr = pts.filter(p=>!p.gdpr_signed).length;
  const newPts30 = pts.filter(p=>{const d=new Date(p.created_at);return d<=now&&(now-d)<30*86400000;}).length;

  // Νέοι πελάτες ανά εβδομάδα (τελευταίες 8 εβδομάδες, Δευ–Κυρ)
  const weekStart = (d) => { const dt=new Date(d); const day=(dt.getDay()+6)%7; dt.setDate(dt.getDate()-day); dt.setHours(0,0,0,0); return dt; };
  const thisWeekStart = weekStart(now);
  const weeklyNewPatients = [];
  for (let i=7; i>=0; i--) {
    const ws = new Date(thisWeekStart); ws.setDate(ws.getDate()-i*7);
    const we = new Date(ws); we.setDate(we.getDate()+7);
    const cnt = pts.filter(p=>{ const c=new Date(p.created_at); return c>=ws && c<we; }).length;
    weeklyNewPatients.push({label: ws.toLocaleDateString('el-GR',{day:'2-digit',month:'2-digit'}), count: cnt});
  }

  // Κατάσταση ραντεβού ανά ημέρα, τελευταίες 14 ημέρες (από το ξεχωριστό
  // date-range-scoped S.dashStatusTrend, βλ. loadPageData — όχι από το S.appointments,
  // που είναι μόνο τα τελευταία 200 by start_time και σε πολυάσχολη κλινική με ήδη
  // κλεισμένα μελλοντικά ραντεβού θα έκρυβε ιστορικές μέρες).
  const trendDays = [];
  for (let i=13; i>=0; i--) {
    const d = new Date(); d.setDate(d.getDate()-i); d.setHours(0,0,0,0);
    const dEnd = new Date(d); dEnd.setDate(dEnd.getDate()+1);
    const dayApts = (S.dashStatusTrend||[]).filter(a=>{ const t=new Date(a.start_time); return t>=d && t<dEnd; });
    const completed = dayApts.filter(a=>a.status==='completed'||a.status==='paid').length;
    const cancelled = dayApts.filter(a=>a.status==='cancelled').length;
    const noShow = dayApts.filter(a=>a.status==='no_show').length;
    const other = dayApts.length - completed - cancelled - noShow;
    trendDays.push({label: d.toLocaleDateString('el-GR',{day:'2-digit',month:'2-digit'}), completed, cancelled, noShow, other, total: dayApts.length});
  }
  const maxTrendTotal = Math.max(1, ...trendDays.map(d=>d.total));
  const maxWeekly = Math.max(1, ...weeklyNewPatients.map(w=>w.count));

  // Από πού μας βρήκαν — ΜΟΝΟ 4 σταθερές κατηγορίες. Κάθε ελεύθερη απάντηση
  // (τυπογραφικά, συνώνυμα, ελεύθερο κείμενο) ταξινομείται σε μία από αυτές.
  // Το "booking247" εξαιρείται — είναι τεχνικό tag του sync, όχι πραγματική απάντηση.
  const canonicalizeSource = (raw) => {
    if (!raw) return null;
    const s = raw.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
    if (!s || s==='booking247') return null;
    if (/googl|goggl/.test(s)) return 'Google';
    if (/social|facebook|instagram|\bfb\b|\big\b/.test(s)) return 'Social';
    if (/ταμπελ/.test(s)) return 'Ταμπέλα';
    if (/συστασ/.test(s)) return 'Σύσταση';
    return 'Σύσταση'; // ελεύθερο κείμενο (φίλους, οικογένεια, γειτονιά, παλιά πελάτισσα κ.λπ.) → word-of-mouth
  };
  const sourceCountsInRange = (from, to) => {
    const counts = {'Σύσταση':0,'Google':0,'Ταμπέλα':0,'Social':0};
    let noSource = 0;
    pts.forEach(p => {
      const created = new Date(p.created_at);
      if (from && created < from) return;
      if (to && created >= to) return;
      const c = canonicalizeSource(p.source);
      if (c) counts[c]++; else noSource++;
    });
    return {counts, noSource};
  };
  const dashSourcePeriod = S.dashSourcePeriod || 'all';
  let curFrom = null, curTo = null, prevFrom = null, prevTo = null;
  if (dashSourcePeriod === 'week') {
    curFrom = thisWeekStart;
    prevFrom = new Date(thisWeekStart); prevFrom.setDate(prevFrom.getDate()-7);
    prevTo = thisWeekStart;
  } else if (dashSourcePeriod === 'month') {
    curFrom = new Date(now.getFullYear(), now.getMonth(), 1);
    prevTo = curFrom;
    prevFrom = new Date(now.getFullYear(), now.getMonth()-1, 1);
  }
  const curSourceData = sourceCountsInRange(curFrom, curTo);
  const prevSourceData = dashSourcePeriod!=='all' ? sourceCountsInRange(prevFrom, prevTo) : null;
  const sourceCount = curSourceData.counts;
  const topSources = Object.entries(sourceCount).sort((a,b)=>b[1]-a[1]);
  const maxSource = Math.max(1, ...topSources.map(([,c])=>c));
  const noSourceCount = curSourceData.noSource;
  const noLaserConsentPatients = new Set(
    apts.filter(a => new Date(a.start_time)>now && a.status!=='cancelled'
      && /alexandrite|laser/i.test(a.service_name||'')
      && a.patient_id && S.laserConsentIds && !S.laserConsentIds.has(a.patient_id)
    ).map(a=>a.patient_id)
  );

  // ── VIP πελάτες χωρίς επίσκεψη 60+ ημέρες — ειδοποίηση Dashboard ──
  const vipInactive = pts.filter(p=>p.status==='vip').map(p=>{
    const lastVisitStr = (S.vipLastVisit||{})[p.id];
    const lastVisit = lastVisitStr ? new Date(lastVisitStr) : null;
    const idleDays = lastVisit ? Math.floor((now-lastVisit)/86400000) : null;
    return {patient:p, lastVisit, idleDays};
  }).filter(v=>v.idleDays===null || v.idleDays>=60)
    .sort((a,b)=>(b.idleDays??99999)-(a.idleDays??99999));

  // ── Ενεργοί (μη-VIP) πελάτες χωρίς επίσκεψη 90+ ημέρες — υποψήφιοι για επανασύνδεση.
  // Εξαιρούμε όσους δεν έχουν κάνει ΚΑΜΙΑ επίσκεψη ακόμα (νέος πελάτης, όχι churn).
  const reengageInactive = pts.filter(p=>p.status==='active').map(p=>{
    const lastVisitStr = (S.activeLastVisit||{})[p.id];
    const lastVisit = lastVisitStr ? new Date(lastVisitStr) : null;
    const idleDays = lastVisit ? Math.floor((now-lastVisit)/86400000) : null;
    return {patient:p, lastVisit, idleDays};
  }).filter(v=>v.idleDays!==null && v.idleDays>=90)
    .sort((a,b)=>b.idleDays-a.idleDays);

  // ── Ενοποιημένο πάνελ ειδοποιήσεων — μαζεύει σε ένα σημείο ό,τι αλλιώς είναι σκόρπιο
  // σε διαφορετικές σελίδες/widgets, με άμεσο κλικ για δράση. ──
  const todayMissingConsentCount = todayApts.filter(a=>apptMissingConsent(a)).length;
  const activePatientsForGdpr = pts.filter(p=>p.status!=='inactive');
  const gdprSignedCount = activePatientsForGdpr.filter(p=>p.gdpr_signed).length;
  const dashGdprRate = activePatientsForGdpr.length ? Math.round((gdprSignedCount/activePatientsForGdpr.length)*100) : null;
  const alertChips = [
    todayMissingConsentCount>0 && {label:`${todayMissingConsentCount} σήμερα χωρίς συναίνεση`, color:'#A32D2D', bg:'#FCEBEB',
      onclick:"S.page='appointments';S.apptDateFilter=new Date().toLocaleDateString('sv-SE');S.filter='all';render();"},
    dashGdprRate!==null && dashGdprRate<80 && {label:`GDPR συμμόρφωση ${dashGdprRate}%`, color:'#854F0B', bg:'#FAEEDA', onclick:"S.page='consents';render();"},
    vipInactive.length>0 && {label:`${vipInactive.length} VIP ανενεργοί`, color:'#5B21B6', bg:'#EEE9FC',
      onclick:"document.getElementById('vip-inactive-list').classList.remove('vip-hidden');document.getElementById('vip-inactive-list').scrollIntoView({behavior:'smooth',block:'center'});"},
    reengageInactive.length>0 && {label:`${reengageInactive.length} έτοιμοι για επανασύνδεση`, color:'#854F0B', bg:'#FAEEDA',
      onclick:"document.getElementById('reengage-inactive-list').classList.remove('vip-hidden');document.getElementById('reengage-inactive-list').scrollIntoView({behavior:'smooth',block:'center'});"},
  ].filter(Boolean);

// ── PATIENTS ──
function renderPatients() {
  const cid = clinicId();
  if (!cid) return '<div class="page"><div class="empty-state"><div class="empty-icon">⊞</div><div>Επίλεξε κλινική</div></div></div>';
  let filtered = S.patients.filter(p=>{
    // Use global search if on patients page
    const q = (S.globalSearch||S.search||'').toLowerCase();
    const qGreek = q ? latinToGreek(q) : '';
    const ms = !q ||
      (p.full_name&&(p.full_name.toLowerCase().includes(q)||p.full_name.toLowerCase().includes(qGreek))) ||
      (p.phone&&p.phone.includes(q)) ||
      (p.email&&p.email.toLowerCase().includes(q));
    const mf = S.filter==='all'||p.status===S.filter;
    return ms&&mf;
  });

  // Ταξινόμηση με κλικ σε επικεφαλίδα στήλης
  const sortKey = S.patSortKey, sortDir = S.patSortDir||'asc';
  if (sortKey) {
    const val = (p) => {
      if (sortKey==='full_name') return (p.full_name||'').toLowerCase();
      if (sortKey==='phone') return p.phone||'';
      if (sortKey==='status') return p.status||'';
      if (sortKey==='gdpr_signed') return p.gdpr_signed?1:0;
      if (sortKey==='medical_history') return hasMedicalHistoryData(p)?1:0;
      if (sortKey==='consult') return ((S.consultDates||{})[p.id]) ? new Date((S.consultDates||{})[p.id]).getTime() : 0;
      if (sortKey==='ltv') return p.ltv||0;
      return '';
    };
    filtered = [...filtered].sort((a,b)=>{
      const va=val(a), vb=val(b);
      if (va<vb) return sortDir==='asc'?-1:1;
      if (va>vb) return sortDir==='asc'?1:-1;
      return 0;
    });
  }
  const sortArrow = (key) => sortKey===key ? (sortDir==='asc'?' ▲':' ▼') : '';
  const dupGroups = detectDuplicatePatientGroups();
  return `<div class="page">
    <div class="page-header">
      <div><h1 class="page-title">Ασθενείς</h1><p class="page-sub">${S.patients.length} συνολικά · ${S.patients.filter(p=>p.status==='active').length} ενεργοί</p></div>
      <button class="btn btn-primary" data-modal="new-patient">+ Νέος Ασθενής</button>
    </div>
    ${dupGroups.length?`<div style="background:#FFF4E5;border:1px solid #F5C77E;border-radius:10px;padding:12px 16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
      <div style="font-size:12px;color:#8A5A00"><strong>⚠ ${dupGroups.length} πιθανά διπλότυπα</strong> — ίδιο τηλέφωνο σε περισσότερους από έναν ασθενείς.</div>
      <button class="btn btn-sm" id="open-merge-duplicates" style="background:#D97706;color:#fff">Έλεγχος &amp; Συγχώνευση</button>
    </div>`:''}
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px">
      ${[{l:'Σύνολο',v:S.patients.length,bg:'var(--surface)'},{l:'Ενεργοί',v:S.patients.filter(p=>p.status==='active').length,bg:'#E1F5EE'},{l:'VIP',v:S.patients.filter(p=>p.status==='vip').length,bg:'#EEEDFE'},{l:'Leads',v:S.patients.filter(p=>p.status==='lead').length,bg:'#E6F1FB'}].map(s=>`
      <div style="background:${s.bg};border-radius:8px;padding:10px 14px"><div style="font-size:11px;color:var(--text-2);margin-bottom:2px">${s.l}</div><div style="font-size:20px;font-weight:500">${s.v}</div></div>`).join('')}
    </div>
    <div style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center">
      <div class="filter-tabs">
        ${['all','active','vip','lead','inactive'].map(f=>`<button class="filter-tab ${S.filter===f?'active':''}" data-filter="${f}">${f==='all'?'Όλοι':(STATUS_PAT[f]&&STATUS_PAT[f].l)||f}</button>`).join('')}

function renderPatientConsentsTab() {
  const p = S.patientDetail;
  // Ποιες κατηγορίες συναίνεσης αφορούν πραγματικά αυτόν τον ασθενή, με βάση τα
  // ραντεβού που έχει κλείσει (παλιά ή μελλοντικά) — όχι όλες οι κατηγορίες πάντα.
  const requiredGroups = new Set(
    (p&&p.appointments||[]).map(a=>classifyConsentGroup(a.service_name)).filter(Boolean)
  );
  const rows = [
    {
      key: 'gdpr', label: 'GDPR & Ιατρικό Ιστορικό', color: '#0E2757',
      signed: !!(p&&p.gdpr_signed), always: true,
      signedAt: S.historyConsent ? S.historyConsent.signed_at : (p&&p.gdpr_signed_at),
      collectedBy: S.historyConsent&&S.historyConsent.collected_by,
      stale: (() => {
        const at = S.historyConsent ? S.historyConsent.signed_at : (p&&p.gdpr_signed_at);
        return !!(at && (Date.now()-new Date(at).getTime()) > 365*24*3600*1000);
      })(),
      onSign: null, onView: 'viewGdprConsent()',
      hint: 'Συλλέγεται μέσω της εξωτερικής φόρμας ή της Φόρμας Ιστορικού (Ιατρικό Ιστορικό → Επεξεργασία Φόρμας).'
    },
    {
      key: 'laser', label: 'Laser Αποτρίχωση', color: '#C4618A',
      signed: !!S.laserPatientConsent, signedAt: S.laserPatientConsent&&S.laserPatientConsent.signed_at,
      collectedBy: S.laserPatientConsent&&S.laserPatientConsent.collected_by,
      onSign: `openLaserConsentModal()`, onView: `viewLaserConsent()`
    },
    {
      key: 'cleansing', label: 'Καθαρισμοί & Pore Over', color: '#0344F2',
      signed: !!S.serviceConsentCleansing, signedAt: S.serviceConsentCleansing&&S.serviceConsentCleansing.signed_at,
      collectedBy: S.serviceConsentCleansing&&S.serviceConsentCleansing.collected_by,
      onSign: `openGroupConsentModal('cleansing')`, onView: `viewGroupConsent('cleansing')`
    },
    {
      key: 'peelings', label: 'Peelings & PRX-Microneedling', color: '#7C3AED',
      signed: !!S.serviceConsentPeelings, signedAt: S.serviceConsentPeelings&&S.serviceConsentPeelings.signed_at,
      collectedBy: S.serviceConsentPeelings&&S.serviceConsentPeelings.collected_by,
      onSign: `openGroupConsentModal('peelings')`, onView: `viewGroupConsent('peelings')`
    },
    {
      key: 'oxygen', label: 'Οξυγόνο/Ενυδάτωση & Face Treatments', color: '#0F6E56',
      signed: !!S.serviceConsentOxygen, signedAt: S.serviceConsentOxygen&&S.serviceConsentOxygen.signed_at,
      collectedBy: S.serviceConsentOxygen&&S.serviceConsentOxygen.collected_by,
      onSign: `openGroupConsentModal('oxygen')`, onView: `viewGroupConsent('oxygen')`
    },
  ].filter(r => r.always || r.signed || requiredGroups.has(r.key));
  const signedCount = rows.filter(r=>r.signed).length;
  return `<div>
    <div style="font-size:12px;color:var(--text-2);margin-bottom:14px">
      ${signedCount}/${rows.length} συναινέσεις υπογεγραμμένες — κάθε μία υπογράφεται μία φορά και ισχύει για όλες τις μελλοντικές συνεδρίες της κατηγορίας της. Εμφανίζονται μόνο οι κατηγορίες που αφορούν θεραπείες που έχει κλείσει ο ασθενής.
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">
      ${rows.map(r=>`
        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface-2);border-radius:10px;padding:12px 16px;flex-wrap:wrap;border-left:3px solid ${r.signed?'#0F6E56':r.color}">
          <div style="min-width:0">
            <div style="font-size:13px;font-weight:600">${esc(r.label)}</div>
            ${r.signed
              ? `<div style="font-size:11px;color:#0F6E56;margin-top:2px">✓ Υπογεγραμμένο${r.signedAt?' · '+new Date(r.signedAt).toLocaleDateString('el-GR'):''}${r.collectedBy?' · '+esc(r.collectedBy):''}</div>`
              : `<div style="font-size:11px;color:var(--red);margin-top:2px">⚠ Εκκρεμεί${r.hint?' — '+esc(r.hint):''}</div>`}
            ${r.stale ? `<div style="font-size:10px;font-weight:600;color:#854F0B;margin-top:3px">🔄 Προτείνεται ανανέωση (>1 έτος)</div>` : ''}
          </div>
          <div style="display:flex;gap:6px;flex-shrink:0">
            ${r.signed && r.onView ? `<button class="btn btn-ghost btn-sm" onclick="${r.onView}">👁 Προβολή</button>` : ''}
            ${!r.signed && r.onSign ? `<button class="btn btn-primary btn-sm" onclick="${r.onSign}">📝 Υπογραφή</button>` : ''}
          </div>
        </div>`).join('')}
    </div>
  </div>`;
}

            ${S.serviceConsentOxygen

        {id:'laser',l:`Laser Forms (${laserForms.length})`},

        {id:'patconsents',l:'Συναινέσεις'},

const CONSENT_GROUP_LABELS = {laser:'Laser Αποτρίχωσης', cleansing:'Καθαρισμού', peelings:'Peelings', oxygen:'Οξυγόνου/Ενυδάτωσης'};
// Επιστρέφει null αν δεν χρειάζεται συναίνεση ή την έχει ήδη ο ίδιος ο πελάτης.
// Αλλιώς {grp, duplicateHasIt}: duplicateHasIt=true σημαίνει ότι ΥΠΑΡΧΕΙ ήδη υπογεγραμμένη
// συναίνεση, αλλά καταχωρημένη σε ΑΛΛΗ καρτέλα με το ίδιο τηλέφωνο (πιθανό διπλότυπο) —
// διαφορετική κατάσταση από το να μην έχει υπογραφεί καθόλου.
function apptMissingConsent(a) {
  const grp = classifyConsentGroup(a.service_name);
  if (!grp || a.status==='cancelled' || !a.patient_id) return null;
  const sets = {laser:S.laserConsentIds, cleansing:S.cleansingConsentIds, peelings:S.peelingsConsentIds, oxygen:S.oxygenConsentIds};
  const set = sets[grp];
  if (!set || set.has(a.patient_id)) return null;
  const phone = normalizePhone((a.patients&&a.patients.phone)||'');
  const siblingIds = phone && S.patientPhoneGroups ? S.patientPhoneGroups.get(phone) : null;
  const duplicateHasIt = !!(siblingIds && [...siblingIds].some(id => id!==a.patient_id && set.has(id)));
  return {grp, duplicateHasIt};
}

// ── CALENDAR ──
function renderCalendar() {
  const cid = clinicId();
  if (!cid) return '<div class="page"><div class="empty-state"><div class="empty-icon">⊞</div><div>Επίλεξε κλινική</div></div></div>';

  const calView = S.calView||'day';
  const calMode = S.calMode||'therapist'; // therapist | room
  // Parse calDate safely — αν είναι YYYY-MM-DD string, δημιούργησε local date
  const parseCalDate = (s) => {
    if (!s) return new Date();
    // If ISO string with T, extract date part only to avoid UTC shift
    const datePart = s.includes('T') ? s.split('T')[0] : s;
    const [y,m,d] = datePart.split('-').map(Number);
    if (y && m && d) return new Date(y, m-1, d); // local midnight
    return new Date(s);
  };
  const calDate = parseCalDate(S.calDate);
  const staff = S.staff||[];
  const appts = S.appointments||[];
  const canSeeFinancials = canSee(['super_admin','clinic_admin']);

  // Date navigation helpers
  const dateStr = calDate.toLocaleDateString('el-GR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const weekStart = new Date(calDate);
  const calDay = calDate.getDay();
  weekStart.setDate(calDate.getDate() + (calDay===0?-6:1-calDay)); // Monday

  // Clinic hours (configurable per clinic, default 09:00-20:00)
  // Ωράριο ημερολογίου: πάντα τουλάχιστον 08:00–21:00 (καλύπτει και 20:30 ραντεβού).
  // Αν οι ρυθμίσεις κλινικής ορίζουν ευρύτερο ωράριο, επεκτείνεται αντίστοιχα.
  const startHour = Math.min(8, (S.clinic&&S.clinic.settings&&S.clinic.settings.start_hour) || 8);
  const endHour = Math.max(20, (S.clinic&&S.clinic.settings&&S.clinic.settings.end_hour) || 20);
  const hours = [];
  for (let h = startHour; h <= endHour; h++) hours.push(h);

  // Filter appointments for current view
  // Helper: local date string YYYY-MM-DD από Date object
  const localDateStr = (d) => {
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  };
  const calDateStr = localDateStr(calDate);

  const dayAppts = appts.filter(a => {
    const d = new Date(a.start_time);
    return localDateStr(d) === calDateStr;
  });

  // Color by patient status
  const apptColor = globalApptColor;

  // Slot height: 60px per hour, so 1min = 1px
  const PX_PER_MIN = 1.2;
  const HOUR_H = 60 * PX_PER_MIN;

  // Θεραπευτής ραντεβού: από therapist_id (αν υπάρχει) ή από τις σημειώσεις.
  // Δύο γνωστές μορφές σημειώσεων αποθηκεύουν το προσωπικό διαφορετικά:
  //  - "Προσωπικό: X" — gmail-auto-sync, booking247-ingest, το CSV import εργαλείο
  //  - "booking247_id:NNN | X" — ένα άλλο (deployed αλλά όχι στο repo) sync pipeline
  // Χωρίς και τα δύο patterns, ραντεβού από τη 2η πηγή καταλήγουν πάντα στη
  // στήλη "Μη ανατεθειμένα" παρότι η σημείωση περιέχει το σωστό όνομα.
  const apptTherapist = (a) => {
    if (a.therapist_id) {
      const st = staff.find(s=>s.id===a.therapist_id);
      if (st) return st.full_name;
    }
    const notes = a.notes||'';
    const m = notes.match(/Προσωπικό:\s*([^\n·|]+)/i);
    if (m) return m[1].trim();
    const m2 = notes.match(/booking247_id:\S+\s*\|\s*([^\n·|]+)/i);
    return m2 ? m2[1].trim() : null;
  };

  // Στήλες θεραπευτών: ΔΥΝΑΜΙΚΑ από τα ραντεβού της ημέρας — όχι από τη λίστα users.
  // (Οι users αφορούν tiers πρόσβασης/permissions, όχι το πρόγραμμα.)
  // Κανονικοποίηση για σύγκριση ονομάτων/υπηρεσιών χωρίς τόνους/κεφαλαία
  const norm = (s) => (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');

  // Σταθερές στήλες θεραπευτών — πάντα ορατές με αυτή τη σειρά
  const FIXED_THERAPISTS = ['Λίνα','Χριστιάνα','Αθανασία','Νάνσυ'];
  const canonTherapist = (t) => FIXED_THERAPISTS.find(f=>norm(f)===norm(t)) || t;
  const dayTherapistsRaw = [...new Set(dayAppts.map(apptTherapist).filter(Boolean).map(canonTherapist))];
  const extraTherapists = dayTherapistsRaw.filter(t=>!FIXED_THERAPISTS.includes(t)).sort((a,b)=>a.localeCompare(b,'el'));

  // ΔΩΜΑΤΙΑ — αυτόματη ανάθεση με κανόνες υπηρεσίας (render-time, δεν γράφει στη βάση)
  const ROOMS = [
    {id:'laser',   full_name:'Laser'},
    {id:'massage', full_name:'Μασάζ'},
    {id:'body',    full_name:'Σώμα'},
    {id:'electro', full_name:'Ηλεκτρόλυση'},
    {id:'facials1',full_name:'Facials 1'},
    {id:'facials2',full_name:'Facials 2'},
  ];
  const ROOM_IDS = ROOMS.map(r=>r.id);
  const isLaserSvc = (a) => /alexandrite|laser/.test(norm(a.service_name));

  // Ταξινόμηση υπηρεσίας → απαιτούμενη κατηγορία συναίνεσης (για warnings σε ραντεβού)
  const getRequiredConsentGroup = classifyConsentGroup;
  const consentIdsByGroup = {
    laser: S.laserConsentIds, cleansing: S.cleansingConsentIds,
    peelings: S.peelingsConsentIds, oxygen: S.oxygenConsentIds
  };
  const CONSENT_GROUP_LABEL = {laser:'LASER', cleansing:'ΚΑΘΑΡΙΣΜΟΥ', peelings:'PEELING', oxygen:'ΟΞΥΓΟΝΟΥ'};
  const missingConsent = (a) => {
    const grp = getRequiredConsentGroup(a.service_name);
    if (!grp || !a.patient_id) return null;
    const idSet = consentIdsByGroup[grp];
    if (!idSet || idSet.has(a.patient_id)) return null;
    return grp;
  };
  const baseRoomOf = (a) => {
    if (a.room_id && ROOM_IDS.includes(a.room_id)) return a.room_id; // χειροκίνητη ανάθεση υπερισχύει
    const s = norm(a.service_name);
    if (/alexandrite|laser/.test(s)) return 'laser';
    if (/ηλεκτρολυσ/.test(s)) return 'electro';
    if (/μασαζ|drainage|λεμφικ|κερι/.test(s)) return 'massage';
    if (/vacuum|θερμοκουβ|panotherm|mydren/.test(s)) return 'body';
    if (/φρυδ|βαφη|facial|καθαρισμ|peel|ενυδατ|υδροδερμ|glow|οξυγονο|θρεψη|φωτοθεραπ/.test(s)) return 'facials1';
    return 'body'; // fallback — το Σώμα δέχεται όλες τις θεραπείες
  };
  const overlaps = (a,b) => {
    const aS=new Date(a.start_time).getTime(), aE=aS+(a.duration_minutes||60)*60000;
    const bS=new Date(b.start_time).getTime(), bE=bS+(b.duration_minutes||60)*60000;
    return aS<bE && bS<aE;
  };
  // Facials overflow: αν το Facials 1 είναι κατειλημμένο την ίδια ώρα → Facials 2
  const roomMap = {};
  const f1Busy = [];
  [...dayAppts].sort((x,y)=>new Date(x.start_time)-new Date(y.start_time)).forEach(a=>{
    let r = baseRoomOf(a);
    if (r==='facials1' && !a.room_id) {
      if (f1Busy.some(b=>overlaps(a,b))) r='facials2'; else f1Busy.push(a);
    }
    roomMap[a.id] = r;
  });

  // ΔΙΠΛΟΚΡΑΤΗΣΗ LASER — ένα μηχάνημα Alexandrite: εντοπισμός χρονικών επικαλύψεων
  const laserAppts = dayAppts.filter(isLaserSvc);
  const laserConflictIds = new Set();
  for (let i=0;i<laserAppts.length;i++) for (let j=i+1;j<laserAppts.length;j++) {
    if (overlaps(laserAppts[i],laserAppts[j])) { laserConflictIds.add(laserAppts[i].id); laserConflictIds.add(laserAppts[j].id); }
  }

  const cols = calMode==='therapist'
    ? [...FIXED_THERAPISTS.map(n=>({id:'t:'+n,full_name:n})), ...extraTherapists.map(n=>({id:'t:'+n,full_name:n})), {id:'unassigned',full_name:'Μη ανατεθειμένα'}]

  const renderDayView = () => {
    return `
    ${laserConflictIds.size?`<div style="background:rgba(239,68,68,0.12);border-left:4px solid #DC2626;border-radius:8px;padding:10px 14px;margin-bottom:10px;font-size:12px;font-weight:600;color:#B91C1C">
